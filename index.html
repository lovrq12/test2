  /* Vignette center-dark for readability */
  #bg-overlay {
    position: fixed; inset: 0; z-index: 1;
    background:
      radial-gradient(ellipse 55% 70% at 50% 50%, rgba(0,0,0,0.45) 0%, transparent 70%),
      radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(0,0,0,0.5) 80%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }

  /* ── PARTICLES ── */
  #particle-canvas {
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
  }

  /* ── SCANLINES ── */
  .scanlines {
    position: fixed; inset: 0; z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px,
      transparent 1px, transparent 3px);
  }

  /* ── SMOKE ── */
  .smoke-layer { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .smoke-wisp {
    position: absolute; border-radius: 50%; filter: blur(55px); opacity: 0;
    animation: smokeFloat linear infinite;
  }
  @keyframes smokeFloat {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    15%  { opacity: 0.06; }
    85%  { opacity: 0.03; }
    100% { transform: translateY(-75vh) translateX(15px) scale(1.7); opacity: 0; }
  }

  /* ── UI ROOT ── */
  #ui-root {
    position: fixed; inset: 0; z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 0;
  }

  /* ── TITLE ── */
  .title-block {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeUp 1.6s cubic-bezier(0.16,1,0.3,1) forwards;
    opacity: 0;
    transform: translateY(-24px);
  }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  .title-eyebrow {
    font-family: 'Tajawal', sans-serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--crimson-bright);
    margin-bottom: 6px;
    opacity: 0.75;
  }

  .title-en {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(38px, 6vw, 72px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #ffffff 0%, var(--silver-bright) 30%, var(--silver) 60%, #7a8a98 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 18px rgba(220,0,0,0.7)) drop-shadow(0 0 40px rgba(180,0,0,0.35));
  }

  .title-ar {
    font-family: 'Tajawal', sans-serif;
    font-size: clamp(11px, 1.6vw, 15px);
    font-weight: 500;
    letter-spacing: 6px;
    color: var(--crimson-bright);
    margin-top: 8px;
    opacity: 0.8;
  }

  .deco-line {
    display: flex; align-items: center; gap: 10px;
    margin: 14px auto 0;
    width: min(400px, 88vw);
  }
  .deco-line span { flex:1; height:1px; background: linear-gradient(90deg,transparent,var(--crimson-bright),transparent); opacity:0.45; }
  .deco-line i { width:5px; height:5px; background:var(--crimson-bright); transform:rotate(45deg); box-shadow:0 0 6px var(--crimson-glow); flex-shrink:0; }

  /* ── GLASS PANEL ── */
  .glass-panel {
    width: min(400px, 90vw);
    background: linear-gradient(145deg,
      rgba(8,0,0,0.86) 0%,
      rgba(3,0,0,0.92) 50%,
      rgba(12,0,3,0.86) 100%);
    backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    border: 1px solid rgba(140,0,0,0.3);
    border-top: 1px solid rgba(200,30,30,0.55);
    border-radius: 3px;
    padding: 32px 32px 28px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 50px rgba(120,0,0,0.22),
      0 0 100px rgba(70,0,0,0.12),
      inset 0 1px 0 rgba(255,50,50,0.07),
      inset 0 -1px 0 rgba(0,0,0,0.6);
    animation: panelIn 1.8s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
    opacity: 0;
    transform: translateY(18px);
  }
  @keyframes panelIn { to { opacity:1; transform:translateY(0); } }

  /* corner accents */
  .glass-panel::before, .glass-panel::after {
    content:''; position:absolute;
    width:18px; height:18px;
    border-color:rgba(180,0,0,0.55); border-style:solid;
  }
  .glass-panel::before { top:7px; right:7px; border-width:1px 1px 0 0; }
  .glass-panel::after  { bottom:7px; left:7px; border-width:0 0 1px 1px; }

  .panel-inner-glow {
    position:absolute; inset:0;
    background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(130,0,0,0.1) 0%, transparent 70%);
    pointer-events:none;
  }

  /* ── FIELDS ── */
  .field-group { margin-bottom: 13px; position:relative; }

  .field-label {
    font-family:'Tajawal',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--crimson-bright);
    opacity:0.8;
    margin-bottom:6px;
    display:block;
  }

  .field-input {
    width:100%;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(110,0,0,0.4);
    border-bottom: 1px solid rgba(170,0,0,0.65);
    color: var(--silver-bright);
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    font-weight:500;
    padding: 11px 14px;
    outline:none;
    transition: all 0.3s ease;
    border-radius: 2px;
    text-align: right;
    direction: rtl;
  }
  .field-input::placeholder { color:rgba(140,55,55,0.45); font-size:13px; font-weight:300; }
  .field-input:focus {
    border-color:rgba(210,0,0,0.7);
    border-bottom-color:var(--crimson-glow);
    background:rgba(8,0,0,0.88);
    box-shadow: 0 0 18px rgba(160,0,0,0.15);
  }

  /* room code */
  .field-input.code-input {
    text-align:center;
    letter-spacing:8px;
    text-transform:uppercase;
    font-size:16px;
    font-weight:700;
    direction:ltr;
  }

  /* ── DIVIDER ── */
  .section-div {
    display:flex; align-items:center; gap:10px;
    margin: 16px 0 14px;
  }
  .section-div span { flex:1; height:1px; background:rgba(90,0,0,0.4); }
  .section-div p {
    font-family:'Tajawal',sans-serif;
    font-size:10px; font-weight:700;
    letter-spacing:2px; color:rgba(140,50,50,0.6);
  }

  /* ── BUTTONS ── */
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:16px; }

  .btn {
    position:relative;
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    font-weight:700;
    padding:12px 10px;
    border:none;
    cursor:pointer;
    overflow:hidden;
    transition: all 0.3s ease;
    border-radius:2px;
    letter-spacing:1px;
  }
  .btn::after {
    content:'';
    position:absolute; top:0; right:-100%;
    width:60%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,100,100,0.1),transparent);
    transition:right 0.55s ease;
  }
  .btn:hover::after { right:150%; }

  .btn-create {
    background:linear-gradient(135deg,#720000 0%,#4a0000 50%,#2e0000 100%);
    color:var(--silver-bright);
    border:1px solid rgba(180,0,0,0.55);
    border-top:1px solid rgba(230,40,40,0.6);
    box-shadow: 0 4px 18px rgba(100,0,0,0.45), inset 0 1px 0 rgba(255,60,60,0.1);
  }
  .btn-create:hover {
    box-shadow: 0 4px 28px rgba(180,0,0,0.6), 0 0 55px rgba(120,0,0,0.3);
    border-color:rgba(255,50,50,0.75);
    color:#fff;
  }

  .btn-join-room {
    background:linear-gradient(135deg,rgba(8,0,0,0.92),rgba(20,4,4,0.92));
    color:rgba(200,100,100,0.85);
    border:1px solid rgba(90,0,0,0.38);
    box-shadow: inset 0 1px 0 rgba(140,30,30,0.08);
  }
  .btn-join-room:hover {
    color:var(--silver-bright);
    border-color:rgba(170,0,0,0.55);
    box-shadow: 0 0 20px rgba(100,0,0,0.2);
  }

  .btn-enter {
    width:100%;
    background:linear-gradient(135deg,rgba(130,0,0,0.92) 0%,rgba(90,0,0,0.95) 40%,rgba(50,0,0,0.92) 100%);
    color:var(--silver-bright);
    border:1px solid rgba(190,0,0,0.6);
    border-top:1px solid rgba(255,50,50,0.5);
    font-size:15px;
    font-weight:800;
    letter-spacing:3px;
    padding:14px;
    box-shadow:
      0 0 28px rgba(140,0,0,0.4),
      0 4px 18px rgba(80,0,0,0.5),
      inset 0 1px 0 rgba(255,80,80,0.1);
    margin-top:4px;
    transition: all 0.35s ease;
  }
  .btn-enter:hover {
    box-shadow: 0 0 45px rgba(200,0,0,0.5), 0 4px 35px rgba(140,0,0,0.55), 0 0 90px rgba(80,0,0,0.28);
    border-color:rgba(255,50,50,0.8);
    letter-spacing:5px;
    color:#fff;
  }

  /* ── FOOTER ── */
  .panel-footer {
    text-align:center; margin-top:18px;
    font-family:'Tajawal',sans-serif;
    font-size:10px; font-weight:400;
    color:rgba(100,30,30,0.5);
    letter-spacing:1px;
  }

  /* ── BOTTOM COPYRIGHT ── */
  .page-footer {
    position:fixed; bottom:16px; left:0; right:0;
    text-align:center; z-index:11;
    font-family:'Tajawal',sans-serif;
    font-size:10px; font-weight:300;
    color:rgba(120,50,50,0.45);
    letter-spacing:2px;
  }

  /* ── GLOW RING ── */
  .glow-ring {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:480px; height:480px;
    border-radius:50%;
    border:1px solid rgba(100,0,0,0.08);
    pointer-events:none; z-index:5;
    animation:ringPulse 7s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.25; }
    50%      { transform:translate(-50%,-50%) scale(1.12); opacity:0.12; }
  }

  @media(max-width:480px){
    .glass-panel { padding:24px 18px 22px; }
    .btn-row { grid-template-columns:1fr; gap:8px; }
  }
</style>
</head>
<body>

<!-- BACKGROUND -->
<div id="bg-root"></div>
<div id="bg-overlay"></div>

<!-- PARTICLES -->
<canvas id="particle-canvas"></canvas>

<!-- SMOKE -->
<div class="smoke-layer" id="smoke-layer"></div>

<!-- SCANLINES -->
<div class="scanlines"></div>

<!-- GLOW RING -->
<div class="glow-ring"></div>

<!-- ══════════════════════════════
     MAIN UI
══════════════════════════════ -->
<div id="ui-root">

  <!-- TITLE -->
  <div class="title-block">
    <div class="title-eyebrow">◆ &nbsp; ادخل عالم الظل &nbsp; ◆</div>
    <h1 class="title-en">MAFIA</h1>
    <div class="title-ar">ظلال السلطة</div>
    <div class="deco-line"><span></span><i></i><i></i><i></i><span></span></div>
  </div>

  <!-- GLASS PANEL -->
  <div class="glass-panel">
    <div class="panel-inner-glow"></div>

    <!-- الاسم -->
    <div class="field-group">
      <label class="field-label">◆ &nbsp; اسمك</label>
      <input class="field-input" type="text" placeholder="أدخل اسمك ..." autocomplete="off" spellcheck="false"/>
    </div>

    <!-- الأزرار -->
    <div class="section-div">
      <span></span><p>العمليات</p><span></span>
    </div>

    <div class="btn-row">
      <button class="btn btn-create">👑 &nbsp; إنشاء غرفة</button>
      <button class="btn btn-join-room">🚪 &nbsp; الانضمام</button>
    </div>

    <!-- كود الغرفة -->
    <div class="field-group">
      <label class="field-label">◆ &nbsp; كود الغرفة</label>
      <input class="field-input code-input" type="text" placeholder="أدخل الكود ..." maxlength="8" autocomplete="off" spellcheck="false"/>
    </div>

    <!-- زر الدخول -->
    <button class="btn btn-enter">◈ &nbsp;&nbsp; دخول &nbsp;&nbsp; ◈</button>

    <div class="panel-footer">▸ &nbsp; قانون الصمت – أوميرتا &nbsp; ◂</div>
  </div>

</div>

<!-- COPYRIGHT -->
<div class="page-footer">© 2025 MAFIA: SHADOWS OF POWER. ALL RIGHTS RESERVED.</div>

<script>
// ════ PARTICLES ════
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [], shards = [];

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(true); }
  reset(init=false) {
    this.x = Math.random()*W;
    this.y = init ? Math.random()*H : H+10;
    this.vy = -(0.2+Math.random()*0.55);
    this.vx = (Math.random()-0.5)*0.25;
    this.life=0; this.maxLife=180+Math.random()*280;
    this.size=0.5+Math.random()*1.8;
    this.type=Math.random()<0.28?'ember':'dust';
    this.color=this.type==='ember'
      ? `hsl(${Math.random()*20},100%,${38+Math.random()*18}%)`
      : `hsl(0,70%,${12+Math.random()*12}%)`;
  }
  update() {
    this.x+=this.vx+Math.sin(this.life*0.02)*0.25;
    this.y+=this.vy; this.life++;
    if(this.life>this.maxLife||this.y<-10) this.reset();
  }
  draw() {
    const a=Math.sin((this.life/this.maxLife)*Math.PI)*0.65;
    ctx.save(); ctx.globalAlpha=a;
    if(this.type==='ember'){ ctx.shadowBlur=5; ctx.shadowColor=this.color; }
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Shard {
  constructor() { this.reset(true); }
  reset(init=false) {
    this.x=Math.random()*W; this.y=init?Math.random()*H:H+20;
    this.vx=(Math.random()-0.5)*0.45; this.vy=-(0.12+Math.random()*0.3);
    this.rot=Math.random()*Math.PI*2; this.rs=(Math.random()-0.5)*0.018;
    this.size=3+Math.random()*7; this.life=0;
    this.maxLife=380+Math.random()*480; this.op=0.08+Math.random()*0.22;
  }
  update() {
    this.x+=this.vx; this.y+=this.vy; this.rot+=this.rs; this.life++;
    if(this.life>this.maxLife||this.y<-20) this.reset();
  }
  draw() {
    const a=Math.sin((this.life/this.maxLife)*Math.PI)*this.op;
    ctx.save(); ctx.globalAlpha=a;
    ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.strokeStyle='#990000'; ctx.fillStyle='rgba(50,0,0,0.35)';
    ctx.lineWidth=0.5; ctx.shadowBlur=3; ctx.shadowColor='#FF0000';
    ctx.beginPath();
    ctx.moveTo(0,-this.size); ctx.lineTo(this.size*0.55,0);
    ctx.lineTo(0,this.size*0.65); ctx.lineTo(-this.size*0.55,0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

for(let i=0;i<70;i++) particles.push(new Particle());
for(let i=0;i<18;i++) shards.push(new Shard());

function animate() {
  ctx.clearRect(0,0,W,H);
  particles.forEach(p=>{p.update();p.draw();});
  shards.forEach(s=>{s.update();s.draw();});
  requestAnimationFrame(animate);
}
animate();

// ════ SMOKE ════
const smokeLayer=document.getElementById('smoke-layer');
for(let i=0;i<7;i++){
  const w=document.createElement('div');
  w.className='smoke-wisp';
  const sz=140+Math.random()*180;
  w.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${-sz}px;background:radial-gradient(circle,rgba(30,0,0,0.55),transparent);animation-duration:${11+Math.random()*14}s;animation-delay:${Math.random()*11}s;`;
  smokeLayer.appendChild(w);
}

// ════ CURSOR EMBERS ════
document.addEventListener('mousemove',e=>{
  if(Math.random()<0.12){
    const p=new Particle();
    p.x=e.clientX+(Math.random()-0.5)*8;
    p.y=e.clientY+(Math.random()-0.5)*8;
    p.vy=-(0.4+Math.random()*0.9);
    p.type='ember'; p.size=1+Math.random()*1.3;
    p.life=0; p.maxLife=50+Math.random()*55;
    particles.push(p);
    if(particles.length>110) particles.shift();
  }
});

// ════ INPUT GLOW ════
document.querySelectorAll('.field-input').forEach(inp=>{
  inp.addEventListener('input',()=>{
    inp.style.boxShadow=inp.value?'0 0 16px rgba(160,0,0,0.18)':'';
  });
});

// Room code uppercase
document.querySelector('.code-input').addEventListener('input',e=>{
  const pos=e.target.selectionStart;
  e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  e.target.setSelectionRange(pos,pos);
});
</script>
</body>
</html>
