<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RIP RACING</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --red:#cc0000;--red2:#ff1a1a;--red-glow:rgba(204,0,0,0.6);
  --bg:#0a0a0f;--bg2:#0f0f1a;--card:#12121e;--border:#1e1e35;
  --text:#e8e8f0;--muted:#6b6b8a;--accent:#1a1a2e;
  --ps-blue:#00439c;--ps-white:#f0f0f0;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;}

/* ─── CANVAS BACKGROUND ─── */
#cosmos{position:fixed;inset:0;z-index:0;}

/* ─── SCREENS ─── */
.screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.screen.active{display:flex;}

/* ─── PS5 BOOT SCREEN ─── */
#s-boot{background:transparent;}
.ps5-logo{display:flex;gap:6px;margin-bottom:40px;}
.ps5-btn{width:22px;height:22px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;}
.ps5-btn.cross{border-color:#7bc4e2;color:#7bc4e2;}
.ps5-btn.circle{border-color:#e26b7b;color:#e26b7b;}
.ps5-btn.square{border-color:#e2a2cb;color:#e2a2cb;}
.ps5-btn.tri{border-color:#7bc4a0;color:#7bc4a0;}
.rip-title{font-family:'Orbitron',monospace;font-size:clamp(60px,14vw,140px);font-weight:900;line-height:1;text-align:center;position:relative;letter-spacing:6px;}
.rip-title span{background:linear-gradient(135deg,#ff0000,#cc0000,#880000,#ff3300,#ff0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 30px rgba(255,0,0,0.7)) drop-shadow(0 0 60px rgba(200,0,0,0.4));}
.racing-sub{font-family:'Orbitron',monospace;font-size:clamp(12px,3vw,20px);letter-spacing:18px;color:var(--muted);margin-top:8px;text-transform:uppercase;}
.ps5-card-row{display:flex;gap:16px;margin-top:50px;flex-wrap:wrap;justify-content:center;}
.ps5-card{background:linear-gradient(145deg,#161625,#0f0f1e);border:1px solid var(--border);border-radius:14px;padding:20px 32px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;min-width:200px;text-align:center;}
.ps5-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(204,0,0,0.05),transparent);opacity:0;transition:opacity .25s;}
.ps5-card:hover{transform:translateY(-4px);border-color:rgba(204,0,0,0.5);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 30px var(--red-glow);}
.ps5-card:hover::before{opacity:1;}
.ps5-card h3{font-family:'Orbitron',monospace;font-size:14px;color:var(--red2);margin-bottom:6px;letter-spacing:2px;}
.ps5-card p{font-size:13px;color:var(--muted);}
.ps5-card .card-icon{font-size:32px;margin-bottom:12px;}

/* ─── FORMS ─── */
.panel{background:linear-gradient(145deg,#12121e,#0d0d18);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:480px;position:relative;}
.panel-title{font-family:'Orbitron',monospace;font-size:18px;color:var(--red2);margin-bottom:24px;text-align:center;letter-spacing:3px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:2px;text-transform:uppercase;}
.form-group input{width:100%;background:#0a0a14;border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:16px;outline:none;transition:border-color .2s;}
.form-group input:focus{border-color:var(--red);}
.btn{background:linear-gradient(135deg,#cc0000,#990000);border:none;border-radius:12px;padding:14px 28px;color:#fff;font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;width:100%;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(204,0,0,0.5);}
.btn:active{transform:scale(.97);}
.btn-ghost{background:transparent;border:1px solid var(--border);border-radius:12px;padding:12px 24px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;width:100%;margin-top:10px;}
.btn-ghost:hover{border-color:var(--red);color:var(--text);}
.code-display{font-family:'Orbitron',monospace;font-size:36px;letter-spacing:12px;color:var(--red2);text-align:center;padding:20px;background:#0a0a14;border-radius:12px;border:1px solid rgba(204,0,0,0.3);margin:16px 0;cursor:pointer;}
.code-display:hover::after{content:' 📋';}

/* ─── CHARACTER SELECT ─── */
#s-char{overflow-y:auto;}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:600px;margin:16px 0;}
.char-card{background:#12121e;border:2px solid var(--border);border-radius:16px;padding:14px 10px;cursor:pointer;transition:all .22s;text-align:center;position:relative;overflow:hidden;}
.char-card.selected{border-color:var(--red2);box-shadow:0 0 25px var(--red-glow),inset 0 0 20px rgba(204,0,0,0.05);}
.char-card:hover{border-color:rgba(204,0,0,0.5);transform:translateY(-2px);}
.char-sprite{width:80px;height:80px;margin:0 auto 8px;image-rendering:pixelated;}
.char-name{font-family:'Orbitron',monospace;font-size:10px;color:var(--red2);letter-spacing:1px;margin-bottom:4px;}
.char-desc{font-size:11px;color:var(--muted);}

/* ─── LOBBY ─── */
.player-row{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#0a0a14;border-radius:12px;margin-bottom:10px;border:1px solid var(--border);}
.player-avatar-mini{width:44px;height:44px;border-radius:8px;image-rendering:pixelated;}
.player-info{flex:1;}
.player-name{font-weight:700;font-size:15px;}
.player-char-label{font-size:11px;color:var(--muted);}
.host-tag{font-size:10px;color:var(--red2);border:1px solid var(--red);border-radius:4px;padding:2px 6px;font-family:'Orbitron',monospace;letter-spacing:1px;}
.waiting-dots::after{content:'';animation:dots 1.5s infinite;}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}

/* ─── GAME CANVAS ─── */
#s-game{padding:0;background:transparent;}
#gameCanvas{display:block;width:100%;height:100%;image-rendering:pixelated;}

/* ─── HUD ─── */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:none;padding:8px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);pointer-events:none;}
.hud-inner{display:flex;justify-content:space-between;align-items:flex-start;max-width:100%;}
#leaderboard-hud{background:rgba(0,0,0,.7);border:1px solid rgba(204,0,0,.3);border-radius:10px;padding:8px 12px;min-width:140px;}
.hud-pos{font-size:12px;font-family:'Orbitron',monospace;margin:2px 0;color:var(--text);}
.hud-pos.me{color:var(--red2);}
#my-pos-display{font-family:'Orbitron',monospace;font-size:28px;color:var(--red2);text-align:right;text-shadow:0 0 15px var(--red);}
#my-pos-display sup{font-size:14px;}

/* ─── MOBILE CONTROLS ─── */
#mobile-controls{position:fixed;bottom:0;left:0;right:0;z-index:25;display:none;padding:12px 20px;pointer-events:none;}
.ctrl-row{display:flex;justify-content:space-between;align-items:flex-end;}
.ctrl-left,.ctrl-right{display:flex;gap:8px;pointer-events:all;}
.ctrl-btn{width:58px;height:58px;border-radius:14px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;user-select:none;-webkit-user-select:none;active-transform:scale(.9);transition:background .1s;}
.ctrl-btn:active{background:rgba(204,0,0,.5);border-color:var(--red);}
.ctrl-jump{width:68px;height:68px;background:rgba(204,0,0,.4);border-color:var(--red2);}

/* ─── FINISH SCREEN ─── */
#s-finish{background:rgba(0,0,0,.92);}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:20px 0;}
.podium-slot{text-align:center;}
.podium-block{border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:20px;font-weight:900;}
.podium-block.p1{width:90px;height:100px;background:linear-gradient(to top,#cc9900,#ffcc00);color:#000;}
.podium-block.p2{width:80px;height:75px;background:linear-gradient(to top,#888,#bbb);color:#000;}
.podium-block.p3{width:70px;height:55px;background:linear-gradient(to top,#884400,#cc7700);color:#fff;}
.podium-name{font-size:12px;margin-top:6px;color:var(--text);}
.winner-banner{font-family:'Orbitron',monospace;font-size:clamp(24px,6vw,48px);font-weight:900;color:var(--red2);text-shadow:0 0 30px var(--red);text-align:center;animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ─── TOASTS ─── */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);z-index:100;background:#12121e;border:1px solid var(--red);border-radius:10px;padding:12px 24px;font-family:'Orbitron',monospace;font-size:13px;color:var(--red2);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(204,0,0,.4);border-radius:2px;}

/* ─── LOADING ─── */
.loading-ring{width:40px;height:40px;border:3px solid rgba(204,0,0,.2);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* planet anims */
@keyframes floatMars{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-30px) rotate(5deg)}}
@keyframes floatMerc{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(20px) rotate(-8deg)}}
</style>
</head>
<body>

<!-- COSMOS BACKGROUND -->
<canvas id="cosmos"></canvas>

<!-- TOAST -->
<div id="toast"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-inner">
    <div id="leaderboard-hud"></div>
    <div id="my-pos-display"></div>
  </div>
</div>

<!-- MOBILE CONTROLS -->
<div id="mobile-controls">
  <div class="ctrl-row">
    <div class="ctrl-left">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-right">
      <div class="ctrl-btn ctrl-jump" id="btn-jump">▲</div>
    </div>
  </div>
</div>

<!-- ══════════════════ SCREEN: BOOT ══════════════════ -->
<div class="screen active" id="s-boot">
  <div class="ps5-logo">
    <div class="ps5-btn cross">✕</div>
    <div class="ps5-btn circle">○</div>
    <div class="ps5-btn square">□</div>
    <div class="ps5-btn tri">△</div>
  </div>
  <div class="rip-title"><span>RIP</span></div>
  <div class="racing-sub">Racing</div>
  <div class="ps5-card-row">
    <div class="ps5-card" onclick="goto('s-create')">
      <div class="card-icon">🎮</div>
      <h3>Create Room</h3>
      <p>Host a new race</p>
    </div>
    <div class="ps5-card" onclick="goto('s-join')">
      <div class="card-icon">🔗</div>
      <h3>Join Room</h3>
      <p>Enter a code to join</p>
    </div>
  </div>
</div>

<!-- ══════════════════ SCREEN: CREATE ══════════════════ -->
<div class="screen" id="s-create">
  <div class="panel">
    <div class="panel-title">⚡ HOST RACE</div>
    <div class="form-group">
      <label>Your Name</label>
      <input id="create-name" placeholder="Enter your name..." maxlength="16">
    </div>
    <button class="btn" onclick="doCreate()">CREATE ROOM</button>
    <button class="btn-ghost" onclick="goto('s-boot')">← Back</button>
  </div>
</div>

<!-- ══════════════════ SCREEN: JOIN ══════════════════ -->
<div class="screen" id="s-join">
  <div class="panel">
    <div class="panel-title">🔗 JOIN RACE</div>
    <div class="form-group">
      <label>Your Name</label>
      <input id="join-name" placeholder="Enter your name..." maxlength="16">
    </div>
    <div class="form-group">
      <label>Room Code</label>
      <input id="join-code" placeholder="XXXX" maxlength="4" style="letter-spacing:8px;text-align:center;font-size:22px;font-family:'Orbitron',monospace;">
    </div>
    <button class="btn" onclick="doJoin()">JOIN RACE</button>
    <button class="btn-ghost" onclick="goto('s-boot')">← Back</button>
  </div>
</div>

<!-- ══════════════════ SCREEN: CHARACTER SELECT ══════════════════ -->
<div class="screen" id="s-char">
  <div class="panel-title" style="font-family:'Orbitron',monospace;font-size:16px;color:var(--red2);letter-spacing:3px;margin-bottom:12px;">SELECT CHARACTER</div>
  <div class="char-grid" id="char-grid"></div>
  <button class="btn" style="max-width:300px" onclick="doSelectChar()">CONFIRM →</button>
</div>

<!-- ══════════════════ SCREEN: LOBBY ══════════════════ -->
<div class="screen" id="s-lobby">
  <div class="panel">
    <div class="panel-title">⏳ RACE LOBBY</div>
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:6px;">ROOM CODE</div>
      <div class="code-display" id="lobby-code" onclick="copyCode()">----</div>
      <div style="font-size:11px;color:var(--muted);">Click to copy · Share with friends</div>
    </div>
    <div id="lobby-players" style="max-height:260px;overflow-y:auto;"></div>
    <div id="lobby-action" style="margin-top:16px;"></div>
  </div>
</div>

<!-- ══════════════════ SCREEN: GAME ══════════════════ -->
<div class="screen" id="s-game">
  <canvas id="gameCanvas"></canvas>
</div>

<!-- ══════════════════ SCREEN: FINISH ══════════════════ -->
<div class="screen" id="s-finish">
  <div class="winner-banner" id="winner-text">🏆 WINNER! 🏆</div>
  <div class="podium" id="podium"></div>
  <div id="finish-players" style="width:100%;max-width:400px;margin:0 auto 20px;"></div>
  <button class="btn" style="max-width:300px" id="play-again-btn">PLAY AGAIN</button>
</div>

// ════════════════════════════════════════════════
// COSMOS BACKGROUND
// ════════════════════════════════════════════════
(function(){
  const cv=document.getElementById('cosmos');
  const cx=cv.getContext('2d');
  let W,H,stars=[];
  const planets=[
    {x:.75,y:.3,r:90,c1:'#8B3A2A',c2:'#C4694E',name:'mars',phase:0,speed:.0003,rings:false},
    {x:.15,y:.65,r:55,c1:'#9A8B6E',c2:'#C8B89A',name:'merc',phase:2,speed:.0005,rings:false}
  ];
  function init(){
    W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
    stars=[];
    for(let i=0;i<250;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,a:Math.random(),s:Math.random()*.004+.001});
  }
  function drawPlanet(p,t){
    const px=p.x*W+Math.sin(t*p.speed+p.phase)*30;
    const py=p.y*H+Math.cos(t*p.speed*0.7+p.phase)*20;
    cx.save();
    // Atmosphere glow
    const glow=cx.createRadialGradient(px,py,p.r*.6,px,py,p.r*1.8);
    glow.addColorStop(0,'rgba(180,80,40,0.12)');glow.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=glow;cx.beginPath();cx.arc(px,py,p.r*1.8,0,Math.PI*2);cx.fill();
    // Planet body
    const grad=cx.createRadialGradient(px-p.r*.3,py-p.r*.3,p.r*.1,px,py,p.r);
    grad.addColorStop(0,p.c2);grad.addColorStop(.6,p.c1);grad.addColorStop(1,'#1a0a08');
    cx.fillStyle=grad;cx.beginPath();cx.arc(px,py,p.r,0,Math.PI*2);cx.fill();
    // Surface bands
    cx.globalAlpha=.15;
    for(let i=0;i<5;i++){
      const by=py-p.r+p.r*.4*i;
      cx.fillStyle='rgba(0,0,0,.4)';
      cx.beginPath();cx.ellipse(px,by,p.r*.9,p.r*.06,0,0,Math.PI*2);cx.fill();
    }
    cx.globalAlpha=1;
    // Terminator shadow
    const shadow=cx.createLinearGradient(px-p.r,py,px+p.r,py);
    shadow.addColorStop(0,'rgba(0,0,0,0)');shadow.addColorStop(.55,'rgba(0,0,0,0)');shadow.addColorStop(1,'rgba(0,0,0,.65)');
    cx.fillStyle=shadow;cx.beginPath();cx.arc(px,py,p.r,0,Math.PI*2);cx.fill();
    cx.restore();
  }
  function draw(){
    cx.clearRect(0,0,W,H);
    // Space gradient
    const bg=cx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#03030a');bg.addColorStop(.5,'#060610');bg.addColorStop(1,'#08080f');
    cx.fillStyle=bg;cx.fillRect(0,0,W,H);
    // Nebula hints
    cx.save();cx.globalAlpha=.08;
    const neb=cx.createRadialGradient(W*.3,H*.4,0,W*.3,H*.4,W*.4);
    neb.addColorStop(0,'#440010');neb.addColorStop(1,'transparent');
    cx.fillStyle=neb;cx.fillRect(0,0,W,H);cx.restore();
    // Stars
    const t=Date.now();
    for(const s of stars){
      const a=.2+.6*(Math.sin(t*s.s+s.x)*.5+.5);
      cx.fillStyle=`rgba(220,210,255,${a})`;
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fill();
    }
    // Planets
    planets.forEach(p=>drawPlanet(p,t));
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',init);
  init();draw();
})();

const CHAR_COLORS={X:'#cccccc',O:'#ff4444',A:'#4a7c4e',L:'#8b4513',W:'#f0f0f0',
  F:'#e0e0e8',H:'#6b5a3a',B:'#7a6040',G:'#44cc44',K:'#1a1a2e',M:'#888888',
  S:'#2a2a3e'};

function drawCharSprite(ctx,charDef,x,y,scale=4,dir=1){
  const lines=charDef.pixels.trim().split('\n').map(l=>l.trim());
  ctx.save();
  if(dir===-1){ctx.scale(-1,1);x=-x-lines[0].length*scale;}
  lines.forEach((row,ry)=>{
    [...row].forEach((c,rx)=>{
      if(c==='.'||c===' ')return;
      ctx.fillStyle=CHAR_COLORS[c]||charDef.color;
      ctx.fillRect(x+rx*scale,y+ry*scale,scale,scale);
    });
  });
  ctx.restore();
}

// ════════════════════════════════════════════════
// GAME ENGINE
// ════════════════════════════════════════════════
const GRAVITY=0.55;const JUMP=-12;const SPEED=4;
const TILE=40;

// Track generator (deterministic from roomCode seed)
function seedRng(seed){
  let s=0;for(let c of seed)s+=c.charCodeAt(0);
  return ()=>{s=(s*9301+49297)%233280;return s/233280;};
}

function buildTrack(seed,trackLen){
  const rng=seedRng(seed);
  const platforms=[];const traps=[];
  // Ground
  platforms.push({x:0,y:420,w:trackLen+200,h:20,type:'ground'});
  // Generate platforms, gaps, obstacles
  let cx=300;
  while(cx<trackLen-300){
    const type=Math.floor(rng()*4);
    if(type===0){
      // Elevated platform
      const pw=80+rng()*120;const ph=rng()>.5?280:320;
      platforms.push({x:cx,y:ph,w:pw,h:16,type:'plat'});
      // maybe trap on top
      if(rng()>.6)traps.push({x:cx+pw*.3,y:ph-24,w:18,h:24,type:'spike'});
      cx+=pw+40+rng()*60;
    } else if(type===1){
      // Moving platform
      const pw=70+rng()*60;const py=300+rng()*100;
      platforms.push({x:cx,y:py,w:pw,h:14,type:'moving',ox:cx,range:100+rng()*80,speed:1+rng()*1.5,t:rng()*Math.PI*2});
      cx+=pw+80+rng()*80;
    } else if(type===2){
      // Gap with fire pit
      const gw=60+rng()*80;
      traps.push({x:cx,y:420,w:gw,h:20,type:'fire'});
      // Remove ground under gap - done by just leaving it
      cx+=gw+40+rng()*60;
    } else {
      // Stair platforms
      for(let s=0;s<3;s++){
        platforms.push({x:cx+s*70,y:380-s*50,w:70,h:14,type:'plat'});
      }
      cx+=3*70+60+rng()*60;
    }
    if(cx>trackLen)break;
  }
  // Falling rocks (periodic)
  for(let rx=400;rx<trackLen-200;rx+=200+rng()*150){
    traps.push({x:rx,y:-50,w:24,h:24,type:'rock',vy:0,startX:rx,startY:-50,active:false,timer:rng()*300});
  }
  // Finish flag
  platforms.push({x:trackLen-60,y:300,w:80,h:14,type:'finish'});

  return {platforms,traps};
}

let track=null;let localGameState=null;let myPlayerState=null;
let camera={x:0};

function startLocalGame(){
  clearListeners();
  goto('s-game');
  document.getElementById('hud').style.display='block';
  setupMobileControls();
  // Listen to full game state
  dbListen('rr/'+roomCode+'/gameState',gs=>{
    if(!gs)return;
    if(!track){
      track=buildTrack(roomCode,gs.trackLen||8000);
    }
    localGameState=JSON.parse(JSON.stringify(gs));
    if(!myPlayerState&&gs.players&&gs.players[myId]){
      myPlayerState=JSON.parse(JSON.stringify(gs.players[myId]));
    }
  });
  dbListen('rr/'+roomCode+'/status',st=>{
    if(st==='finished'){
      dbListenOnce('rr/'+roomCode+'/finishOrder',fo=>{
        finishOrder=fo||[];
        setTimeout(()=>showFinishScreen(fo),1000);
      });
    }
  });
  if(animFrame)cancelAnimationFrame(animFrame);
  gameLoop();
}
function dbListenOnce(path,cb){
  db.ref(path).once('value').then(s=>cb(s.val()));
}

let lastTime=0;
function gameLoop(ts=0){
  animFrame=requestAnimationFrame(gameLoop);
  const dt=Math.min((ts-lastTime)/16.67,3);lastTime=ts;
  update(dt);render();
}

function update(dt){
  if(!localGameState||!myPlayerState||!track)return;
  const p=myPlayerState;
  // Input
  if(localKeys.left){p.vx-=1.2;p.dir=-1;}
  else if(localKeys.right){p.vx+=1.2;p.dir=1;}
  else{p.vx*=0.75;}
  p.vx=Math.max(-SPEED,Math.min(SPEED,p.vx));
  if(localKeys.up&&p.onGround){p.vy=JUMP;p.onGround=false;}
  p.vy+=GRAVITY;
  p.x+=p.vx;p.y+=p.vy;
  // Collision with platforms
  p.onGround=false;
  for(const pl of track.platforms){
    if(pl.type==='moving'){
      pl.t=(pl.t||0)+0.02;
      pl.x=pl.ox+Math.sin(pl.t)*pl.range;
    }
    if(rectOverlap(p,pl,20,32)){
      const overlapY=(p.y+32)-(pl.y);
      const overlapYUp=pl.y+pl.h-p.y;
      if(p.vy>=0&&overlapY>0&&overlapY<20){
        p.y=pl.y-32;p.vy=0;p.onGround=true;
        if(pl.type==='moving')p.x+=pl.vx||0;
        if(pl.type==='finish'&&!p.finished){
          p.finished=true;p.finishTime=Date.now();
          onPlayerFinish();
        }
      } else if(p.vy<0&&overlapYUp>0&&overlapYUp<16){
        p.y=pl.y+pl.h;p.vy=0;
      }
    }
  }
  // Traps
  if(!p.finished){
    for(const tr of track.traps){
      if(tr.type==='fire'||tr.type==='spike'){
        if(rectOverlap(p,tr,20,32)){
          p.x=80;p.y=380;p.vx=0;p.vy=0;toast('💀 Respawning!');
        }
      }
      if(tr.type==='rock'){
        tr.timer-=1;
        if(tr.timer<=0){tr.active=true;}
        if(tr.active){
          tr.vy+=GRAVITY*.5;tr.y+=tr.vy;
          if(rectOverlap(p,tr,20,32)){p.x=80;p.y=380;p.vx=0;p.vy=0;toast('🪨 Rock hit!');}
          if(tr.y>500){tr.y=tr.startY;tr.vy=0;tr.active=false;tr.timer=200+Math.random()*300;}
        }
      }
    }
  }
  // Boundary
  if(p.y>500){p.x=Math.max(80,p.x-50);p.y=380;p.vx=0;p.vy=0;}
  if(p.x<0)p.x=0;
  // Camera
  camera.x=Math.max(0,p.x-window.innerWidth*.35);
  // Push to firebase throttled
  const now=Date.now();
  if(now-lastPushTime>80){
    lastPushTime=now;
    db.ref('rr/'+roomCode+'/gameState/players/'+myId).update({
      x:Math.round(p.x),y:Math.round(p.y),vx:Math.round(p.vx*10)/10,
      vy:Math.round(p.vy*10)/10,dir:p.dir,onGround:p.onGround,
      finished:p.finished,finishTime:p.finishTime
    });
  }
}

function rectOverlap(p,pl,pw,ph){
  return p.x+pw>pl.x&&p.x<pl.x+pl.w&&p.y+ph>pl.y&&p.y<pl.y+pl.h;
}

let finishReported=false;
function onPlayerFinish(){
  if(finishReported)return;finishReported=true;
  db.ref('rr/'+roomCode+'/finishOrder').once('value').then(s=>{
    const fo=s.val()||[];
    fo.push({id:myId,name:myPlayerState.name,char:myPlayerState.char,time:Date.now()});
    db.ref('rr/'+roomCode+'/finishOrder').set(fo);
    // Check if all finished
    db.ref('rr/'+roomCode+'/gameState/players').once('value').then(ps=>{
      const players=ps.val();
      if(!players)return;
      const total=Object.keys(players).length;
      if(fo.length>=total){db.ref('rr/'+roomCode+'/status').set('finished');}
    });
    toast('🏁 You finished! #'+fo.length);
  });
}

// ════════════════════════════════════════════════
// RENDERER
// ════════════════════════════════════════════════
const cv2=document.getElementById('gameCanvas');
const ctx2=cv2.getContext('2d');
const PALLETE={sky1:'#0d0d1a',sky2:'#1a1a2e',ground:'#2a1a0a',groundTop:'#3d2a10',plat:'#1e3a2a',platTop:'#2d5a3a',moving:'#1a2a4a',movTop:'#2a4a7a',finish:'#8b6914',finTop:'#d4aa20'};

function render(){
  if(!localGameState||!track)return;
  cv2.width=window.innerWidth;cv2.height=window.innerHeight;
  const W=cv2.width,H=cv2.height;
  ctx2.imageSmoothingEnabled=false;
  // Sky
  const sky=ctx2.createLinearGradient(0,0,0,H);sky.addColorStop(0,PALLETE.sky1);sky.addColorStop(1,PALLETE.sky2);
  ctx2.fillStyle=sky;ctx2.fillRect(0,0,W,H);
  // Background hills
  ctx2.fillStyle='rgba(30,10,60,0.4)';
  for(let hx=0;hx<W+200;hx+=150){
    const bx=((hx-camera.x*.3)%((W+200)))-100;
    ctx2.beginPath();ctx2.ellipse(bx,H*.7,80,50,0,0,Math.PI*2);ctx2.fill();
  }
  ctx2.save();ctx2.translate(-camera.x,0);
  // Platforms & traps
  renderTrack(H);
  // Players
  if(localGameState.players){
    const sorted=Object.entries(localGameState.players).sort((a,b)=>b[1].x-a[1].x);
    sorted.forEach(([pid,p],i)=>{
      const isMe=pid===myId;
      // Shadow
      ctx2.fillStyle='rgba(0,0,0,0.4)';ctx2.beginPath();ctx2.ellipse(p.x+10,p.y+33,16,5,0,0,Math.PI*2);ctx2.fill();
      // Sprite
      drawCharSprite(ctx2,CHARS[p.char],p.x,p.y,4,p.dir||1);
      // Name tag
      ctx2.fillStyle=isMe?'#ff4444':'#ffffff';
      ctx2.font='bold 11px Rajdhani,sans-serif';
      ctx2.textAlign='center';
      ctx2.fillText(p.name,p.x+10,p.y-6);
      // Position badge
      if(i<3){
        const medals=['🥇','🥈','🥉'];
        ctx2.font='14px serif';
        ctx2.fillText(medals[i],p.x+10,p.y-18);
      }
    });
    // HUD leaderboard
    const lbEl=document.getElementById('leaderboard-hud');
    lbEl.innerHTML='';
    const myIdx=sorted.findIndex(([pid])=>pid===myId);
    sorted.forEach(([pid,p],i)=>{
      const div=document.createElement('div');div.className='hud-pos'+(pid===myId?' me':'');
      const medals=['🥇','🥈','🥉'];
      div.textContent=(i<3?medals[i]:(i+1)+'.')+' '+p.name+(p.finished?' ✓':'');
      lbEl.appendChild(div);
    });
    const posEl=document.getElementById('my-pos-display');
    posEl.innerHTML=(myIdx+1)+'<sup>'+(myIdx===0?'st':myIdx===1?'nd':myIdx===2?'rd':'th')+'</sup>';
  }
  ctx2.restore();
}

function renderTrack(H){
  if(!track)return;
  const time=Date.now()/1000;
  for(const pl of track.platforms){
    let fc,tc;
    if(pl.type==='ground'){fc=PALLETE.ground;tc=PALLETE.groundTop;}
    else if(pl.type==='moving'){fc=PALLETE.moving;tc=PALLETE.movTop;}
    else if(pl.type==='finish'){fc=PALLETE.finish;tc=PALLETE.finTop;}
    else{fc=PALLETE.plat;tc=PALLETE.platTop;}
    ctx2.fillStyle=fc;ctx2.fillRect(pl.x,pl.y,pl.w,pl.h+(pl.type==='ground'?200:0));
    ctx2.fillStyle=tc;ctx2.fillRect(pl.x,pl.y,pl.w,4);
    if(pl.type==='finish'){
      // Checkered flag effect
      ctx2.fillStyle='#fff';
      for(let fx=pl.x;fx<pl.x+pl.w;fx+=20){
        ctx2.fillRect(fx,pl.y-40,4,40);
      }
      ctx2.fillStyle='rgba(212,170,32,0.6)';
      ctx2.font='bold 18px Orbitron,monospace';ctx2.textAlign='center';
      ctx2.fillText('FINISH',pl.x+pl.w/2,pl.y-50);
      // Glow
      const fg=ctx2.createLinearGradient(pl.x,pl.y-80,pl.x+pl.w,pl.y);
      fg.addColorStop(0,'rgba(212,170,32,0.1)');fg.addColorStop(1,'rgba(212,170,32,0)');
      ctx2.fillStyle=fg;ctx2.fillRect(pl.x,pl.y-80,pl.w,80);
    }
  }
  for(const tr of track.traps){
    if(tr.type==='fire'){
      const flicker=0.7+0.3*Math.sin(time*12+tr.x);
      const fg=ctx2.createLinearGradient(tr.x,tr.y,tr.x,tr.y-40);
      fg.addColorStop(0,'rgba(255,80,0,'+flicker+')');fg.addColorStop(1,'rgba(255,200,0,0)');
      ctx2.fillStyle=fg;ctx2.fillRect(tr.x,tr.y-40*flicker,tr.w,40*flicker);
      ctx2.fillStyle='#ff4400';ctx2.fillRect(tr.x,tr.y,tr.w,4);
    }
    if(tr.type==='spike'){
      ctx2.fillStyle='#888';
      for(let sx=tr.x;sx<tr.x+tr.w;sx+=6){
        ctx2.beginPath();ctx2.moveTo(sx,tr.y+tr.h);ctx2.lineTo(sx+3,tr.y);ctx2.lineTo(sx+6,tr.y+tr.h);ctx2.fill();
      }
    }
    if(tr.type==='rock'&&tr.active){
      ctx2.fillStyle='#555';
      ctx2.beginPath();ctx2.arc(tr.x+tr.w/2,tr.y+tr.h/2,tr.w/2,0,Math.PI*2);ctx2.fill();
      ctx2.fillStyle='#444';ctx2.fillRect(tr.x+4,tr.y+4,6,6);
    }
  }
}

function setupMobileControls(){
  const isMobile='ontouchstart' in window||window.innerWidth<768;

  mc.style.display=isMobile?'block':'none';
  ['left','right','jump'].forEach(key=>{

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')localKeys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')localKeys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')localKeys.up=true;
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')localKeys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')localKeys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')localKeys.up=false;

function showFinish(){
  dbListenOnce('rr/'+roomCode+'/finishOrder',fo=>{showFinishScreen(fo||[]);});
}
function showFinishScreen(fo){
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  document.getElementById('hud').style.display='none';
  document.getElementById('mobile-controls').style.display='none';
  if(!fo||fo.length===0){goto('s-finish');return;}
  const winner=fo[0];
  document.getElementById('winner-text').textContent='🏆 '+winner.name.toUpperCase()+' WINS! 🏆';
  // Podium
  const podEl=document.getElementById('podium');podEl.innerHTML='';
  const positions=[fo[1],fo[0],fo[2]].filter(Boolean);
  const classes=['p2','p1','p3'];const labels=['2ND','1ST','3RD'];
  positions.forEach((p,i)=>{
    const slot=document.createElement('div');slot.className='podium-slot';
    const bl=document.createElement('div');bl.className='podium-block '+classes[i];bl.textContent=labels[i];
    const cv3=document.createElement('canvas');cv3.width=50;cv3.height=50;cv3.style.cssText='width:50px;height:50px;image-rendering:pixelated;display:block;margin:4px auto 0;';
    drawCharSprite(cv3.getContext('2d'),CHARS[p.char],2,2,3);
    const nm=document.createElement('div');nm.className='podium-name';nm.textContent=p.name;
    slot.appendChild(bl);slot.appendChild(cv3);slot.appendChild(nm);
    podEl.appendChild(slot);
  });
  // Full results
  const fp=document.getElementById('finish-players');fp.innerHTML='';
  fo.forEach((p,i)=>{
    const div=document.createElement('div');div.className='player-row';div.style.marginBottom='8px';
    div.innerHTML=`<span style="font-family:'Orbitron',monospace;font-size:16px;color:var(--red2);margin-right:8px;">${i+1}.</span><span style="font-weight:700;">${p.name}</span><span style="margin-left:auto;color:var(--muted);font-size:12px;">${CHARS[p.char].name}</span>`;
    fp.appendChild(div);
  });
  // Play again
  const btn=document.getElementById('play-again-btn');
  btn.onclick=()=>{
    clearListeners();
    if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
    track=null;localGameState=null;myPlayerState=null;finishReported=false;finishOrder=[];
    localKeys={left:false,right:false,up:false};
    if(isHost){buildCharGrid();goto('s-char');}
    else{buildCharGrid();goto('s-char');}
  };
  goto('s-finish');
}
</script>
</body>
</html>
