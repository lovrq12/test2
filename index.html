<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIP RACING - لعبة السباق</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap');

:root {
  --ps5-bg: #0a0e1a;
  --ps5-blue: #003791;
  --ps5-accent: #00439c;
  --ps5-white: #f0f4ff;
  --ps5-card: rgba(255,255,255,0.06);
  --red-glow: #cc0000;
  --red-bright: #ff2222;
  --gold: #c9a84c;
  --snow-color: rgba(200,220,255,0.7);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--ps5-bg);
  color: var(--ps5-white);
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  user-select: none;
}

/* ===== SNOW CANVAS ===== */
#snowCanvas {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events: none;
  z-index: 1;
}

/* ===== PLANET BG ===== */
#bgCanvas {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index: 0;
}

/* ===== SCREENS ===== */
.screen {
  position: absolute;
  top:0; left:0;
  width:100%; height:100%;
  display: none;
  z-index: 10;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.screen.active { display: flex; }

/* ===== LANDING SCREEN ===== */
#landingScreen {
  background: transparent;
}

.ps5-header {
  position: absolute;
  top: 0; left:0; right:0;
  padding: 18px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(10,14,26,0.6);
  backdrop-filter: blur(20px);
  z-index: 20;
}

.ps5-logo {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
}

.ps5-time {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  font-family: 'Orbitron', monospace;
}

.landing-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding-top: 60px;
}

.rip-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(80px, 14vw, 160px);
  font-weight: 900;
  letter-spacing: 12px;
  line-height: 1;
  background: radial-gradient(ellipse at center, #ff6666 0%, #cc0000 30%, #800000 60%, #3d0000 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 40px rgba(204,0,0,0.8)) drop-shadow(0 0 80px rgba(204,0,0,0.4));
  animation: ripPulse 2s ease-in-out infinite alternate;
  position: relative;
}

@keyframes ripPulse {
  from { filter: drop-shadow(0 0 30px rgba(204,0,0,0.8)) drop-shadow(0 0 60px rgba(204,0,0,0.4)); }
  to   { filter: drop-shadow(0 0 60px rgba(255,50,50,1)) drop-shadow(0 0 120px rgba(204,0,0,0.6)); }
}

.rip-subtitle {
  font-family: 'Cairo', sans-serif;
  font-size: 22px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 8px;
  text-transform: uppercase;
  margin-top: -20px;
}

.ps5-btn-group {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.ps5-btn {
  position: relative;
  padding: 16px 48px;
  font-family: 'Cairo', sans-serif;
  font-size: 17px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  border-radius: 40px;
  overflow: hidden;
  transition: all 0.3s;
  letter-spacing: 2px;
}

.ps5-btn-primary {
  background: linear-gradient(135deg, #003791, #0070d1);
  color: white;
  box-shadow: 0 0 30px rgba(0,112,209,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
}
.ps5-btn-primary:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 0 50px rgba(0,112,209,0.7);
}

.ps5-btn-secondary {
  background: rgba(255,255,255,0.08);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
}
.ps5-btn-secondary:hover {
  background: rgba(255,255,255,0.14);
  transform: translateY(-2px);
}

/* ===== MODAL / PANEL ===== */
.ps5-panel {
  background: rgba(12,16,30,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 40px;
  width: min(500px, 92vw);
  backdrop-filter: blur(30px);
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: panelIn 0.3s ease;
}
@keyframes panelIn {
  from { transform: scale(0.9) translateY(20px); opacity:0; }
  to   { transform: scale(1) translateY(0); opacity:1; }
}

.panel-title {
  font-family: 'Orbitron', monospace;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 28px;
  text-align: center;
  color: var(--ps5-white);
  letter-spacing: 3px;
}

.ps5-input {
  width: 100%;
  padding: 14px 20px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  color: white;
  font-family: 'Cairo', sans-serif;
  font-size: 16px;
  outline: none;
  transition: all 0.3s;
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 16px;
}
.ps5-input:focus {
  border-color: rgba(0,112,209,0.6);
  box-shadow: 0 0 20px rgba(0,112,209,0.2);
  background: rgba(255,255,255,0.1);
}
.ps5-input::placeholder { color: rgba(255,255,255,0.25); letter-spacing:1px; }

/* ===== CHARACTER SELECT ===== */
#charScreen {
  background: transparent;
  padding: 80px 20px 20px;
  overflow-y: auto;
}

.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

.char-card {
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 20px 10px;
  cursor: pointer;
  transition: all 0.3s;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.char-card::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,55,145,0.3) 100%);
  opacity:0;
  transition: opacity 0.3s;
}
.char-card:hover::before, .char-card.selected::before { opacity:1; }
.char-card:hover, .char-card.selected {
  border-color: rgba(0,112,209,0.7);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,112,209,0.3);
}
.char-card.selected {
  border-color: #0070d1;
  box-shadow: 0 0 30px rgba(0,112,209,0.5);
}

.char-sprite {
  width: 80px;
  height: 80px;
  margin: 0 auto 12px;
  display: block;
}

.char-name {
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  letter-spacing: 1px;
}
.char-role {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-top: 4px;
}

/* ===== LOBBY ===== */
.room-code-display {
  font-family: 'Orbitron', monospace;
  font-size: 52px;
  font-weight: 900;
  letter-spacing: 16px;
  color: white;
  text-align: center;
  background: linear-gradient(135deg, #003791, #0070d1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(0,112,209,0.6));
  margin: 10px 0 5px;
}

.room-code-label {
  font-size: 12px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.3);
  text-align: center;
  margin-bottom: 30px;
  text-transform: uppercase;
}

.lobby-players {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 24px;
  max-width: 500px;
  width: 100%;
}

.lobby-player-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

.lobby-player-card.filled {
  border-color: rgba(0,112,209,0.4);
  background: rgba(0,55,145,0.15);
}

.lobby-player-sprite { width:36px; height:36px; margin-bottom:5px; }
.lobby-player-name { font-size:12px; font-weight:700; }
.lobby-empty-text { font-size:11px; color:rgba(255,255,255,0.2); }

/* ===== GAME CANVAS ===== */
#gameScreen {
  background: transparent;
  padding: 0;
}
#gameCanvas {
  display: block;
  width: 100vw;
  height: 100vh;
  z-index: 5;
  position: relative;
}

/* ===== HUD ===== */
#hud {
  position: fixed;
  top: 0; left:0; right:0;
  display: none;
  z-index: 30;
  pointer-events: none;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(10,14,26,0.85) 0%, transparent 100%);
}

.hud-positions {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
}

.hud-player {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 30px;
  padding: 5px 14px 5px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
}

.hud-pos {
  width: 24px; height:24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: flex; align-items:center; justify-content:center;
  font-size: 11px;
  font-family: 'Orbitron', monospace;
}
.hud-pos.first { background: #c9a84c; color:#000; }
.hud-pos.second { background: #aaa; color:#000; }
.hud-pos.third { background: #cd7f32; color:#000; }

/* ===== TOUCH CONTROLS ===== */
#touchControls {
  position: fixed;
  bottom: 20px;
  left: 0; right:0;
  display: none;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 40;
  pointer-events: none;
}

.touch-side {
  display: flex;
  gap: 10px;
  pointer-events: all;
}

.touch-btn {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 22px;
  display: flex; align-items:center; justify-content:center;
  cursor: pointer;
  backdrop-filter: blur(10px);
  active-color: rgba(0,112,209,0.5);
  transition: background 0.1s;
}
.touch-btn:active { background: rgba(0,112,209,0.4); }

/* ===== WINNER SCREEN ===== */
#winnerScreen {
  background: rgba(0,0,0,0.92);
}

.winner-trophy {
  font-size: 80px;
  animation: trophySpin 1s ease-out;
}
@keyframes trophySpin {
  from { transform: scale(0) rotate(-180deg); }
  to { transform: scale(1) rotate(0deg); }
}

.winner-name {
  font-family: 'Orbitron', monospace;
  font-size: clamp(30px, 6vw, 60px);
  font-weight: 900;
  color: #c9a84c;
  filter: drop-shadow(0 0 30px rgba(201,168,76,0.8));
  margin: 10px 0;
  animation: winnerGlow 1.5s ease-in-out infinite alternate;
}
@keyframes winnerGlow {
  from { filter: drop-shadow(0 0 20px rgba(201,168,76,0.6)); }
  to   { filter: drop-shadow(0 0 50px rgba(201,168,76,1)); }
}

.winner-podium {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin: 20px 0 30px;
}

.podium-item {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.podium-block {
  width: 80px;
  background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px 8px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  font-weight: 900;
}
.podium-block.gold { height:80px; background: linear-gradient(180deg, rgba(201,168,76,0.3), rgba(201,168,76,0.1)); border-color: rgba(201,168,76,0.5); color:#c9a84c; }
.podium-block.silver { height:60px; background: linear-gradient(180deg, rgba(170,170,170,0.3), rgba(170,170,170,0.1)); border-color: rgba(170,170,170,0.5); color:#aaa; }
.podium-block.bronze { height:44px; background: linear-gradient(180deg, rgba(205,127,50,0.3), rgba(205,127,50,0.1)); border-color: rgba(205,127,50,0.5); color:#cd7f32; }

.podium-name { font-size: 12px; margin-top: 6px; }

/* ===== NOTIFICATIONS ===== */
#notification {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,55,145,0.9);
  border: 1px solid rgba(0,112,209,0.4);
  border-radius: 30px;
  padding: 10px 24px;
  font-size: 14px;
  font-weight: 700;
  z-index: 100;
  display: none;
  backdrop-filter: blur(20px);
  white-space: nowrap;
}

/* ===== PLAYER COUNT PICKER ===== */
.player-count-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}
.count-btn {
  width: 44px; height:44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Orbitron', monospace;
}
.count-btn:hover, .count-btn.selected {
  background: rgba(0,112,209,0.3);
  border-color: #0070d1;
  box-shadow: 0 0 15px rgba(0,112,209,0.4);
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

.section-title {
  font-size: 13px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  margin-bottom: 12px;
  text-align: center;
}

.divider {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.07);
  margin: 16px 0;
}

.status-dot {
  width: 8px; height:8px;
  border-radius: 50%;
  background: #00cc66;
  box-shadow: 0 0 8px #00cc66;
  display: inline-block;
  margin-left: 6px;
  animation: dotBlink 1.5s ease-in-out infinite;
}
@keyframes dotBlink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

.error-text {
  color: #ff4444;
  font-size: 13px;
  text-align: center;
  margin-top: -8px;
  margin-bottom: 10px;
  min-height: 18px;
}

.back-btn {
  position: absolute;
  top: 70px;
  right: 20px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 8px 18px;
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  transition: all 0.2s;
  z-index: 50;
}
.back-btn:hover { background: rgba(255,255,255,0.12); color: white; }

</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="snowCanvas"></canvas>

<!-- LANDING -->
<div class="screen active" id="landingScreen">
  <div class="ps5-header">
    <span class="ps5-logo">RIP RACING</span>
    <span class="ps5-time" id="clockDisplay">00:00</span>
  </div>
  <div class="landing-center">
    <div class="rip-title">RIP</div>
    <div class="rip-subtitle">RACING</div>
    <div class="ps5-btn-group" style="margin-top:10px;">
      <button class="ps5-btn ps5-btn-primary" onclick="showCreateRoom()">🎮 إنشاء غرفة</button>
      <button class="ps5-btn ps5-btn-secondary" onclick="showJoinRoom()">🔗 الانضمام بكود</button>
    </div>
  </div>
</div>

<!-- CREATE ROOM -->
<div class="screen" id="createScreen">
  <button class="back-btn" onclick="goBack('landingScreen')">← رجوع</button>
  <div class="ps5-panel">
    <div class="panel-title">إنشاء غرفة جديدة</div>
    <div class="section-title">اسمك</div>
    <input class="ps5-input" id="createName" placeholder="أدخل اسمك" maxlength="15">
    <div class="section-title" style="margin-top:8px;">عدد اللاعبين</div>
    <div class="player-count-row" id="countRow"></div>
    <div class="divider"></div>
    <button class="ps5-btn ps5-btn-primary" style="width:100%" onclick="createRoom()">إنشاء الغرفة ✨</button>
    <div class="error-text" id="createError"></div>
  </div>
</div>

<!-- JOIN ROOM -->
<div class="screen" id="joinScreen">
  <button class="back-btn" onclick="goBack('landingScreen')">← رجوع</button>
  <div class="ps5-panel">
    <div class="panel-title">الانضمام لغرفة</div>
    <div class="section-title">اسمك</div>
    <input class="ps5-input" id="joinName" placeholder="أدخل اسمك" maxlength="15">
    <div class="section-title" style="margin-top:8px;">كود الغرفة</div>
    <input class="ps5-input" id="joinCode" placeholder="XXXX" maxlength="4" style="text-transform:uppercase; font-family:'Orbitron',monospace; font-size:28px; letter-spacing:12px;">
    <div class="error-text" id="joinError"></div>
    <button class="ps5-btn ps5-btn-primary" style="width:100%" onclick="joinRoom()">انضمام 🚀</button>
  </div>
</div>

<!-- CHARACTER SELECT -->
<div class="screen" id="charScreen">
  <button class="back-btn" onclick="goBack('landingScreen')">← رجوع</button>
  <div style="text-align:center; margin-bottom:20px; padding-top:10px;">
    <div style="font-family:'Orbitron',monospace; font-size:18px; letter-spacing:3px; margin-bottom:6px;">اختر شخصيتك</div>
    <div style="font-size:13px; color:rgba(255,255,255,0.4);">مرحباً، <span id="charScreenName" style="color:white;"></span></div>
  </div>
  <div class="char-grid" id="charGrid"></div>
  <div style="padding:20px; width:100%; max-width:900px; margin:0 auto;">
    <button class="ps5-btn ps5-btn-primary" style="width:100%" onclick="confirmChar()">تأكيد الشخصية ✓</button>
    <div class="error-text" id="charError"></div>
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="lobbyScreen">
  <button class="back-btn" id="lobbyBackBtn" onclick="leaveLobby()">← خروج</button>
  <div style="text-align:center; margin-bottom:10px;">
    <div class="room-code-label">كود الغرفة</div>
    <div class="room-code-display" id="lobbyCode">----</div>
    <div style="font-size:12px; color:rgba(255,255,255,0.35); margin-bottom:20px;">
      <span class="status-dot"></span> في الانتظار...
    </div>
  </div>
  <div class="lobby-players" id="lobbyPlayers"></div>
  <div id="startBtnContainer" style="display:none;">
    <button class="ps5-btn ps5-btn-primary" onclick="startGame()">بدء السباق! 🏁</button>
  </div>
  <div id="waitingText" style="font-size:13px; color:rgba(255,255,255,0.35); letter-spacing:2px;">في انتظار المضيف...</div>
</div>

<!-- GAME -->
<div class="screen" id="gameScreen">
  <canvas id="gameCanvas"></canvas>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-positions" id="hudPositions"></div>
</div>

<!-- TOUCH CONTROLS -->
<div id="touchControls">
  <div class="touch-side">
    <button class="touch-btn" id="touchLeft" ontouchstart="touchKeys.left=true" ontouchend="touchKeys.left=false">◀</button>
    <button class="touch-btn" id="touchRight" ontouchstart="touchKeys.right=true" ontouchend="touchKeys.right=false">▶</button>
  </div>
  <div class="touch-side">
    <button class="touch-btn" id="touchJump" ontouchstart="touchKeys.up=true" ontouchend="touchKeys.up=false">▲</button>
  </div>
</div>

<!-- WINNER -->
<div class="screen" id="winnerScreen">
  <div class="winner-trophy">🏆</div>
  <div style="font-size:14px; letter-spacing:4px; color:rgba(255,255,255,0.4); margin-bottom:6px;">الفائز</div>
  <div class="winner-name" id="winnerName">---</div>
  <div class="winner-podium" id="winnerPodium"></div>
  <div class="ps5-btn-group">
    <button class="ps5-btn ps5-btn-primary" onclick="playAgain()">العب مجدداً 🔄</button>

const snowCanvas = document.getElementById('snowCanvas');

function initSnow() {
  snowCanvas.width = window.innerWidth;
  snowCanvas.height = window.innerHeight;
  snowflakes = Array.from({length: 100}, () => ({
    x: Math.random() * snowCanvas.width,
    y: Math.random() * snowCanvas.height,
    r: Math.random() * 2.5 + 0.5,
    s: Math.random() * 0.6 + 0.2,
    wx: Math.sin(Math.random() * Math.PI * 2) * 0.3,
    o: Math.random() * 0.5 + 0.2
  }));
}
function animSnow() {
  snowCtx.clearRect(0,0,snowCanvas.width,snowCanvas.height);
  snowflakes.forEach(f => {
    snowCtx.beginPath();
    snowCtx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    snowCtx.fillStyle = `rgba(200,220,255,${f.o})`;
    snowCtx.fill();
    f.y += f.s;
    f.x += f.wx;
    if (f.y > snowCanvas.height) { f.y = -5; f.x = Math.random() * snowCanvas.width; }
    if (f.x > snowCanvas.width) f.x = 0;
    if (f.x < 0) f.x = snowCanvas.width;
  });
  requestAnimationFrame(animSnow);
}

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let bgTime = 0;
function initBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
function animBg() {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  // Deep space gradient
  const grad = bgCtx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/2, 0, bgCanvas.width/2, bgCanvas.height/2, bgCanvas.width*0.8);
  grad.addColorStop(0, '#0d1225');
  grad.addColorStop(0.5, '#080c1a');
  grad.addColorStop(1, '#050810');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

  // Stars
  bgCtx.save();
  for(let i=0;i<180;i++){
    const sx=(Math.sin(i*7.3+bgTime*0.01)*0.5+0.5)*bgCanvas.width;
    const sy=(Math.cos(i*3.7+bgTime*0.008)*0.5+0.5)*bgCanvas.height;
    const ss=Math.sin(i*1.1+bgTime*0.05)*0.5+1;
    bgCtx.beginPath();
    bgCtx.arc(sx,sy,ss*0.6,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(200,220,255,${0.3+0.4*Math.abs(Math.sin(i+bgTime*0.03))})`;
    bgCtx.fill();
  }
  bgCtx.restore();

  // Mars - upper right
  const mx = bgCanvas.width*0.8 + Math.sin(bgTime*0.003)*30;
  const my = bgCanvas.height*0.2 + Math.cos(bgTime*0.002)*20;
  const mg = bgCtx.createRadialGradient(mx-20,my-20,5,mx,my,80);
  mg.addColorStop(0,'#cc4422');
  mg.addColorStop(0.5,'#992211');
  mg.addColorStop(1,'rgba(80,15,5,0)');
  bgCtx.beginPath();
  bgCtx.arc(mx,my,80,0,Math.PI*2);
  bgCtx.fillStyle=mg; bgCtx.fill();
  // Mars atmosphere glow
  const mag = bgCtx.createRadialGradient(mx,my,60,mx,my,120);
  mag.addColorStop(0,'rgba(180,50,20,0.15)');
  mag.addColorStop(1,'rgba(180,50,20,0)');
  bgCtx.beginPath(); bgCtx.arc(mx,my,120,0,Math.PI*2);
  bgCtx.fillStyle=mag; bgCtx.fill();

  // Mercury - lower left
  const ex = bgCanvas.width*0.15 + Math.sin(bgTime*0.005)*25;
  const ey = bgCanvas.height*0.75 + Math.cos(bgTime*0.004)*15;
  const eg = bgCtx.createRadialGradient(ex-12,ey-12,3,ex,ey,45);
  eg.addColorStop(0,'#bbaa99');
  eg.addColorStop(0.6,'#887766');
  eg.addColorStop(1,'rgba(40,30,20,0)');
  bgCtx.beginPath(); bgCtx.arc(ex,ey,45,0,Math.PI*2);
  bgCtx.fillStyle=eg; bgCtx.fill();

  bgTime++;
  requestAnimationFrame(animBg);
}

const CHAR_COLORS = ['#4a6fa5','#8b4513','#dde','#556b2f','#228b22','#222'];
const CHAR_ACCENTS = ['#cc2222','#ff8c00','#00ccff','#ffcc00','#00ff44','#4488ff'];

// Draw pixel character on canvas
function drawCharSprite(ctx, x, y, scale, charId, dir, frame, isSmall) {
  const c = CHAR_COLORS[charId];
  const a = CHAR_ACCENTS[charId];
  const s = scale || 1;
  const w = 24*s, h = 36*s;
  const px = x - w/2, py = y - h;

  ctx.save();
  if(dir < 0) { ctx.scale(-1,1); ctx.translate(-2*x,0); }

  // Shadow
  if(!isSmall) {
    ctx.beginPath();
    ctx.ellipse(x,y,w*0.5,4*s,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();
  }

  // Legs
  const legOff = frame ? 4*s : 0;
  ctx.fillStyle = c;
  ctx.fillRect(px+4*s, py+22*s, 7*s, 14*s+legOff);
  ctx.fillRect(px+13*s, py+22*s, 7*s, 14*s-legOff);

  // Body
  ctx.fillStyle = c;
  ctx.fillRect(px+2*s, py+10*s, 20*s, 13*s);

  // Accent stripe
  ctx.fillStyle = a;
  ctx.fillRect(px+2*s, py+14*s, 20*s, 3*s);

  // Arms
  const armOff = frame ? -3*s : 3*s;
  ctx.fillStyle = c;
  ctx.fillRect(px-3*s, py+10*s+armOff, 5*s, 10*s);
  ctx.fillRect(px+22*s, py+10*s-armOff, 5*s, 10*s);

  // Head
  ctx.fillStyle = charId===4 ? '#33aa33' : (charId===5 ? '#333' : '#d4a876');
  ctx.fillRect(px+4*s, py, 16*s, 12*s);

  // Hair/hat
  ctx.fillStyle = a;
  if(charId===0) { ctx.fillRect(px+3*s,py-3*s,18*s,4*s); } // helmet
  else if(charId===1) { ctx.fillRect(px+6*s,py-2*s,12*s,3*s); } // hair
  else if(charId===3) { ctx.fillStyle='#333'; ctx.fillRect(px+2*s,py-4*s,20*s,6*s); } // hood
  else if(charId===5) { ctx.fillStyle='#111'; ctx.fillRect(px+2*s,py-3*s,20*s,8*s); } // mask area

  // Eyes
  if(charId===0) { ctx.fillStyle='#ff0000'; }
  else if(charId===4) { ctx.fillStyle='#00ff44'; }
  else if(charId===5) { ctx.fillStyle=a; }
  else { ctx.fillStyle='#222'; }
  ctx.fillRect(px+6*s, py+3*s, 4*s, 3*s);
  ctx.fillRect(px+14*s, py+3*s, 4*s, 3*s);

  // Glasses for scientist
  if(charId===2) {
    ctx.strokeStyle='#00ccff'; ctx.lineWidth=1.5*s;
    ctx.strokeRect(px+5*s,py+2*s,6*s,5*s);
    ctx.strokeRect(px+13*s,py+2*s,6*s,5*s);
  }

  // Mutant glow
  if(charId===4 && !isSmall) {
    ctx.shadowColor='#00ff44'; ctx.shadowBlur=20*s;
    ctx.fillStyle='rgba(0,255,68,0.1)';
    ctx.fillRect(px-4*s,py-4*s,w+8*s,h+4*s);
    ctx.shadowBlur=0;
  }

  ctx.restore();
}

function cleanupListeners() {
  state.listeners.forEach(({ref,ev})=>ref.off(ev));
  state.listeners=[];
  if(state.roomRef) state.roomRef.off();
}

function addListener(ref, ev, fn) {
  ref.on(ev, fn);
  state.listeners.push({ref,ev});
}

function generateCode() {
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='';
  for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}

// ==================== CREATE ROOM ====================
async function createRoom() {
  const name = document.getElementById('createName').value.trim();
  if(!name) { document.getElementById('createError').textContent='أدخل اسمك أولاً'; return; }
  document.getElementById('createError').textContent='';

  const code = generateCode();
  state.playerId = genPlayerId();
  state.playerName = name;
  state.roomCode = code;
  state.isHost = true;

  const roomData = {
    code, host: state.playerId,
    maxPlayers: state.maxPlayers,
    status: 'lobby',
    players: {
      [state.playerId]: { name, char:-1, ready:false, host:true }
    }
  };

  try {
    await db.ref('rooms/'+code).set(roomData);
    state.roomRef = db.ref('rooms/'+code);
    // Auto-cleanup on disconnect
    db.ref('rooms/'+code+'/players/'+state.playerId).onDisconnect().remove();

    document.getElementById('charScreenName').textContent = name;
    buildCharGrid();
    showScreen('charScreen');
  } catch(e) {
    document.getElementById('createError').textContent = 'خطأ: '+e.message;
  }
}

// ==================== JOIN ROOM ====================
async function joinRoom() {
  const name = document.getElementById('joinName').value.trim();
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!name) { document.getElementById('joinError').textContent='أدخل اسمك'; return; }
  if(code.length!==4) { document.getElementById('joinError').textContent='أدخل كود مكوّن من 4 أحرف'; return; }
  document.getElementById('joinError').textContent='جاري البحث...';

  try {
    const snap = await db.ref('rooms/'+code).once('value');
    if(!snap.exists()) { document.getElementById('joinError').textContent='الغرفة غير موجودة'; return; }
    const room = snap.val();
    if(room.status!=='lobby') { document.getElementById('joinError').textContent='السباق بدأ مسبقاً'; return; }
    const count = Object.keys(room.players||{}).length;
    if(count >= room.maxPlayers) { document.getElementById('joinError').textContent='الغرفة ممتلئة'; return; }

    state.playerId = genPlayerId();
    state.playerName = name;
    state.roomCode = code;
    state.isHost = false;
    state.roomRef = db.ref('rooms/'+code);

    await db.ref('rooms/'+code+'/players/'+state.playerId).set({name, char:-1, ready:false, host:false});
    db.ref('rooms/'+code+'/players/'+state.playerId).onDisconnect().remove();

    document.getElementById('joinError').textContent='';
    document.getElementById('charScreenName').textContent = name;
    buildCharGrid();
    showScreen('charScreen');
  } catch(e) {
    document.getElementById('joinError').textContent = 'خطأ: '+e.message;
  }
}

    const room = snap.val();

    if(room.status==='racing') {

function updateLobbyUI(room) {
  const players = Object.entries(room.players||{});
  const grid = document.getElementById('lobbyPlayers');
  grid.innerHTML='';
  const max = room.maxPlayers||4;
  for(let i=0;i<max;i++){
    const card = document.createElement('div');
    card.className='lobby-player-card';
    if(i<players.length){
      const [pid,p] = players[i];
      card.classList.add('filled');
      const cv=document.createElement('canvas');
      cv.width=36; cv.height=36; cv.className='lobby-player-sprite';
      if(p.char>=0){
        const ctx2=cv.getContext('2d');
        drawCharSprite(ctx2,18,34,0.7,p.char,1,0,true);
      }
      const nm=document.createElement('div');
      nm.className='lobby-player-name';
      nm.textContent=(p.host?'👑 ':'')+p.name;
      card.appendChild(cv); card.appendChild(nm);
    } else {
      const t=document.createElement('div');
      t.className='lobby-empty-text'; t.textContent='فارغ...';
      card.appendChild(t);
    }

  }

function leaveLobby() {
  if(state.roomCode && state.playerId) {
    db.ref('rooms/'+state.roomCode+'/players/'+state.playerId).remove();
  }
  cleanupListeners();
  showScreen('landingScreen');
}

async function startGame() {
  const snap = await db.ref('rooms/'+state.roomCode+'/players').once('value');
  const players = snap.val()||{};
  const count = Object.keys(players).length;
  if(count<2) { showNotif('تحتاج لاعبَين على الأقل!'); return; }
  await db.ref('rooms/'+state.roomCode+'/status').set('racing');
  // Initialize race positions
  const positions = {};
  Object.keys(players).forEach((pid,i)=>{
    positions[pid] = { x: 80+i*60, y: 0, vy:0, onGround:true, finished:false, finishTime:0 };
  });
  await db.ref('rooms/'+state.roomCode+'/positions').set(positions);
}

// ==================== GAME ENGINE ====================
let gameCanvas, gameCtx;
let raceRoom = null;
let raceInterval = null;
let localPlayer = null;
let allPlayers = {};
let gameTime = 0;
let WORLD_WIDTH = 8000;
let TILE = 48;
let camera = {x:0};
let finishX = WORLD_WIDTH - 200;
let keys = {};
let touchKeys = {left:false, right:false, up:false};
let jumpCooldown = 0;
let animFrame = 0;
let animTick = 0;

// Track tiles: array of platform objects
let platforms = [];
let hazards = [];
let decorations = [];

function buildTrack() {
  platforms = [];
  hazards = [];
  decorations = [];

  // Ground
  for(let x=0; x<WORLD_WIDTH; x+=TILE) {
    platforms.push({x, y: 500, w: TILE, h: 20, type:'ground'});
  }

  // Gaps in ground
  const gaps = [400,900,1400,2100,2800,3500,4200,5000,5800,6600,7200];
  gaps.forEach(gx=>{
    // Remove ground tiles in gap
    const gw = 60 + Math.floor(Math.random()*60);
    platforms = platforms.filter(p=>!(p.type==='ground' && p.x>=gx && p.x<gx+gw));
    // Falling hazard (fire pit)
    hazards.push({x:gx, y:505, w:gw, h:20, type:'pit'});
  });

  // Floating platforms
  const floats = [
    {x:300,y:400,w:120},{x:600,y:350,w:100},{x:1100,y:380,w:120},
    {x:1550,y:320,w:100},{x:2000,y:380,w:120},{x:2400,y:340,w:100},
    {x:3000,y:360,w:120},{x:3600,y:390,w:100},{x:4000,y:330,w:120},
    {x:4600,y:360,w:100},{x:5200,y:340,w:120},{x:5600,y:380,w:100},
    {x:6000,y:350,w:120},{x:6400,y:410,w:100},{x:7000,y:360,w:120},
    {x:7400,y:390,w:100},{x:7700,y:350,w:120},
  ];
  floats.forEach(f=>platforms.push({x:f.x, y:f.y, w:f.w, h:16, type:'float'}));

  // Spikes
  const spikes = [200,500,800,1200,1700,2300,2900,3400,4100,4700,5300,5900,6500,7100,7600];
  spikes.forEach(sx=>hazards.push({x:sx, y:485, w:30, h:15, type:'spike'}));

  // Decorations (background elements)
  for(let x=0;x<WORLD_WIDTH;x+=300+Math.random()*200){
    decorations.push({x, y:300+Math.random()*150, type: Math.random()<0.5?'tree':'rock'});
  }
}

function startRace(room) {
  raceRoom = room;
  allPlayers = room.players||{};
  buildTrack();
  gameCanvas = document.getElementById('gameCanvas');
  gameCtx = gameCanvas.getContext('2d');
  gameCanvas.width = window.innerWidth;
  gameCanvas.height = window.innerHeight;

  // Init local player physics
  const savedPositions = room.positions||{};
  localPlayer = {
    x: savedPositions[state.playerId]?.x || 80,
    y: 400,
    vy: 0,
    vx: 0,
    onGround: false,
    dir: 1,
    finished: false,
    finishTime: 0,
    animFrame: 0,
    animTick: 0
  };

  camera.x = 0;
  gameTime = 0;
  state.gameRunning = true;
  showScreen('gameScreen');
  document.getElementById('hud').style.display='flex';
  document.getElementById('touchControls').style.display='flex';

  // Listen to all positions
  cleanupListeners();
  addListener(db.ref('rooms/'+state.roomCode+'/positions'), 'value', snap=>{
    if(snap.val()) {
      const pos = snap.val();
      Object.entries(pos).forEach(([pid,p])=>{
        if(pid!==state.playerId && allPlayers[pid]) {
          allPlayers[pid]._remoteX = p.x;
          allPlayers[pid]._remoteY = p.y;
          allPlayers[pid]._dir = p.dir||1;
          allPlayers[pid]._finished = p.finished;
          allPlayers[pid]._anim = p.anim||0;
        }
      });
    }
  });

  addListener(db.ref('rooms/'+state.roomCode), 'value', snap=>{
    if(snap.val()?.status==='finished') {
      const finData = snap.val().finishOrder||[];
      showWinner(finData, snap.val().players);
    }
  });

  if(raceInterval) cancelAnimationFrame(raceInterval);
  gameLoop();
}

let lastPushTime = 0;
function gameLoop() {
  if(!state.gameRunning) return;
  raceInterval = requestAnimationFrame(gameLoop);
  gameTime++;

  // Input
  const LEFT = keys['ArrowLeft']||keys['KeyA']||touchKeys.left;
  const RIGHT = keys['ArrowRight']||keys['KeyD']||touchKeys.right;
  const JUMP = keys['ArrowUp']||keys['KeyW']||keys['Space']||touchKeys.up;

  if(!localPlayer.finished) {
    // Horizontal
    localPlayer.vx = 0;
    if(LEFT) { localPlayer.vx = -3.5; localPlayer.dir=-1; }
    if(RIGHT) { localPlayer.vx = 3.5; localPlayer.dir=1; }

    // Jump
    if(JUMP && localPlayer.onGround && jumpCooldown<=0) {
      localPlayer.vy = -12;
      localPlayer.onGround = false;
      jumpCooldown = 20;
    }
    if(jumpCooldown>0) jumpCooldown--;

    // Gravity
    localPlayer.vy += 0.55;
    localPlayer.y += localPlayer.vy;
    localPlayer.x += localPlayer.vx;

    // Clamp
    if(localPlayer.x < 0) localPlayer.x = 0;

    // Collision
    localPlayer.onGround = false;
    platforms.forEach(p=>{
      if(localPlayer.x+20 > p.x && localPlayer.x-20 < p.x+p.w) {
        if(localPlayer.y > p.y && localPlayer.y < p.y+p.h+15 && localPlayer.vy >= 0) {
          localPlayer.y = p.y;
          localPlayer.vy = 0;
          localPlayer.onGround = true;
        }
      }
    });

    // Hazards
    hazards.forEach(h=>{
      if(h.type==='spike'||h.type==='pit') {
        if(localPlayer.x+16>h.x && localPlayer.x-16<h.x+h.w && localPlayer.y>=h.y-5 && localPlayer.y<=h.y+20) {
          // Die: respawn at last checkpoint
          const cpX = Math.max(80, localPlayer.x - 200);
          localPlayer.x = cpX;
          localPlayer.y = 300;
          localPlayer.vy = 0;
          showNotif('💀 تم إعادتك!');
        }
      }
    });

    // Fall off screen
    if(localPlayer.y > gameCanvas.height + 100) {
      localPlayer.x = Math.max(80, localPlayer.x-100);
      localPlayer.y = 200;
      localPlayer.vy = 0;
    }

    // Finish
    if(localPlayer.x >= finishX && !localPlayer.finished) {
      localPlayer.finished = true;
      localPlayer.finishTime = gameTime;
      db.ref('rooms/'+state.roomCode+'/positions/'+state.playerId+'/finished').set(true);
      db.ref('rooms/'+state.roomCode+'/positions/'+state.playerId+'/finishTime').set(gameTime);
      showNotif('🎉 أنهيت السباق!');
      checkAllFinished();
    }
  }

  // Anim
  localPlayer.animTick++;
  if(localPlayer.animTick>=8){ localPlayer.animTick=0; localPlayer.animFrame=1-localPlayer.animFrame; }

  // Camera
  camera.x = localPlayer.x - gameCanvas.width/3;
  if(camera.x < 0) camera.x=0;
  if(camera.x > WORLD_WIDTH - gameCanvas.width) camera.x = WORLD_WIDTH - gameCanvas.width;

  // Push to Firebase every 80ms
  const now = Date.now();
  if(now - lastPushTime > 80) {
    lastPushTime = now;
    db.ref('rooms/'+state.roomCode+'/positions/'+state.playerId).update({
      x: Math.round(localPlayer.x),
      y: Math.round(localPlayer.y),
      dir: localPlayer.dir,
      anim: localPlayer.animFrame,
      finished: localPlayer.finished
    });
  }

  // Draw
  drawGame();
  updateHUD();
}

async function checkAllFinished() {
  if(!state.isHost) return;
  const snap = await db.ref('rooms/'+state.roomCode+'/positions').once('value');
  const pos = snap.val()||{};
  const all = Object.values(pos);
  if(all.every(p=>p.finished)) {
    const sorted = Object.entries(pos)
      .sort((a,b)=>(a[1].finishTime||9999999)-(b[1].finishTime||9999999))
      .map(([pid])=>pid);
    await db.ref('rooms/'+state.roomCode).update({status:'finished', finishOrder:sorted});
  }
}

function drawGame() {
  const ctx = gameCtx;
  const W = gameCanvas.width, H = gameCanvas.height;
  ctx.clearRect(0,0,W,H);

  // BG
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#0a0e1a');
  bgGrad.addColorStop(0.6,'#0d1520');
  bgGrad.addColorStop(1,'#111a1a');
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);

  // Stars
  ctx.save();
  for(let i=0;i<60;i++){
    const sx=((i*173.3+gameTime*0.02)%W);
    const sy=((i*97.7)%H*0.6);
    ctx.beginPath();
    ctx.arc(sx,sy,0.7,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,220,255,0.4)`;
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(-camera.x, 0);

  // Decorations
  decorations.forEach(d=>{
    if(d.x<camera.x-50||d.x>camera.x+W+50) return;
    if(d.type==='tree'){
      ctx.fillStyle='#1a3a1a';
      ctx.fillRect(d.x,d.y+40,12,60);
      ctx.fillStyle='#224422';
      ctx.beginPath();
      ctx.moveTo(d.x+6,d.y); ctx.lineTo(d.x-20,d.y+50); ctx.lineTo(d.x+32,d.y+50);
      ctx.fill();
    } else {
      ctx.fillStyle='#333';
      ctx.beginPath();
      ctx.ellipse(d.x,d.y+20,28,18,0,0,Math.PI*2);
      ctx.fill();
    }
  });

  // Ground platforms
  platforms.forEach(p=>{
    if(p.x+p.w<camera.x-10||p.x>camera.x+W+10) return;
    if(p.type==='ground'){
      // Top grass
      const grad=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      grad.addColorStop(0,'#2d5a2d');
      grad.addColorStop(0.3,'#1a3a1a');
      grad.addColorStop(1,'#0a1a0a');
      ctx.fillStyle=grad;
      ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='#3a7a3a';
      ctx.fillRect(p.x,p.y,p.w,4);
    } else {
      // Floating
      ctx.fillStyle='#4a3a2a';
      ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='#6a5a3a';
      ctx.fillRect(p.x,p.y,p.w,4);
    }
  });

  // Hazards
  hazards.forEach(h=>{
    if(h.x+h.w<camera.x-10||h.x>camera.x+W+10) return;
    if(h.type==='spike'){
      ctx.fillStyle='#888';
      const sw=6, sc=Math.floor(h.w/sw);
      for(let i=0;i<sc;i++){
        ctx.beginPath();
        ctx.moveTo(h.x+i*sw,h.y+h.h);
        ctx.lineTo(h.x+i*sw+sw/2,h.y);
        ctx.lineTo(h.x+i*sw+sw,h.y+h.h);
        ctx.fill();
      }
    } else if(h.type==='pit'){
      // Fire glow
      const fireY = h.y;
      const fg=ctx.createLinearGradient(0,fireY+5,0,fireY+25);
      fg.addColorStop(0,'rgba(255,100,0,0.8)');
      fg.addColorStop(0.5,'rgba(200,50,0,0.6)');
      fg.addColorStop(1,'rgba(80,0,0,0)');
      ctx.fillStyle=fg;
      ctx.fillRect(h.x,fireY,h.w,30);
      // Flickering
      for(let fx=h.x;fx<h.x+h.w;fx+=8){
        const fh=15+Math.sin(gameTime*0.2+fx)*6;
        ctx.fillStyle='rgba(255,150,0,0.6)';
        ctx.fillRect(fx,fireY-fh,6,fh);
      }
    }
  });

  // Finish line
  const fx2 = finishX;
  ctx.fillStyle='#fff';
  for(let i=0;i<12;i++){
    ctx.fillStyle = i%2===0 ? '#fff' : '#000';
    ctx.fillRect(fx2,430+i*6,8,6);
    ctx.fillStyle = i%2===0 ? '#000' : '#fff';
    ctx.fillRect(fx2+8,430+i*6,8,6);
  }
  ctx.fillStyle='rgba(255,215,0,0.5)';
  ctx.fillRect(fx2-2,350,4,150);
  // Finish pole
  ctx.fillStyle='#fff';
  ctx.fillRect(fx2-2,300,6,230);
  ctx.fillStyle='#ffcc00';
  ctx.font='bold 18px Cairo';
  ctx.fillText('🏁 خط النهاية',fx2-60,295);

  // Remote players
  Object.entries(allPlayers).forEach(([pid,p])=>{
    if(pid===state.playerId) return;
    const rx = p._remoteX || 80;
    const ry = p._remoteY || 400;
    const charId = p.char>=0 ? p.char : 0;
    drawCharSprite(ctx, rx, ry, 1, charId, p._dir||1, p._anim||0, false);
    // Name tag
    ctx.fillStyle='rgba(0,0,0,0.6)';
    const tw=ctx.measureText(p.name).width;
    ctx.fillRect(rx-tw/2-4,ry-52,tw+8,18);
    ctx.fillStyle='#fff';
    ctx.font='12px Cairo';
    ctx.textAlign='center';
    ctx.fillText(p.name, rx, ry-38);
    ctx.textAlign='left';
  });

  // Local player
  drawCharSprite(ctx, localPlayer.x, localPlayer.y, 1, state.selectedChar||0, localPlayer.dir, localPlayer.animFrame, false);
  // Local name tag
  ctx.fillStyle='rgba(0,55,145,0.7)';
  const lw=ctx.measureText(state.playerName).width;
  ctx.fillRect(localPlayer.x-lw/2-4,localPlayer.y-52,lw+8,18);
  ctx.fillStyle='#fff';
  ctx.font='bold 12px Cairo';
  ctx.textAlign='center';
  ctx.fillText(state.playerName, localPlayer.x, localPlayer.y-38);
  ctx.textAlign='left';

  ctx.restore();

  // Progress bar
  const pct = Math.min(1, localPlayer.x / finishX);
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(20, H-16, W-40, 8);
  ctx.fillStyle='rgba(0,112,209,0.8)';
  ctx.fillRect(20, H-16, (W-40)*pct, 8);
  ctx.fillStyle='#ffcc00';
  ctx.beginPath(); ctx.arc(20+(W-40)*pct, H-12, 5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.font='10px Orbitron,monospace';
  ctx.fillText(Math.round(pct*100)+'%', W-50, H-8);
}

function updateHUD() {
  const positions = getPositions();
  const hud = document.getElementById('hudPositions');
  hud.innerHTML='';
  positions.forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='hud-player';
    const pos=document.createElement('div');
    pos.className='hud-pos'+(i===0?' first':i===1?' second':i===2?' third':'');
    pos.textContent=i+1;
    const nm=document.createElement('span');
    nm.textContent=p.name;
    div.appendChild(pos); div.appendChild(nm);
    hud.appendChild(div);
  });
}

function getPositions() {
  const ps = [];
  const myX = localPlayer.x;
  ps.push({pid:state.playerId, name:state.playerName, x:myX});
  Object.entries(allPlayers).forEach(([pid,p])=>{
    if(pid!==state.playerId){
      ps.push({pid, name:p.name, x:p._remoteX||0});
    }
  });
  ps.sort((a,b)=>b.x-a.x);
  return ps;
}

// ==================== WINNER ====================
function showWinner(finishOrder, players) {
  state.gameRunning = false;
  cancelAnimationFrame(raceInterval);
  document.getElementById('hud').style.display='none';
  document.getElementById('touchControls').style.display='none';

  const winner = players[finishOrder[0]];
  document.getElementById('winnerName').textContent = winner?.name || 'الفائز';

  const podium = document.getElementById('winnerPodium');
  podium.innerHTML='';
  const classes=['gold','silver','bronze'];
  const medals=['🥇','🥈','🥉'];
  const heights=[80,60,44];
  const order=[1,0,2]; // silver, gold, bronze visual order

  order.forEach((pos,vi)=>{
    if(pos >= finishOrder.length) { podium.appendChild(document.createElement('div')); return; }
    const pid=finishOrder[pos];
    const p=players[pid];
    const div=document.createElement('div');
    div.className='podium-item';
    const cv=document.createElement('canvas');
    cv.width=50; cv.height=50;
    if(p?.char>=0){
      const ctx2=cv.getContext('2d');
      drawCharSprite(ctx2,25,48,0.9,p.char,1,0,true);
    }
    const nm=document.createElement('div');
    nm.className='podium-name'; nm.textContent=p?.name||'';
    const blk=document.createElement('div');
    blk.className='podium-block '+classes[pos];
    blk.textContent=medals[pos];
    div.appendChild(cv); div.appendChild(nm); div.appendChild(blk);
    podium.appendChild(div);
  });

  showScreen('winnerScreen');
}

function playAgain() {
  if(state.isHost) {
    const updates = {};
    updates['status']='lobby';
    updates['positions']=null;
    updates['finishOrder']=null;
    db.ref('rooms/'+state.roomCode).update(updates);
    showLobby();
  } else {
    showLobby();
  }
}

function goHome() {
  leaveLobby();
  showScreen('landingScreen');
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', e=>{ keys[e.code]=true; e.preventDefault(); });
document.addEventListener('keyup', e=>{ keys[e.code]=false; });

// ==================== INIT ====================
buildCharGrid();
