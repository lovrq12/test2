<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmares - كوابيس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="portal-nightmares">

<div class="index-bg"></div>
<div id="effects-layer"></div>

<div id="loading-screen">
  <div class="loading-logo">NIGHTMARES</div>
  <div class="loading-spinner"></div>
</div>

<main id="index-page">
  <header class="entry-hero">
    <div class="game-title">NIGHTMARES</div>
    <div class="game-subtitle">لعبة مافيا مظلمة مليئة بالخداع والأدوار الخفية</div>
  </header>

  <section class="glass-card join-card entry-panel" aria-label="دخول لعبة NIGHTMARES">
    <div class="entry-panel-glow"></div>

    <div class="form-group">
      <label class="form-label" for="player-name"><span class="css-icon">◇</span> اسم اللاعب</label>
      <input class="input-field" id="player-name" type="text" placeholder="أدخل اسمك..." maxlength="20" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label"><span class="css-icon">✦</span> اختر صورتك</label>
      <div class="icon-grid" id="icon-grid"></div>
    </div>

    <div class="divider">اختر وضع اللعب</div>

    <div class="form-group">
      <label class="form-label" for="room-code-input"><span class="css-icon">⌁</span> كود الغرفة</label>
      <input class="input-field room-code-field" id="room-code-input" type="text" placeholder="ABCDE" maxlength="5" autocomplete="off">
    </div>

    <div class="entry-main-actions">
      <button class="btn btn-primary btn-lg" id="btn-create">إنشاء غرفة</button>
      <button class="btn btn-ghost btn-lg" id="btn-join">انضمام</button>
    </div>

    <div class="entry-secondary-actions">
      <button class="btn btn-soft" type="button" onclick="showEntryInfo('rules')">القوانين</button>
      <button class="btn btn-soft" type="button" onclick="showEntryInfo('roles')">الأدوار</button>
    </div>

    <div class="entry-note">أدخل كود الغرفة للانضمام، أو أنشئ غرفة جديدة كمضيف.</div>
  </section>
</main>

<div class="entry-info-modal" id="entry-info-modal" hidden>
  <div class="entry-info-card">
    <button class="entry-info-close" type="button" onclick="hideEntryInfo()" aria-label="إغلاق">×</button>
    <h2 id="entry-info-title"></h2>
    <p id="entry-info-body"></p>
  </div>
</div>

<div id="toast-container"></div>
<div id="sound-btn">🔊</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/sound.js"></script>
<script src="js/roles.js"></script>
<script src="js/app.js"></script>
<script>
let selectedIcon = 'wolf';
const icons = Object.keys(ANIMAL_ICONS);

function renderIcons() {
  const grid = document.getElementById('icon-grid');
  grid.innerHTML = '';
  icons.forEach(id => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'icon-option' + (id === selectedIcon ? ' selected' : '');
    el.title = getPlayerPortraitLabel(id);

    const image = document.createElement('span');
    image.className = 'entry-avatar-frame';
    image.setAttribute('aria-label', getPlayerPortraitLabel(id));
    image.innerHTML = getPlayerPortraitHtml(id, getPlayerPortraitLabel(id), 'entry-avatar-img');

    const label = document.createElement('span');
    label.className = 'avatar-name';
    label.textContent = getPlayerPortraitLabel(id);

    el.append(image, label);
    el.addEventListener('click', () => {
      selectedIcon = id;
      grid.querySelectorAll('.icon-option').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    });
    grid.appendChild(el);
  });
}

function getValidatedInput() {
  const name = document.getElementById('player-name').value.trim();
  if (!name) { showToast('أدخل اسمك أولاً', 'error'); return null; }
  if (name.length < 2) { showToast('الاسم قصير جداً', 'error'); return null; }
  if (!selectedIcon) { showToast('اختر صورتك أولاً', 'error'); return null; }
  return { name, icon: selectedIcon };
}

document.getElementById('btn-create').addEventListener('click', async () => {
  Sound.setStarted();
  Sound.resume();
  const inp = getValidatedInput();
  if (!inp) return;

  const btn = document.getElementById('btn-create');
  btn.disabled = true;
  btn.textContent = 'جاري الإنشاء...';

  try {
    const roomCode = generateRoomCode();
    const roomId = DB.generateId();
    const playerId = DB.generateId();

    const playerData = {
      id: playerId,
      name: inp.name,
      icon: inp.icon,
      role: null,
      team: null,
      alive: true,
      ready: false,
      connected: true,
      online: true,
      status: 'active',
      isHost: true,
      seat: 0,
      usedAbilities: {},
      joinedAt: DB.timestamp(),
    };

    const roomData = {
      code: roomCode,
      gameType: 'nightmares',
      status: 'lobby',
      hostId: playerId,
      createdAt: DB.timestamp(),
      settings: {
        maxPlayers: 6,
        nightTime: 60,
        dayTime: 120,
        discussionTime: 90,
        votingTime: 45,
        defenseTime: 30,
        enabledSpecialRoles: [],
      },
      players: { [playerId]: playerData },
      game: {
        phase: 'lobby',
        round: 0,
        timerEndsAt: 0,
        nightActions: {},
        votes: {},
        chat: {},
        mafiaChat: {},
        revealedRoles: {},
        deathLog: {},
        winner: null,
      }
    };

    await DB.set(`rooms/${roomId}`, roomData);
    setupPresence(roomId, playerId);
    Session.savePlayer(playerId, inp.name, inp.icon, roomId, roomCode);
    window.location.href = 'lobby.html';
  } catch(e) {
    console.error(e);
    showToast('حدث خطأ، حاول مجدداً', 'error');
    btn.disabled = false;
    btn.textContent = 'إنشاء غرفة';
  }
});

document.getElementById('btn-join').addEventListener('click', joinRoom);
document.getElementById('room-code-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom();
});

async function joinRoom() {
  Sound.setStarted();
  Sound.resume();
  const inp = getValidatedInput();
  if (!inp) return;

  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (code.length !== 5) { showToast('أدخل كود الغرفة من 5 أحرف', 'error'); return; }

  const btn = document.getElementById('btn-join');
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const rooms = await DB.get('rooms');
    if (!rooms) { showToast('الغرفة غير موجودة', 'error'); btn.disabled=false; btn.textContent='انضمام'; return; }

    let foundRoomId = null;
    let foundRoom = null;
    for (const [rid, room] of Object.entries(rooms)) {
      if (room.code === code && (!room.gameType || room.gameType === 'nightmares')) {
        foundRoomId = rid;
        foundRoom = room;
        break;
      }
    }

    if (!foundRoomId) { showToast('الغرفة غير موجودة', 'error'); btn.disabled=false; btn.textContent='انضمام'; return; }
    if (foundRoom.status !== 'lobby') { showToast('اللعبة بدأت بالفعل', 'error'); btn.disabled=false; btn.textContent='انضمام'; return; }

    const players = foundRoom.players || {};
    const playerCount = Object.values(players).filter(p => isPlayerActive(p)).length;
    const maxPlayers = foundRoom.settings?.maxPlayers || 12;

    if (playerCount >= maxPlayers) { showToast('الغرفة ممتلئة', 'error'); btn.disabled=false; btn.textContent='انضمام'; return; }

    const existingId = Session.get('playerId');
    if (existingId && players[existingId]) {
      if (getPlayerStatus(players[existingId]) === 'kicked') {
        showToast('تم طردك من هذه الغرفة', 'error');
        btn.disabled=false;
        btn.textContent='انضمام';
        return;
      }
      await DB.update(`rooms/${foundRoomId}/players/${existingId}`, {
        name: inp.name,
        icon: players[existingId].icon || inp.icon,
        connected: true,
        online: true,
        status: 'active',
        left: false,
        lastSeen: DB.timestamp(),
      });
      Session.savePlayer(existingId, inp.name, inp.icon, foundRoomId, code);
      setupPresence(foundRoomId, existingId);
      window.location.href = 'lobby.html';
      return;
    }

    const playerId = DB.generateId();
    const seat = playerCount;

    await DB.set(`rooms/${foundRoomId}/players/${playerId}`, {
      id: playerId,
      name: inp.name,
      icon: inp.icon,
      role: null,
      team: null,
      alive: true,
      ready: false,
      connected: true,
      online: true,
      status: 'active',
      isHost: false,
      seat,
      usedAbilities: {},
      joinedAt: DB.timestamp(),
    });

    setupPresence(foundRoomId, playerId);
    Session.savePlayer(playerId, inp.name, inp.icon, foundRoomId, code);
    window.location.href = 'lobby.html';
  } catch(e) {
    console.error(e);
    showToast('حدث خطأ', 'error');
    btn.disabled=false;
    btn.textContent='انضمام';
  }
}

document.getElementById('room-code-input').addEventListener('input', function() {
  this.value = this.value.toUpperCase();
});

function showEntryInfo(type) {
  const modal = document.getElementById('entry-info-modal');
  const title = document.getElementById('entry-info-title');
  const body = document.getElementById('entry-info-body');
  if (type === 'roles') {
    title.textContent = 'الأدوار';
    body.textContent = 'الأدوار مخفية حتى تبدأ اللعبة. المضيف يختار البطاقات الخاصة من اللوبي، وكل لاعب يرى دوره فقط عند الدخول إلى الطاولة.';
  } else {
    title.textContent = 'القوانين';
    body.textContent = 'تحدثوا نهاراً، صوّتوا بحذر، ونفذوا أفعال الليل من خلال الضغط على بطاقات اللاعبين حول الطاولة.';
  }
  modal.hidden = false;
}

function hideEntryInfo() {
  document.getElementById('entry-info-modal').hidden = true;
}

renderIcons();
Effects.init();
addFog();
initSoundButton();
Effects.startMeteors();

// ── NIGHTMARES ENTRY EFFECTS ─────────────────────────────────────────────
function startEntrySnow() {
  const layer = document.getElementById('effects-layer');
  if (!layer || layer._snowRunning) return;
  layer._snowRunning = true;

  function spawnSnow() {
    if (!layer._snowRunning) return;
    const flake = document.createElement('div');
    flake.className = 'snow-particle';
    const size = 1.5 + Math.random() * 4.5;
    const dur = 6 + Math.random() * 10;
    const drift = (Math.random() - 0.5) * 120;
    flake.style.cssText = [
      `width: ${size}px`,
      `height: ${size}px`,
      `left: ${Math.random() * 100}vw`,
      `top: -12px`,
      `animation-duration: ${dur}s`,
      `animation-delay: ${-Math.random() * dur}s`,
      `--drift: ${drift}px`,
      `background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(216,180,254,0.7) 60%, transparent)`,
      `box-shadow: 0 0 ${size * 2}px rgba(192,132,252,0.6)`,
      `opacity: 0`
    ].join(';');
    layer.appendChild(flake);
    setTimeout(() => flake.remove(), (dur + 1) * 1000);
    layer._snowTimer = setTimeout(spawnSnow, 120 + Math.random() * 200);
  }
  spawnSnow();
  spawnEntrySparkles();
}

function stopEntrySnow() {
  const layer = document.getElementById('effects-layer');
  if (layer) {
    layer._snowRunning = false;
    clearTimeout(layer._snowTimer);
    layer.querySelectorAll('.snow-particle, .entry-sparkle').forEach(e => e.remove());
  }
}

function spawnEntrySparkles() {
  const layer = document.getElementById('effects-layer');
  if (!layer || !layer._snowRunning) return;
  const sparkle = document.createElement('div');
  sparkle.className = 'entry-sparkle';
  sparkle.textContent = ['✦','◆','✧','◇','★'][Math.floor(Math.random() * 5)];
  const dx = (Math.random() - 0.5) * 200;
  const dy = -(40 + Math.random() * 120);
  const dur = 2 + Math.random() * 3;
  sparkle.style.cssText = [
    `left: ${10 + Math.random() * 80}vw`,
    `top: ${20 + Math.random() * 70}vh`,
    `animation-duration: ${dur}s`,
    `--dx: ${dx}px`,
    `--dy: ${dy}px`,
    `font-size: ${8 + Math.random() * 10}px`,
    `color: rgba(${[192,132,252].join(',')}, ${0.5 + Math.random() * 0.5})`
  ].join(';');
  layer.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), dur * 1000 + 300);
  setTimeout(() => spawnEntrySparkles(), 500 + Math.random() * 1200);
}

// Start entry effects
setEntryEffects();

function setEntryEffects() {
  startEntrySnow();
}

// ── AVATAR GRID LABEL ────────────────────────────────────────────────────
(function() {
  const label = document.querySelector('label[for="icon-grid"] + .icon-grid, .form-label + .icon-grid');
  const grid = document.getElementById('icon-grid');
  if (grid && grid.previousElementSibling) {
    const lbl = grid.previousElementSibling;
    if (lbl && lbl.querySelector) {
      const el = lbl.querySelector('.css-icon');
      if (el) el.textContent = '◇';
    }
  }
})();

// Pause snow when tab hidden
document.addEventListener('visibilitychange', () => {
  const layer = document.getElementById('effects-layer');
  if (!layer) return;
  if (document.hidden) {
    layer._wasPaused = layer._snowRunning;
    stopEntrySnow();
  } else if (layer._wasPaused) {
    startEntrySnow();
  }
});

const portalParams = new URLSearchParams(window.location.search);
if (portalParams.get('mode') === 'join') {
  document.getElementById('room-code-input').value = (portalParams.get('code') || '').toUpperCase();
}

setTimeout(hideLoading, 800);
</script>
</body>
</html>
