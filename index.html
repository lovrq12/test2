#app{position:relative;z-index:2;min-height:100vh}

/* GLASS PANEL */
.panel{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:2rem}
.panel-sm{padding:1.2rem 1.6rem;border-radius:14px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 2rem;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.btn-primary{background:var(--orange);color:#000;box-shadow:0 0 24px var(--orange-glow)}
.btn-primary:hover{background:#ff8533;box-shadow:0 0 40px var(--orange-glow);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--glass-border)}
.btn-ghost:hover{background:var(--glass);border-color:var(--orange);color:var(--orange)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-success{background:var(--success);color:#000;font-weight:700}
.btn-success:hover{opacity:.85;transform:translateY(-2px)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-full{width:100%}

/* INPUT */
input[type=text],input[type=number]{background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:1.1rem;padding:.75rem 1rem;width:100%;outline:none;transition:border .2s;direction:rtl;text-align:right}
input:focus{border-color:var(--orange)}
input::placeholder{color:var(--muted)}

/* LANDING */
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
.logo-apo{font-family:'Bebas Neue',cursive;font-size:clamp(3rem,12vw,8rem);letter-spacing:.15em;background:linear-gradient(135deg,#fff 0%,var(--orange) 60%,#ff3300 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;line-height:1;animation:logoFlicker 4s ease-in-out infinite}
@keyframes logoFlicker{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
.tagline{font-size:clamp(1.1rem,3vw,1.6rem);color:var(--orange);font-weight:700;margin:.5rem 0 2rem;letter-spacing:.05em}
.landing-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.upload-hint{font-size:.85rem;color:var(--muted);margin-top:1.5rem;cursor:pointer}
.upload-hint:hover{color:var(--orange)}
input[type=file]{display:none}

/* LOBBY */
#lobby{max-width:600px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.5rem}
.room-code-display{font-family:'Bebas Neue',cursive;font-size:3.5rem;letter-spacing:.3em;color:var(--orange);text-align:center;cursor:pointer;transition:all .2s}
.room-code-display:hover{text-shadow:0 0 30px var(--orange)}
.player-list{display:flex;flex-direction:column;gap:.6rem}
.player-card{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;transition:all .3s}
.player-card.host{border-color:var(--orange)}
.player-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;flex-shrink:0}
.player-name{font-size:1rem;font-weight:600}
.host-badge{font-size:.7rem;background:var(--orange);color:#000;border-radius:6px;padding:2px 8px;font-weight:700;margin-right:auto}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* WORD REVEAL */
#reveal-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
.word-card{max-width:420px;width:100%;padding:2.5rem 2rem;border-radius:24px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(20px)}
.word-label{font-size:.9rem;color:var(--muted);margin-bottom:.5rem;letter-spacing:.1em}
.secret-word{font-size:clamp(2rem,8vw,3.5rem);font-weight:900;color:var(--orange);margin:1rem 0;text-shadow:0 0 30px var(--orange-glow)}
.word-emoji{font-size:4rem;margin:1rem 0}
.outsider-badge{background:var(--danger);color:#fff;border-radius:10px;padding:.4rem 1.2rem;font-weight:700;font-size:1rem;display:inline-block;margin-bottom:1rem;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.5)}50%{box-shadow:0 0 0 12px rgba(230,57,70,0)}}

/* DISCUSSION */
#discussion-screen{max-width:700px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.5rem}
.timer-ring{width:120px;height:120px;margin:0 auto;position:relative}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring .timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:2.2rem;color:var(--orange)}
.phase-title{font-family:'Bebas Neue',cursive;font-size:2.2rem;letter-spacing:.1em;color:#fff;text-align:center}

/* VOTING */
#voting-screen{max-width:700px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.5rem}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
.vote-card{padding:1.2rem;background:var(--glass);border:2px solid var(--glass-border);border-radius:16px;cursor:pointer;text-align:center;transition:all .25s}
.vote-card:hover{border-color:var(--orange);background:var(--orange-dim);transform:translateY(-3px)}
.vote-card.voted{border-color:var(--orange);background:var(--orange-dim)}
.vote-card.self{opacity:.4;cursor:not-allowed;pointer-events:none}
.vote-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto .7rem}
.vote-count-bar{height:4px;border-radius:2px;background:var(--orange-dim);margin-top:.5rem;overflow:hidden}
.vote-count-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .4s}

/* RESULTS */
#results-screen{max-width:700px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.5rem;text-align:center}
.result-reveal{font-size:1.2rem;color:var(--muted);margin-bottom:.5rem}
.outsider-name{font-size:clamp(2rem,8vw,3rem);font-weight:900;color:var(--danger);animation:reveal-pop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes reveal-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.words-reveal{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.word-badge{padding:.6rem 1.4rem;border-radius:12px;font-size:1.1rem;font-weight:700}
.word-badge.common{background:rgba(46,204,113,.15);border:1px solid var(--success);color:var(--success)}
.word-badge.outsider{background:rgba(230,57,70,.15);border:1px solid var(--danger);color:var(--danger)}
.score-list{display:flex;flex-direction:column;gap:.6rem;text-align:right}
.score-row{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.2rem;background:var(--glass);border-radius:12px;border:1px solid var(--glass-border)}
.score-pts{font-family:'Bebas Neue',cursive;font-size:1.5rem;color:var(--orange)}

/* LEADERBOARD */
#leaderboard-screen{max-width:600px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.5rem;text-align:center}
.rank-card{display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;margin-bottom:.6rem}
.rank-num{font-family:'Bebas Neue',cursive;font-size:2rem;width:40px;color:var(--muted);text-align:center}
.rank-num.gold{color:#ffd700}
.rank-num.silver{color:#c0c0c0}
.rank-num.bronze{color:#cd7f32}
.rank-pts-big{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--orange);margin-right:auto}

/* VOLUME CTRL */
.vol-ctrl{position:fixed;top:1rem;left:1rem;z-index:100;display:flex;align-items:center;gap:.5rem}
.vol-btn{background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:.4rem .6rem;cursor:pointer;font-size:1rem;color:var(--text);backdrop-filter:blur(10px)}
.vol-btn:hover{border-color:var(--orange)}

/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(255,107,0,.95);color:#000;font-weight:700;padding:.7rem 1.8rem;border-radius:12px;font-size:1rem;z-index:999;animation:toastIn .3s ease,toastOut .3s ease 2.4s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,20px)}}

/* NAME INPUT SCREEN */
#name-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
#name-screen .panel{max-width:400px;width:100%}

/* UTILITY */
.section-label{font-size:.85rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem}
.flex-row{display:flex;gap:.8rem;align-items:center}
.hidden{display:none!important}
.divider{border:none;border-top:1px solid var(--glass-border);margin:.5rem 0}
.orange{color:var(--orange)}
.muted{color:var(--muted)}
.danger{color:var(--danger)}
.success{color:var(--success)}
.center{text-align:center}
.fw-heavy{font-weight:900}
.fs-xl{font-size:1.4rem}
.mb1{margin-bottom:.6rem}
.mt1{margin-top:.6rem}
.mt2{margin-top:1.2rem}
.gap-row{display:flex;gap:1rem;flex-wrap:wrap}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:4px}

@media(max-width:500px){
  .landing-btns{flex-direction:column;align-items:stretch;width:100%;max-width:320px}
  .vote-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="bg-fixed"></div><div id="bg-dim"></div>

<!-- Volume Control -->
<div class="vol-ctrl">
  <button class="vol-btn" id="vol-toggle" title="صوت">🔊</button>
  <input type="range" id="vol-range" min="0" max="100" value="60" style="width:70px;display:none"/>
</div>

<div id="app"></div>

<script>
// ============================================================
// STARS BACKGROUND
// ============================================================
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;init()}
  function init(){stars=[];for(let i=0;i<220;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,a:Math.random()})}
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;
      if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;
      s.a+=.005;
      const alpha=.4+.35*Math.sin(s.a);
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);resize();draw();
})();

// ============================================================
// SOUND ENGINE
// ============================================================
const SFX=(()=>{
  let ctx=null,muted=false,vol=.6;
  function init(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)()}
  function play(freq,type,dur,vol2=1,delay=0){
    try{
      init();
      const g=ctx.createGain(),o=ctx.createOscillator();
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(0,ctx.currentTime+delay);
      g.gain.linearRampToValueAtTime(vol*vol2*(muted?0:1),ctx.currentTime+delay+.01);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+dur+.05);
    }catch(e){}
  }
  function click(){play(440,'sine',.08);play(600,'sine',.08,.5,.04)}
  function join(){play(330,'sine',.12);play(440,'sine',.12,.7,.08);play(550,'sine',.15,.5,.18)}
  function reveal(){for(let i=0;i<6;i++)play(220+i*80,'sawtooth',.25,.3+i*.05,i*.07)}
  function vote(){play(280,'square',.1);play(350,'square',.1,.6,.06)}
  function countdown(){play(880,'sine',.12,.8)}
  function win(){[440,550,660,880].forEach((f,i)=>play(f,'sine',.4,.8,i*.12))}
  function lose(){[440,330,220].forEach((f,i)=>play(f,'sawtooth',.5,.5,i*.15))}
  function tick(){play(600,'sine',.06,.4)}
  function setVol(v){vol=v/100;if(v==0)muted=true;else muted=false}
  function toggleMute(){muted=!muted;return muted}
  return{click,join,reveal,vote,countdown,win,lose,tick,setVol,toggleMute,isMuted:()=>muted};
})();

document.getElementById('vol-toggle').onclick=()=>{
  const m=SFX.toggleMute();
  document.getElementById('vol-toggle').textContent=m?'🔇':'🔊';
  document.getElementById('vol-range').style.display=m?'none':'block';
};
document.getElementById('vol-range').oninput=e=>SFX.setVol(+e.target.value);

// ============================================================
// WORD DATABASE
// ============================================================
const CATEGORIES={
  'أكلات':[['برجر','شاورما'],['بيتزا','فطيرة'],['سوشي','مقبلات يابانية'],['كنافة','بسبوسة'],['مندي','كبسة'],['شاورما','طاكو'],['لحم بعجين','مطبق'],['فطر','بصل'],['جريش','هريس']],
  'حيوانات':[['أسد','نمر'],['قطة','ثعلب'],['دلفين','حوت'],['غزال','ظبي'],['حصان','حمار'],['نسر','صقر'],['قرد','شمبانزي'],['خروف','عنز'],['فهد','جاكوار']],
  'سيارات':[['لمبورجيني','فيراري'],['برادو','لاندكروزر'],['كامري','سونتا'],['نيسان','تويوتا'],['مازيراتي','مرسيدس'],['رانج روفر','جيب'],['بي إم دبليو','أودي'],['ددسون','هيلوكس']],
  'ألعاب':[['فورت نايت','بابجي'],['ماينكرافت','روبلوكس'],['FIFA','PES'],['كول أوف ديوتي','بتلفيلد'],['GTA','ريد ديد'],['سونيك','ماريو'],['بوكيمون','ديجيمون'],['أوفرووتش','إيبكس']],
  'أنمي':[['ناروتو','بليتش'],['ون بيس','فيري تيل'],['هانتر هانتر','فولميتال'],['درادون بول','سانت سايا'],['ديمون سلاير','جوجوتسو'],['أتاك أون تايتان','فينلاند ساغا'],['ريزيرو','أوفرلورد'],['كوكو نو كو','أياشيمونو']],
  'مشاهير':[['كريستيانو','ميسي'],['محمد رمضان','تامر حسني'],['بيونسيه','ريانا'],['إيلون ماسك','جيف بيزوس'],['تشارلي دميليو','خاويير'],['ثيو','بن ثيو']],
};
const ALL_PAIRS=Object.values(CATEGORIES).flat();

// ============================================================
// GAME STATE & MULTIPLAYER (BroadcastChannel)
// ============================================================
let STATE={
  screen:'landing', myId:null, myName:'', isHost:false,
  roomCode:'', players:{}, roundNum:0, totalRounds:3,
  myWord:'', commonWord:'', outsiderWord:'', outsiderId:'',
  myVote:null, votes:{}, timer:0, timerInterval:null,
  scores:{}, customBg:null, soundReady:false, category:'', phaseDone:false,
  discussionTime:90
};

let BC=null; // BroadcastChannel

function genId(){return Math.random().toString(36).slice(2,8)}
function genCode(){return Math.random().toString(36).slice(2,6).toUpperCase()}
function avatar(name){return ['🐺','🦁','🐯','🦊','🐻','🦅','🐍','🦈','🐉','🦝','🦋','🐺'][name.charCodeAt(0)%12]}
function avatarColor(name){const c=['#ff6b00','#e63946','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c','#e91e63'];return c[name.charCodeAt(0)%c.length]}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}

// ============================================================
// BROADCAST HELPERS
// ============================================================
function bcSend(msg){if(BC)BC.postMessage({...msg,from:STATE.myId})}

function initBC(code){
  if(BC)BC.close();
  BC=new BroadcastChannel('apocalypse_'+code);
  BC.onmessage=e=>handleBC(e.data);
}

function handleBC(msg){
  if(msg.from===STATE.myId)return;
  switch(msg.type){
    case 'JOIN_REQUEST':
      if(STATE.isHost){
        STATE.players[msg.id]={name:msg.name,id:msg.id,host:false};
        if(!STATE.scores[msg.id])STATE.scores[msg.id]=0;
        bcSend({type:'ROOM_STATE',players:STATE.players,scores:STATE.scores,totalRounds:STATE.totalRounds,discussionTime:STATE.discussionTime});
        SFX.join();render();
      }
      break;
    case 'ROOM_STATE':
      STATE.players=msg.players;
      STATE.scores=msg.scores;
      STATE.totalRounds=msg.totalRounds||3;
      STATE.discussionTime=msg.discussionTime||90;
      render();
      break;
    case 'PLAYER_LEFT':
      delete STATE.players[msg.id];
      render();
      break;
    case 'START_GAME':
      receiveGameStart(msg);
      break;
    case 'START_DISCUSSION':
      STATE.screen='discussion';
      startTimer(STATE.discussionTime,()=>{
        if(STATE.isHost)bcSend({type:'START_VOTING'});
        STATE.screen='voting';render();
      });
      render();
      break;
    case 'START_VOTING':
      clearTimer();
      STATE.screen='voting';STATE.votes={};STATE.myVote=null;
      startTimer(45,()=>{if(STATE.isHost)computeResults()});
      render();
      break;
    case 'VOTE_CAST':
      STATE.votes[msg.voterId]=msg.targetId;
      render();
      break;
    case 'SHOW_RESULTS':
      clearTimer();
      STATE.outsiderId=msg.outsiderId;STATE.commonWord=msg.commonWord;STATE.outsiderWord=msg.outsiderWord;
      STATE.screen='results';
      applyScores(msg.outsiderId,msg.votes,msg.outsiderGuess);
      SFX.reveal();render();
      break;
    case 'NEXT_ROUND':
      STATE.roundNum++;
      if(STATE.roundNum>=STATE.totalRounds){STATE.screen='leaderboard';SFX.win();render();}
      else{STATE.screen='lobby';STATE.votes={};STATE.myVote=null;STATE.phaseDone=false;render();}
      break;
  }
}

function receiveGameStart(msg){
  const myData=msg.assignments[STATE.myId];
  STATE.myWord=myData?.word||'';
  STATE.commonWord=msg.commonWord;
  STATE.outsiderWord=msg.outsiderWord;
  STATE.outsiderId=msg.outsiderId;
  STATE.category=msg.category;
  STATE.roundNum=msg.roundNum||0;
  STATE.screen='reveal';
  SFX.reveal();render();
}

// ============================================================
// GAME LOGIC
// ============================================================
function startGame(){
  const pids=Object.keys(STATE.players);
  if(pids.length<2){toast('تحتاج لاعبين على الأقل!');return;}
  const pair=ALL_PAIRS[Math.floor(Math.random()*ALL_PAIRS.length)];
  const commonWord=pair[0],outsiderWord=pair[1];
  const outsiderId=pids[Math.floor(Math.random()*pids.length)];
  const cat=Object.entries(CATEGORIES).find(([,v])=>v.includes(pair))?.[0]||'متنوع';
  const assignments={};
  pids.forEach(id=>{
    assignments[id]={word:id===outsiderId?outsiderWord:commonWord};
  });
  const msg={type:'START_GAME',assignments,commonWord,outsiderWord,outsiderId,category:cat,roundNum:STATE.roundNum};
  receiveGameStart(msg);
  bcSend(msg);
}

function computeResults(){
  // tally votes
  const tally={};
  Object.values(STATE.votes).forEach(v=>{tally[v]=(tally[v]||0)+1});
  let maxVotes=0,mostVoted=null;
  Object.entries(tally).forEach(([id,n])=>{if(n>maxVotes){maxVotes=n;mostVoted=id}});
  const outsiderGuess=mostVoted===STATE.outsiderId;
  bcSend({type:'SHOW_RESULTS',outsiderId:STATE.outsiderId,commonWord:STATE.commonWord,outsiderWord:STATE.outsiderWord,votes:STATE.votes,outsiderGuess});
  STATE.screen='results';
  applyScores(STATE.outsiderId,STATE.votes,outsiderGuess);
  SFX.reveal();render();
}

function applyScores(outsiderId,votes,outsiderCaught){
  const pids=Object.keys(STATE.players);
  // Players who voted correctly get +2
  pids.forEach(id=>{
    if(!STATE.scores[id])STATE.scores[id]=0;
    if(votes[id]===outsiderId&&id!==outsiderId)STATE.scores[id]+=2;
  });
  // Outsider survived = +4, caught = -1
  if(!STATE.scores[outsiderId])STATE.scores[outsiderId]=0;
  if(!outsiderCaught)STATE.scores[outsiderId]+=4;
  else STATE.scores[outsiderId]-=1;
}

function startTimer(secs,onDone){
  clearTimer();STATE.timer=secs;
  STATE.timerInterval=setInterval(()=>{
    STATE.timer--;
    if(STATE.timer<=10)SFX.tick();
    renderTimerOnly();
    if(STATE.timer<=0){clearTimer();onDone&&onDone()}
  },1000);
}
function clearTimer(){clearInterval(STATE.timerInterval);STATE.timerInterval=null}
function renderTimerOnly(){
  const el=document.getElementById('timer-text');
  const ring=document.getElementById('timer-ring-path');
  if(el)el.textContent=STATE.timer;
  if(ring){
    const total=STATE.discussionTime||90;
    const pct=STATE.timer/total;
    const circ=2*Math.PI*46;
    ring.style.strokeDashoffset=circ*(1-pct);
    ring.style.stroke=STATE.timer<15?'#e63946':STATE.timer<30?'#ff8c00':'var(--orange)';
  }
}

// ============================================================
// RENDER ENGINE
// ============================================================
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  switch(STATE.screen){
    case 'landing':renderLanding(app);break;
    case 'name-create':renderNameScreen(app,'create');break;
    case 'name-join':renderNameScreen(app,'join');break;
    case 'lobby':renderLobby(app);break;
    case 'reveal':renderReveal(app);break;
    case 'discussion':renderDiscussion(app);break;
    case 'voting':renderVoting(app);break;
    case 'results':renderResults(app);break;
    case 'leaderboard':renderLeaderboard(app);break;
  }
  applyCustomBg();
}

function applyCustomBg(){}

// ============================================================
// SCREENS
// ============================================================
function renderLanding(app){
  app.innerHTML=`
  <div id="landing">
    <div class="logo-apo">APOCALYPSE</div>
    <div class="tagline">مين برا السالفة؟</div>
    <p class="muted" style="margin-bottom:2rem;font-size:.95rem">لعبة الهوية السرية — اكتشف المندس بينكم</p>
    <div class="landing-btns">
      <button class="btn btn-primary" id="btn-create">🎮 أنشئ غرفة</button>
      <button class="btn btn-ghost" id="btn-join">🔑 انضم بكود</button>
    </div>

    <div style="margin-top:3rem;color:var(--muted);font-size:.8rem">يدعم اللعب متعدد اللاعبين عبر نفس الشبكة أو نفس الجهاز (تبويبات متعددة)</div>
  </div>`;
  document.getElementById('btn-create').onclick=()=>{SFX.click();STATE.screen='name-create';render()};
  document.getElementById('btn-join').onclick=()=>{SFX.click();STATE.screen='name-join';render()};

}

function renderNameScreen(app,mode){
  const joinHtml=mode==='join'?`
    <div class="mb1"><div class="section-label">كود الغرفة</div>
    <input type="text" id="inp-code" placeholder="XXXX" maxlength="6" style="text-align:center;letter-spacing:.3em;font-size:1.5rem;text-transform:uppercase"/></div>`:'';
  app.innerHTML=`<div id="name-screen">
    <div class="panel" style="text-align:right">
      <div style="font-size:1.4rem;font-weight:700;margin-bottom:1.2rem">${mode==='create'?'🎮 إنشاء غرفة':'🔑 الانضمام لغرفة'}</div>
      <div class="mb1"><div class="section-label">اسمك في اللعبة</div>
      <input type="text" id="inp-name" placeholder="الاسم أو اللقب..." maxlength="16"/></div>
      ${joinHtml}
      <div class="gap-row mt2">
        <button class="btn btn-primary" id="btn-go" style="flex:1">${mode==='create'?'إنشاء ✔':'انضم ✔'}</button>
        <button class="btn btn-ghost" id="btn-back">رجوع</button>
      </div>
    </div>
  </div>`;
  document.getElementById('btn-back').onclick=()=>{SFX.click();STATE.screen='landing';render()};
  document.getElementById('btn-go').onclick=()=>{
    const name=document.getElementById('inp-name').value.trim();
    if(!name){toast('اكتب اسمك أولاً');return;}
    SFX.click();
    STATE.myName=name;STATE.myId=genId();
    if(mode==='create'){
      STATE.isHost=true;
      STATE.roomCode=genCode();
      STATE.players={};STATE.scores={};STATE.roundNum=0;
      STATE.players[STATE.myId]={name,id:STATE.myId,host:true};
      STATE.scores[STATE.myId]=0;
      initBC(STATE.roomCode);
      STATE.screen='lobby';render();
    } else {
      const code=(document.getElementById('inp-code')?.value||'').trim().toUpperCase();
      if(!code||code.length<4){toast('أدخل كود الغرفة');return;}
      STATE.isHost=false;STATE.roomCode=code;
      STATE.players[STATE.myId]={name,id:STATE.myId,host:false};
      STATE.scores[STATE.myId]=0;
      initBC(code);
      bcSend({type:'JOIN_REQUEST',id:STATE.myId,name});
      SFX.join();
      STATE.screen='lobby';render();
    }
  };
  document.getElementById('inp-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-go').click()});
  if(document.getElementById('inp-code'))
    document.getElementById('inp-code').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-go').click()});
}

function renderLobby(app){
  const pids=Object.keys(STATE.players);
  const inviteUrl=`${location.href}#${STATE.roomCode}`;
  app.innerHTML=`<div id="lobby">
    <div style="text-align:center">
      <div class="logo-apo" style="font-size:3rem">APOCALYPSE</div>
      <div class="section-label mt1">كود الغرفة — انقر للنسخ</div>
      <div class="room-code-display" id="copy-code">${STATE.roomCode}</div>
      <div class="muted" style="font-size:.8rem">شارك الكود مع أصدقائك للانضمام</div>
    </div>
    <div class="panel panel-sm">
      <div class="section-label mb1">اللاعبون (${pids.length})</div>
      <div class="player-list" id="player-list">
        ${pids.map(id=>{
          const p=STATE.players[id];
          return`<div class="player-card${p.host?' host':''}">
            <div class="player-avatar" style="background:${avatarColor(p.name)};color:#000">${avatar(p.name)}</div>
            <div class="player-name">${p.name}${id===STATE.myId?' (أنت)':''}</div>
            ${p.host?'<span class="host-badge">هوست</span>':''}
          </div>`}).join('')}
      </div>
    </div>
    ${STATE.isHost?`
    <div class="panel panel-sm">
      <div class="section-label mb1">إعدادات الجولة</div>
      <div class="settings-row">
        <span>عدد الجولات</span>
        <div class="flex-row">
          ${[2,3,4,5].map(n=>`<button class="btn btn-ghost" style="padding:.4rem .9rem;font-size:.9rem${STATE.totalRounds===n?';border-color:var(--orange);color:var(--orange)':''}" onclick="STATE.totalRounds=${n};bcSend({type:'ROOM_STATE',players:STATE.players,scores:STATE.scores,totalRounds:${n},discussionTime:STATE.discussionTime});SFX.click();render()">${n}</button>`).join('')}
        </div>
      </div>
      <div class="settings-row mt1">
        <span>وقت النقاش (ثانية)</span>
        <div class="flex-row">
          ${[60,90,120].map(n=>`<button class="btn btn-ghost" style="padding:.4rem .9rem;font-size:.9rem${STATE.discussionTime===n?';border-color:var(--orange);color:var(--orange)':''}" onclick="STATE.discussionTime=${n};bcSend({type:'ROOM_STATE',players:STATE.players,scores:STATE.scores,totalRounds:STATE.totalRounds,discussionTime:${n}});SFX.click();render()">${n}</button>`).join('')}
        </div>
      </div>
    </div>
    <button class="btn btn-primary btn-full" id="btn-start" ${pids.length<2?'disabled':''}>
      ${pids.length<2?'انتظر انضمام لاعبين...':'🚀 ابدأ اللعبة'}
    </button>`:'<div class="panel panel-sm center muted">⏳ انتظار الهوست لبدء اللعبة...</div>'}
    <div style="text-align:center">
      <button class="btn btn-ghost" id="btn-leave" style="font-size:.85rem;padding:.5rem 1.2rem">خروج من الغرفة</button>
    </div>
  </div>`;
  document.getElementById('copy-code').onclick=()=>{
    navigator.clipboard.writeText(STATE.roomCode).then(()=>toast('تم نسخ الكود ✓')).catch(()=>toast(STATE.roomCode));
    SFX.click();
  };
  if(STATE.isHost&&document.getElementById('btn-start'))
    document.getElementById('btn-start').onclick=()=>{SFX.click();startGame()};
  document.getElementById('btn-leave').onclick=()=>{
    SFX.click();bcSend({type:'PLAYER_LEFT',id:STATE.myId});clearTimer();
    if(BC){BC.close();BC=null;}
    STATE={...STATE,screen:'landing',players:{},scores:{},myId:null,isHost:false,roomCode:'',myWord:'',votes:{},myVote:null,roundNum:0};
    render();
  };
}

function renderReveal(app){
  const isOutsider=STATE.outsiderId===STATE.myId;
  app.innerHTML=`<div id="reveal-screen">
    <div class="word-card">
      <div style="font-size:.85rem;color:var(--muted);letter-spacing:.1em">الجولة ${STATE.roundNum+1} من ${STATE.totalRounds}</div>
      <div style="font-size:.85rem;color:var(--orange);margin:.3rem 0">${STATE.category}</div>
      ${isOutsider?`<div class="outsider-badge">🚨 أنت المندس!</div>`:''}
      <div class="word-label">${isOutsider?'كلمتك المختلفة':'كلمتك السرية'}</div>
      <div class="word-emoji">${wordEmoji(STATE.myWord)}</div>
      <div class="secret-word">${STATE.myWord}</div>
      <div class="muted" style="font-size:.85rem;margin-top:.5rem">${isOutsider?'حاول أن تبدو طبيعياً وتكتشف كلمة الآخرين!':'لا تقل الكلمة مباشرة — ساعد الآخرين باكتشاف المندس!'}</div>
      <button class="btn btn-primary btn-full mt2" id="btn-ready">أنا جاهز ✔</button>
    </div>
  </div>`;
  document.getElementById('btn-ready').onclick=()=>{
    SFX.click();
    if(STATE.isHost){
      bcSend({type:'START_DISCUSSION'});
      STATE.screen='discussion';
      startTimer(STATE.discussionTime,()=>{
        bcSend({type:'START_VOTING'});
        STATE.screen='voting';STATE.votes={};STATE.myVote=null;
        startTimer(45,()=>{if(STATE.isHost)computeResults()});
        render();
      });
      render();
    } else {
      STATE.phaseDone=true;
      const btn=document.getElementById('btn-ready');
      if(btn){btn.disabled=true;btn.textContent='⏳ انتظار بقية اللاعبين...';}
    }
  };
}

function renderDiscussion(app){
  const circ=2*Math.PI*46;
  app.innerHTML=`<div id="discussion-screen">
    <div class="phase-title">🗣️ مرحلة النقاش</div>
    <div class="timer-ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="7"/>
        <circle id="timer-ring-path" cx="60" cy="60" r="46" fill="none" stroke="var(--orange)" stroke-width="7"
          stroke-dasharray="${circ}" stroke-dashoffset="0" style="transition:stroke-dashoffset .9s linear,stroke .5s"/>
      </svg>
      <div class="timer-text"><span id="timer-text">${STATE.timer}</span></div>
    </div>
    <div class="panel panel-sm center">
      <div class="muted" style="font-size:.9rem">ناقشوا مع بعض وحاولوا تحديد المندس</div>
      <div class="muted" style="font-size:.85rem;margin-top:.4rem">لا تقولوا كلمتكم مباشرة!</div>
    </div>
    <div class="panel panel-sm">
      <div class="section-label mb1">اللاعبون</div>
      ${Object.values(STATE.players).map(p=>`
        <div class="player-card">
          <div class="player-avatar" style="background:${avatarColor(p.name)};color:#000">${avatar(p.name)}</div>
          <div class="player-name">${p.name}${p.id===STATE.myId?' (أنت)':''}</div>
        </div>`).join('')}
    </div>
    ${STATE.isHost?`<button class="btn btn-ghost btn-full" onclick="SFX.click();clearTimer();bcSend({type:'START_VOTING'});STATE.screen='voting';STATE.votes={};STATE.myVote=null;startTimer(45,()=>{if(STATE.isHost)computeResults()});render()">⏩ تخطي إلى التصويت</button>`:''}
  </div>`;
}

function renderVoting(app){
  const pids=Object.keys(STATE.players);
  const voteCount={};
  pids.forEach(id=>voteCount[id]=0);
  Object.values(STATE.votes).forEach(v=>{if(voteCount[v]!==undefined)voteCount[v]++});
  const maxV=Math.max(1,...Object.values(voteCount));
  const circ=2*Math.PI*46;
  app.innerHTML=`<div id="voting-screen">
    <div class="phase-title">🗳️ مرحلة التصويت</div>
    <div class="timer-ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="7"/>
        <circle id="timer-ring-path" cx="60" cy="60" r="46" fill="none" stroke="var(--orange)" stroke-width="7"
          stroke-dasharray="${circ}" stroke-dashoffset="0" style="transition:stroke-dashoffset .9s linear,stroke .5s"/>
      </svg>
      <div class="timer-text"><span id="timer-text">${STATE.timer}</span></div>
    </div>
    <div class="panel panel-sm center muted" style="font-size:.9rem">من هو المندس؟ صوّت الآن!</div>
    <div class="vote-grid">
      ${pids.map(id=>{
        const p=STATE.players[id];
        const isSelf=id===STATE.myId;
        const isVoted=STATE.myVote===id;
        const cnt=voteCount[id]||0;
        return`<div class="vote-card${isSelf?' self':''}${isVoted?' voted':''}" data-id="${id}">
          <div class="vote-avatar" style="background:${avatarColor(p.name)};color:#000;font-size:1.5rem">${avatar(p.name)}</div>
          <div style="font-weight:700;font-size:.95rem">${p.name}</div>
          ${!isSelf?`<div style="font-size:.8rem;color:var(--muted);margin-top:.3rem">${cnt} صوت</div>
          <div class="vote-count-bar"><div class="vote-count-fill" style="width:${(cnt/maxV)*100}%"></div></div>`:'<div style="font-size:.75rem;color:var(--muted)">(أنت)</div>'}
        </div>`;
      }).join('')}
    </div>
    <div class="muted center" style="font-size:.85rem">الأصوات: ${Object.keys(STATE.votes).length} / ${pids.length-1}</div>
    ${STATE.isHost&&Object.keys(STATE.votes).length>0?`<button class="btn btn-ghost btn-full" onclick="SFX.click();clearTimer();computeResults()">⚡ إظهار النتائج</button>`:''}
  </div>`;
  document.querySelectorAll('.vote-card:not(.self)').forEach(el=>{
    el.onclick=()=>{
      if(STATE.myVote)return;
      const tid=el.dataset.id;
      STATE.myVote=tid;STATE.votes[STATE.myId]=tid;
      bcSend({type:'VOTE_CAST',voterId:STATE.myId,targetId:tid});
      SFX.vote();render();
      if(STATE.isHost&&Object.keys(STATE.votes).length>=Object.keys(STATE.players).length-1)
        setTimeout(()=>computeResults(),800);
    };
  });
}

function renderResults(app){
  const outsider=STATE.players[STATE.outsiderId];
  const pids=Object.keys(STATE.players);
  const tally={};
  Object.values(STATE.votes).forEach(v=>{tally[v]=(tally[v]||0)+1});
  let mostVotedId=null,maxV=0;
  Object.entries(tally).forEach(([id,n])=>{if(n>maxV){maxV=n;mostVotedId=id}});
  const caught=mostVotedId===STATE.outsiderId;
  app.innerHTML=`<div id="results-screen">
    <div class="phase-title">📣 النتائج</div>
    <div class="panel">
      <div class="result-reveal">المندس كان...</div>
      <div class="outsider-name">${outsider?.name||'؟'}</div>
      <div style="font-size:4rem;margin:.5rem 0">${avatar(outsider?.name||'?')}</div>
      <div class="${caught?'success':'danger'}" style="font-size:1.2rem;font-weight:700;margin:.5rem 0">
        ${caught?'✅ تم اكتشافه!':'😈 نجا المندس!'}
      </div>
      <div class="words-reveal">
        <div class="word-badge common">الكلمة المشتركة: ${STATE.commonWord}</div>
        <div class="word-badge outsider">كلمة المندس: ${STATE.outsiderWord}</div>
      </div>
    </div>
    <div class="panel panel-sm">
      <div class="section-label mb1">النقاط هذه الجولة</div>
      <div class="score-list">
        ${pids.map(id=>{
          const p=STATE.players[id];
          const pts=STATE.scores[id]||0;
          return`<div class="score-row">
            <div class="flex-row">
              <div class="player-avatar" style="width:36px;height:36px;background:${avatarColor(p.name)};color:#000;font-size:1.1rem">${avatar(p.name)}</div>
              <span style="font-weight:600">${p.name}${id===STATE.outsiderId?' 🎭':''}</span>
            </div>
            <div class="score-pts">${pts}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${STATE.isHost?`
    <div class="gap-row">
      ${STATE.roundNum+1<STATE.totalRounds?`<button class="btn btn-primary" style="flex:1" id="btn-next">الجولة التالية ▶</button>`:''}
      <button class="btn btn-success" style="flex:1" id="btn-final">🏆 النتيجة النهائية</button>
    </div>`:'<div class="panel panel-sm center muted">⏳ انتظار الهوست...</div>'}
  </div>`;
  if(STATE.isHost){
    const btnNext=document.getElementById('btn-next');
    const btnFinal=document.getElementById('btn-final');
    if(btnNext)btnNext.onclick=()=>{SFX.click();STATE.roundNum++;bcSend({type:'NEXT_ROUND'});STATE.screen='lobby';STATE.votes={};STATE.myVote=null;STATE.phaseDone=false;render()};
    if(btnFinal)btnFinal.onclick=()=>{SFX.click();STATE.screen='leaderboard';SFX.win();render()};
  }
}

function renderLeaderboard(app){
  const pids=Object.keys(STATE.players);
  const sorted=pids.sort((a,b)=>(STATE.scores[b]||0)-(STATE.scores[a]||0));
  const medals=['gold','silver','bronze'];
  app.innerHTML=`<div id="leaderboard-screen">
    <div class="logo-apo" style="font-size:3rem">APOCALYPSE</div>
    <div style="font-size:1.5rem;font-weight:700;color:var(--orange)">🏆 الترتيب النهائي</div>
    <div>
      ${sorted.map((id,i)=>{
        const p=STATE.players[id];
        const pts=STATE.scores[id]||0;
        return`<div class="rank-card" style="${i===0?'border-color:#ffd700;background:rgba(255,215,0,0.07)':''}">
          <div class="rank-num${medals[i]?' '+medals[i]:''}">${i===0?'👑':i+1}</div>
          <div class="player-avatar" style="background:${avatarColor(p.name)};color:#000;font-size:1.3rem;width:44px;height:44px">${avatar(p.name)}</div>
          <div>
            <div style="font-weight:700;font-size:1rem">${p.name}</div>
            <div class="muted" style="font-size:.8rem">${id===STATE.myId?'أنت':''}</div>
          </div>
          <div class="rank-pts-big">${pts}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="gap-row" style="justify-content:center;margin-top:1rem">
      <button class="btn btn-primary" id="btn-play-again">🔄 العب مرة أخرى</button>
      <button class="btn btn-ghost" id="btn-home">🏠 الرئيسية</button>
    </div>
  </div>`;
  document.getElementById('btn-play-again').onclick=()=>{
    SFX.click();
    STATE.roundNum=0;
    Object.keys(STATE.scores).forEach(id=>STATE.scores[id]=0);
    STATE.votes={};STATE.myVote=null;STATE.phaseDone=false;
    STATE.screen='lobby';render();
  };
  document.getElementById('btn-home').onclick=()=>{
    SFX.click();bcSend({type:'PLAYER_LEFT',id:STATE.myId});clearTimer();
    if(BC){BC.close();BC=null;}
    STATE={screen:'landing',myId:null,myName:'',isHost:false,roomCode:'',players:{},roundNum:0,totalRounds:3,myWord:'',commonWord:'',outsiderWord:'',outsiderId:'',myVote:null,votes:{},timer:0,timerInterval:null,scores:{},customBg:STATE.customBg,soundReady:false,category:'',phaseDone:false,discussionTime:90};
    render();
  };
}

function wordEmoji(word){
  const map={'برجر':'🍔','شاورما':'🌯','بيتزا':'🍕','فطيرة':'🥧','سوشي':'🍣','كنافة':'🍮','مندي':'🍖','كبسة':'🍛','أسد':'🦁','قطة':'🐱','دلفين':'🐬','حوت':'🐋','غزال':'🦌','حصان':'🐴','نسر':'🦅','صقر':'🦅','قرد':'🐒','خروف':'🐑','لمبورجيني':'🏎️','فيراري':'🏎️','برادو':'🚙','كامري':'🚗','نيسان':'🚙','فورت نايت':'🎮','ماينكرافت':'⛏️','FIFA':'⚽','ناروتو':'🍥','ون بيس':'⚓','كريستيانو':'⚽','ميسي':'⚽','بيونسيه':'🎤'};
  return map[word]||'🎯';
}

// Check URL hash for room code (invite link)
(()=>{
  const hash=location.hash.slice(1);
  if(hash&&hash.length>=4){
    setTimeout(()=>{
      STATE.screen='name-join';
      render();
      const inp=document.getElementById('inp-code');
      if(inp)inp.value=hash.toUpperCase();
    },100);
  }
})();

// Initial render
render();
</script>
</body>
</html>
