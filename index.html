# Mafia Sabah Style — Single HTML Multiplayer Game

```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFIA صباح</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#05070f;
color:white;
overflow:hidden;
height:100vh;
}

#bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#1a2244 0%,#05070f 60%),
linear-gradient(180deg,#05070f,#090d1b);
}

.stars{
position:absolute;
width:100%;
height:100%;
background-image:radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:.15;
animation:move 40s linear infinite;
}

@keyframes move{
from{transform:translateY(0)}
to{transform:translateY(40px)}
}

.ui{
position:relative;
z-index:10;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.panel{
width:min(1200px,95%);
background:rgba(8,12,24,.88);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
padding:30px;
box-shadow:0 0 40px rgba(0,0,0,.6);
}

.title{
font-size:72px;
text-align:center;
font-weight:900;
margin-bottom:10px;
color:#ff4242;
text-shadow:0 0 25px rgba(255,0,0,.5);
}

.subtitle{
text-align:center;
opacity:.7;
margin-bottom:30px;
}

.btn{
background:linear-gradient(145deg,#151d35,#0c1222);
padding:18px;
border-radius:18px;
text-align:center;
cursor:pointer;
transition:.2s;
margin-top:12px;
border:1px solid rgba(255,255,255,.08);
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 0 20px rgba(0,140,255,.25);
}

input{
width:100%;
padding:16px;
background:#090f1d;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
color:white;
margin-bottom:12px;
font-size:16px;
}

.players{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
margin-top:20px;
}

.playerCard{
background:#0d1324;
padding:16px;
border-radius:18px;
border:1px solid rgba(255,255,255,.06);
}

.dead{
opacity:.4;
filter:grayscale(1);
}

.chat{
height:260px;
overflow:auto;
background:#070b16;
padding:14px;
border-radius:18px;
margin-top:15px;
}

.message{
margin-bottom:10px;
background:#11192d;
padding:10px;
border-radius:12px;
}

.topbar{
display:flex;
justify-content:space-between;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

.phase{
background:#10182b;
padding:14px 18px;
border-radius:16px;
font-weight:bold;
}

.voteBtn{
background:#1b2d4d;
padding:10px;
border-radius:12px;
margin-top:10px;
cursor:pointer;
text-align:center;
}

.roleBox{
background:#250d0d;
padding:18px;
border-radius:18px;
margin-bottom:20px;
text-align:center;
font-size:22px;
font-weight:bold;
color:#ff5a5a;
}
</style>
</head>
<body>

<div id="bg"><div class="stars"></div></div>

<div class="ui">
<div class="panel" id="app"></div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyOfE8IrWe_UNZaTus-OJygAk4wIILY_jjw",
authDomain: "endx-8ac33.firebaseapp.com",
databaseURL: "https://endx-8ac33-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "endx-8ac33",
storageBucket: "endx-8ac33.firebasestorage.app",
messagingSenderId: "11855321835",
appId: "1:11855321835:web:bb03b9acb3abf5143b1eb2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const app = document.getElementById('app');

let roomCode = '';
let playerId = 'p'+Math.random().toString(36).substring(2,9);
let playerName = '';
let role = '';
let isHost = false;
let gameData = {};

const rolesPool = ['مافيا','محقق','دكتور','مواطن','مواطن','مواطن','مافيا','مواطن'];

function makeCode(){
return Math.random().toString(36).substring(2,6).toUpperCase();
}

function home(){
app.innerHTML = `
<div class="title">MAFIA</div>
<div class="subtitle">نسخة صباح</div>
<input id="name" placeholder="اسمك">
<div class="btn" onclick="createRoom()">إنشاء روم</div>
<input id="joinCode" placeholder="كود الروم">
<div class="btn" onclick="joinRoom()">دخول روم</div>
`;
}

async function createRoom(){
playerName = document.getElementById('name').value || 'لاعب';
roomCode = makeCode();
isHost = true;

await db.ref('mafia/'+roomCode).set({
phase:'lobby',
host:playerId,
messages:[],
started:false
});

addPlayer();
}

async function joinRoom(){
playerName = document.getElementById('name').value || 'لاعب';
roomCode = document.getElementById('joinCode').value.toUpperCase();

const snap = await db.ref('mafia/'+roomCode).get();
if(!snap.exists()){
alert('الروم غير موجود');
return;
}

addPlayer();
}

function addPlayer(){
const ref = db.ref(`mafia/${roomCode}/players/${playerId}`);

ref.set({
name:playerName,
alive:true,
role:'',
vote:'',
ready:true
});

ref.onDisconnect().remove();

listenRoom();
renderLobby();
}

function listenRoom(){
db.ref('mafia/'+roomCode).on('value',snap=>{
gameData = snap.val() || {};

if(gameData.started){
role = gameData.players[playerId]?.role || '';
renderGame();
}

if(gameData.winner){
showWinner(gameData.winner);
}

updateLobby();
});
}

function renderLobby(){
app.innerHTML = `
<div class="title">${roomCode}</div>
<div class="subtitle">غرفة الانتظار</div>
<div id="players" class="players"></div>
${isHost?'<div class="btn" onclick="startGame()">بدء اللعبة</div>':''}
`;
}

function updateLobby(){
const container = document.getElementById('players');
if(!container || !gameData.players) return;

container.innerHTML = '';

Object.values(gameData.players).forEach(p=>{
const el = document.createElement('div');
el.className='playerCard';
el.innerHTML=`<h3>${p.name}</h3><p>جاهز</p>`;
container.appendChild(el);
});
}

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

function startGame(){
const ids = Object.keys(gameData.players || {});
const shuffled = shuffle([...rolesPool]);

ids.forEach((id,i)=>{
db.ref(`mafia/${roomCode}/players/${id}/role`).set(shuffled[i]);
});

setTimeout(()=>{
db.ref(`mafia/${roomCode}`).update({
started:true,
phase:'ليل'
});
},1000);
}

function renderGame(){
const players = gameData.players || {};
const messages = gameData.messages || [];

app.innerHTML = `
<div class="topbar">
<div class="phase">الروم: ${roomCode}</div>
<div class="phase">المرحلة: ${gameData.phase || ''}</div>
</div>

<div class="roleBox">
دورك: ${role}
</div>

<div class="players">
${Object.entries(players).map(([id,p])=>`
<div class="playerCard ${!p.alive?'dead':''}">
<h3>${p.name}</h3>
<p>${p.alive?'حي':'ميت'}</p>
${playerId!==id && p.alive ? `<div class="voteBtn" onclick="vote('${id}')">تصويت</div>`:''}
</div>
`).join('')}
</div>

<div class="chat" id="chat">
${messages.map(m=>`
<div class="message"><b>${m.name}:</b> ${m.text}</div>
`).join('')}
</div>

<div style="display:flex;gap:10px;margin-top:15px">
<input id="msg" placeholder="اكتب رسالة">
<div class="btn" style="width:180px;margin:0" onclick="sendMessage()">إرسال</div>
</div>

${isHost?`
<div class="btn" onclick="nextPhase()">
تغيير المرحلة
</div>
<div class="btn" onclick="countVotes()">
إنهاء التصويت
</div>
`:''}
`;

const chat = document.getElementById('chat');
chat.scrollTop = chat.scrollHeight;
}

function sendMessage(){
const input = document.getElementById('msg');
const text = input.value.trim();
if(!text) return;

const msgs = gameData.messages || [];
msgs.push({
name:playerName,
text
});

if(msgs.length > 60) msgs.shift();

db.ref(`mafia/${roomCode}/messages`).set(msgs);
input.value='';
}

function vote(target){
db.ref(`mafia/${roomCode}/players/${playerId}/vote`).set(target);
}

function countVotes(){
const players = gameData.players || {};
const counts = {};

Object.entries(players).forEach(([id,p])=>{
if(p.vote){
counts[p.vote] = (counts[p.vote] || 0) + 1;
}
});

let max = 0;
let target = null;

Object.entries(counts).forEach(([id,c])=>{
if(c > max){
max = c;
target = id;
}
});

if(target){
db.ref(`mafia/${roomCode}/players/${target}/alive`).set(false);
}

Object.keys(players).forEach(id=>{
db.ref(`mafia/${roomCode}/players/${id}/vote`).set('');
});

checkWinner();
}

function nextPhase(){
const phase = gameData.phase === 'ليل' ? 'نهار' : 'ليل';
db.ref(`mafia/${roomCode}/phase`).set(phase);
}

function checkWinner(){
const players = Object.values(gameData.players || {});

const mafia = players.filter(p=>p.role==='مافيا' && p.alive).length;
const others = players.filter(p=>p.role!=='مافيا' && p.alive).length;

if(mafia===0){
db.ref(`mafia/${roomCode}/winner`).set('المواطنين');
}

if(mafia>=others){
db.ref(`mafia/${roomCode}/winner`).set('المافيا');
}
}

function showWinner(team){
app.innerHTML = `
<div class="title">${team}</div>
<div class="subtitle">فازوا في اللعبة</div>
<div class="btn" onclick="location.reload()">لعبة جديدة</div>
`;
}

home();
</script>
</body>
</html>
```
