<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>APOCALYPSE — مين برا السالفة؟</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
:root{
  --orange:#ff6b00;--orange2:#ff8c33;--orange-glow:rgba(255,107,0,.35);--orange-dim:rgba(255,107,0,.12);
  --bg:#080808;--glass:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.09);
  --text:#f0f0f0;--muted:#777;--danger:#e63946;--success:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;overflow-x:hidden;direction:rtl}

canvas#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:2;min-height:100vh}

/* GLASS */
.panel{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;backdrop-filter:blur(18px);padding:2rem}
.panel-sm{padding:1.2rem 1.6rem;border-radius:14px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 2rem;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.btn-primary{background:var(--orange);color:#000;box-shadow:0 0 24px var(--orange-glow)}
.btn-primary:hover{background:var(--orange2);box-shadow:0 0 40px var(--orange-glow);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--glass-border)}
.btn-ghost:hover{background:var(--glass);border-color:var(--orange);color:var(--orange)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#000;font-weight:700}
.btn-success:hover{opacity:.85;transform:translateY(-2px)}
.btn:disabled{opacity:.35;pointer-events:none;cursor:not-allowed}
.btn-full{width:100%}
.btn-sm{padding:.5rem 1.2rem;font-size:.9rem;border-radius:9px}

/* INPUTS */
input[type=text],input[type=number],select{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:1.1rem;padding:.75rem 1rem;width:100%;outline:none;transition:border .2s;direction:rtl;text-align:right;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--orange)}
input::placeholder{color:var(--muted)}
select option{background:#1a1a1a;color:#fff}

/* LANDING */
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
.logo-apo{font-family:'Bebas Neue',cursive;font-size:clamp(3.5rem,14vw,9rem);letter-spacing:.15em;background:linear-gradient(135deg,#fff 0%,var(--orange) 60%,#ff3300 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{filter:brightness(1) drop-shadow(0 0 20px rgba(255,107,0,.3))}50%{filter:brightness(1.1) drop-shadow(0 0 40px rgba(255,107,0,.6))}}
.tagline{font-size:clamp(1rem,3vw,1.4rem);color:var(--orange);font-weight:700;margin:.5rem 0 2rem;letter-spacing:.05em}
.landing-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}

/* NAME SCREEN */
#name-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
#name-screen .panel{max-width:400px;width:100%}

/* LOBBY */
#lobby{max-width:620px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.4rem}
.room-code-display{font-family:'Bebas Neue',cursive;font-size:4rem;letter-spacing:.3em;color:var(--orange);text-align:center;cursor:pointer;transition:all .2s;filter:drop-shadow(0 0 20px rgba(255,107,0,.4))}
.room-code-display:hover{filter:drop-shadow(0 0 40px rgba(255,107,0,.8))}
.player-list{display:flex;flex-direction:column;gap:.6rem}
.player-card{display:flex;align-items:center;gap:1rem;padding:.85rem 1.2rem;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;transition:all .3s}
.player-card.host-card{border-color:var(--orange)}
.player-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;flex-shrink:0}
.host-badge{font-size:.7rem;background:var(--orange);color:#000;border-radius:6px;padding:2px 8px;font-weight:700;margin-right:auto}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.pill-group{display:flex;gap:.4rem;flex-wrap:wrap}
.pill{padding:.35rem .9rem;border-radius:99px;font-size:.85rem;font-weight:700;cursor:pointer;border:1px solid var(--glass-border);background:transparent;color:var(--muted);font-family:'Tajawal',sans-serif;transition:all .2s}
.pill.active{background:var(--orange);color:#000;border-color:var(--orange)}
.pill:hover:not(.active){border-color:var(--orange);color:var(--orange)}

/* REVEAL */
#reveal-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
.word-card{max-width:440px;width:100%;padding:2.5rem 2rem;border-radius:24px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(20px)}
.secret-word{font-size:clamp(2.2rem,8vw,3.5rem);font-weight:900;color:var(--orange);margin:1rem 0;text-shadow:0 0 30px var(--orange-glow);line-height:1.1}
.word-emoji{font-size:4rem;margin:.8rem 0}
.outsider-badge{background:var(--danger);color:#fff;border-radius:10px;padding:.4rem 1.2rem;font-weight:700;font-size:1rem;display:inline-block;margin-bottom:1rem;animation:outsiderPulse 1.5s infinite}
@keyframes outsiderPulse{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.5)}50%{box-shadow:0 0 0 14px rgba(230,57,70,0)}}

/* DISCUSSION */
#discussion-screen{max-width:700px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.4rem}
.phase-title{font-family:'Bebas Neue',cursive;font-size:2.4rem;letter-spacing:.1em;color:#fff;text-align:center}
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.timer-ring{width:130px;height:130px;position:relative}
.timer-ring svg{transform:rotate(-90deg)}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:2.5rem;color:var(--orange)}

/* VOTING */
#voting-screen{max-width:700px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.4rem}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}
.vote-card{padding:1.2rem;background:var(--glass);border:2px solid var(--glass-border);border-radius:16px;cursor:pointer;text-align:center;transition:all .25s;position:relative}
.vote-card:hover:not(.self-card):not(.voted-card){border-color:var(--orange);background:var(--orange-dim);transform:translateY(-3px)}
.vote-card.voted-card{border-color:var(--orange);background:var(--orange-dim)}
.vote-card.self-card{opacity:.4;cursor:not-allowed}
.vote-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto .7rem}
.vote-bar{height:4px;border-radius:2px;background:var(--orange-dim);margin-top:.5rem;overflow:hidden}
.vote-bar-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .4s}
.vote-check{position:absolute;top:.5rem;left:.5rem;font-size:1.2rem}

/* RESULTS */
#results-screen{max-width:700px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.4rem;text-align:center}
.outsider-reveal-name{font-size:clamp(2rem,8vw,3rem);font-weight:900;color:var(--danger);animation:revealPop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes revealPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.word-badges{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.word-badge{padding:.6rem 1.4rem;border-radius:12px;font-size:1rem;font-weight:700}
.badge-common{background:rgba(46,204,113,.15);border:1px solid var(--success);color:var(--success)}
.badge-outsider{background:rgba(230,57,70,.15);border:1px solid var(--danger);color:var(--danger)}
.score-list{display:flex;flex-direction:column;gap:.6rem;text-align:right}
.score-row{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.2rem;background:var(--glass);border-radius:12px;border:1px solid var(--glass-border)}
.score-pts{font-family:'Bebas Neue',cursive;font-size:1.5rem;color:var(--orange)}

/* LEADERBOARD */
#leaderboard-screen{max-width:600px;margin:0 auto;padding:2rem 1rem;min-height:100vh;display:flex;flex-direction:column;gap:1.4rem;text-align:center}
.rank-card{display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;margin-bottom:.6rem}
.rank-num{font-family:'Bebas Neue',cursive;font-size:2rem;width:40px;color:var(--muted);text-align:center;flex-shrink:0}
.rank-num.gold{color:#ffd700}
.rank-num.silver{color:#c0c0c0}
.rank-num.bronze{color:#cd7f32}
.rank-pts{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--orange);margin-right:auto}

/* WAITING */
.waiting-spinner{width:40px;height:40px;border:3px solid var(--glass-border);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:1rem auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* UTILITY */
.section-label{font-size:.82rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem}
.flex-row{display:flex;gap:.8rem;align-items:center}
.gap-row{display:flex;gap:.8rem;flex-wrap:wrap}
.hidden{display:none!important}
.orange{color:var(--orange)}
.muted{color:var(--muted)}
.danger{color:var(--danger)}
.success{color:var(--success)}
.center{text-align:center}
.fw9{font-weight:900}
.mb1{margin-bottom:.6rem}
.mt1{margin-top:.6rem}
.mt2{margin-top:1.2rem}
.divider{border:none;border-top:1px solid var(--glass-border);margin:.6rem 0}

/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(255,107,0,.95);color:#000;font-weight:700;padding:.7rem 1.8rem;border-radius:12px;font-size:1rem;z-index:999;animation:toastIn .3s ease,toastOut .3s ease 2.5s forwards;pointer-events:none;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,20px)}}

/* LOADING SCREEN */
#loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:4px}

@media(max-width:500px){
  .landing-btns{flex-direction:column;align-items:stretch;width:100%;max-width:300px}
  .vote-grid{grid-template-columns:repeat(2,1fr)}
  .panel{padding:1.4rem}
}
</style>
</head>

<script>
// ============================================================
// FIREBASE CONFIG — مشروع ENDx
// ============================================================
const firebaseConfig = {

  databaseURL: "https://endx-8ac33-default-rtdb.europe-west1.firebasedatabase.app",

  appId: "1:11855321835:web:bb03b9acb3abf5143b1eb2",

};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================================
// STARS
// ============================================================
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;init()}
  function init(){stars=[];for(let i=0;i<200;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,a:Math.random()*Math.PI*2})}
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;s.a+=.006;
      if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;
      const alpha=.35+.3*Math.sin(s.a);
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);resize();draw();
})();

// ============================================================
// HELPERS
// ============================================================
function genId(){return Math.random().toString(36).slice(2,10)}
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='';for(let i=0;i<4;i++)c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function avatar(name){return['🐺','🦁','🐯','🦊','🐻','🦅','🐍','🦈','🐉','🦝','🦋','🐮','🐸','🦄','🐧','🦎'][name.charCodeAt(0)%16]}
function avatarColor(name){return['#ff6b00','#e63946','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c','#e91e63','#f39c12','#16a085'][name.charCodeAt(0)%10]}
function toast(msg,dur=2700){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div');d.className='toast';d.textContent=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),dur);
}
function $(id){return document.getElementById(id)}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}

// ============================================================
// SOUND
// ============================================================
const SFX=(()=>{
  let ctx=null,muted=false,vol=.6;
  function init(){if(!ctx)try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  function play(freq,type,dur,v=1,delay=0){
    try{
      init();
      const g=ctx.createGain(),o=ctx.createOscillator();
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(0,ctx.currentTime+delay);
      g.gain.linearRampToValueAtTime(vol*v*(muted?0:1),ctx.currentTime+delay+.01);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+dur+.05);
    }catch(e){}
  }
  return{
    click:()=>{play(440,'sine',.08);play(600,'sine',.08,.5,.04)},
    join:()=>{play(330,'sine',.12);play(440,'sine',.12,.7,.08);play(550,'sine',.15,.5,.18)},
    reveal:()=>{for(let i=0;i<5;i++)play(220+i*90,'sawtooth',.2,.4,i*.07)},
    vote:()=>{play(300,'square',.1);play(400,'square',.1,.6,.06)},
    tick:()=>play(700,'sine',.06,.35),
    win:()=>{[440,550,660,880].forEach((f,i)=>play(f,'sine',.4,.8,i*.1))},
    lose:()=>{[440,330,220].forEach((f,i)=>play(f,'sawtooth',.5,.5,i*.14))},
    toggleMute:()=>{muted=!muted;return muted},
    isMuted:()=>muted,
    setVol:v=>vol=v/100
  };
})();

// ============================================================
// WORD DATABASE
// ============================================================
const CATEGORIES = {
  'أكلات 🍔': [['برجر','شاورما'],['بيتزا','فطيرة'],['سوشي','ساشيمي'],['كنافة','بسبوسة'],['مندي','كبسة'],['فطر','بصل'],['لحم بعجين','مطبق'],['ماكرونا','باستا']],
  'حيوانات 🦁': [['أسد','نمر'],['قطة','ثعلب'],['دلفين','حوت'],['غزال','ظبي'],['حصان','حمار'],['نسر','صقر'],['قرد','شمبانزي'],['خروف','عنز']],
  'سيارات 🏎️': [['لمبورجيني','فيراري'],['برادو','لاندكروزر'],['كامري','سونتا'],['مازيراتي','مرسيدس'],['رانج روفر','جيب'],['بي إم دبليو','أودي'],['ددسون','هيلوكس'],['باترول','تاهو']],
  'ألعاب 🎮': [['فورت نايت','بابجي'],['ماينكرافت','روبلوكس'],['FIFA','PES'],['كول أوف ديوتي','بتلفيلد'],['GTA','ريد ديد'],['أوفرووتش','إيبكس'],['فري فاير','سكواد']],
  'أنمي 🍥': [['ناروتو','بليتش'],['ون بيس','فيري تيل'],['درادون بول','سانت سايا'],['ديمون سلاير','جوجوتسو كايسن'],['أتاك أون تايتان','فينلاند ساغا'],['ريزيرو','أوفرلورد']],
  'مشاهير ⭐': [['كريستيانو','ميسي'],['محمد رمضان','تامر حسني'],['بيونسيه','ريانا'],['إيلون ماسك','جيف بيزوس'],['ليبرون','كيوريو'],['موهمد علي','تايسون']],
  'أماكن 🌍': [['مكة','المدينة'],['دبي','أبوظبي'],['باريس','لندن'],['طوكيو','سيول'],['نيويورك','لوس أنجلوس'],['الرياض','جدة'],['القاهرة','الإسكندرية']],
  'رياضة ⚽': [['كرة قدم','كرة سلة'],['سباحة','غوص'],['تنس','بادل'],['ملاكمة','مصارعة'],['جولف','كريكيت'],['دراجات','موتوسيكل']],
};
const ALL_PAIRS = Object.values(CATEGORIES).flat();

// ============================================================
// STATE
// ============================================================
let S = {
  screen: 'loading',
  myId: null,
  myName: '',
  isHost: false,
  roomCode: '',
  roomRef: null,
  listeners: [],
  // room data
  players: {},
  settings: { rounds: 3, discussionTime: 90, category: 'عشوائي 🎲' },
  roundNum: 0,
  phase: 'lobby', // lobby, reveal, discussion, voting, results
  // game data
  myWord: '',
  commonWord: '',
  outsiderWord: '',
  outsiderId: '',
  category: '',
  votes: {},
  myVote: null,
  scores: {},
  // timer
  timerVal: 0,
  timerInterval: null,
};

// ============================================================
// FIREBASE HELPERS
// ============================================================
function roomRef(path){
  if(path)return db.ref(`rooms/${S.roomCode}/${path}`);
  return db.ref(`rooms/${S.roomCode}`);
}

function listen(ref, event, cb){
  ref.on(event, cb);
  S.listeners.push({ref,event,cb});
}

function stopListeners(){
  S.listeners.forEach(({ref,event,cb})=>ref.off(event,cb));
  S.listeners=[];
}

function cleanupRoom(){
  stopListeners();
  if(S.timerInterval){clearInterval(S.timerInterval);S.timerInterval=null;}
  S.roomRef=null;
}

// ============================================================
// RENDER ENGINE
// ============================================================
function render(){
  const app=$('app');
  app.innerHTML='';
  ({
    loading: renderLoading,
    landing: renderLanding,
    'name-create': ()=>renderNameScreen('create'),
    'name-join': ()=>renderNameScreen('join'),
    lobby: renderLobby,
    reveal: renderReveal,
    discussion: renderDiscussion,
    voting: renderVoting,
    results: renderResults,
    leaderboard: renderLeaderboard,
  }[S.screen]||renderLoading)(app);
}

// ============================================================
// SCREENS
// ============================================================
function renderLoading(){
  $('app').innerHTML=`<div id="loading-screen">
    <div class="logo-apo" style="font-size:4rem">APOCALYPSE</div>
    <div class="waiting-spinner"></div>
    <div class="muted">جاري الاتصال...</div>
  </div>`;
}

function renderLanding(){
  $('app').innerHTML=`<div id="landing">
    <div class="logo-apo">APOCALYPSE</div>
    <div class="tagline">مين برا السالفة؟</div>
    <p class="muted" style="margin-bottom:2.5rem;font-size:.95rem;max-width:320px">لعبة الهوية السرية — اكتشف المندس بينكم 🕵️</p>
    <div class="landing-btns">
      <button class="btn btn-primary" id="btn-create" style="font-size:1.1rem;padding:1rem 2.5rem">🎮 أنشئ غرفة</button>

// LOBBY LISTENERS
// ============================================================
function setupLobbyListeners(){
  stopListeners();

  // Listen to players
  listen(roomRef('players'),'value', snap=>{
    S.players=snap.val()||{};
    if(S.screen==='lobby')render();
  });

  // Listen to scores
  listen(roomRef('scores'),'value', snap=>{
    S.scores=snap.val()||{};
  });

  // Listen to settings
  listen(roomRef('settings'),'value', snap=>{
    if(snap.val())S.settings=snap.val();
    if(S.screen==='lobby')render();
  });

  // Listen to phase/game changes
  listen(roomRef('phase'),'value', snap=>{
    const phase=snap.val();
    if(!phase)return;
    if(phase==='reveal' && S.screen==='lobby'){
      // Read assignment
      db.ref(`rooms/${S.roomCode}/assignments/${S.myId}`).once('value').then(aSnap=>{
        const aData=aSnap.val()||{};
        S.myWord=aData.word||'';
        db.ref(`rooms/${S.roomCode}/gameData`).once('value').then(gSnap=>{
          const g=gSnap.val()||{};
          S.commonWord=g.commonWord||'';
          S.outsiderWord=g.outsiderWord||'';
          S.outsiderId=g.outsiderId||'';
          S.category=g.category||'';
          S.roundNum=g.roundNum||0;
          S.myVote=null;S.votes={};
          S.screen='reveal';
          setupGameListeners();
          SFX.reveal();render();
        });
      });
    }
  });

  // Handle disconnect — remove player
  db.ref(`rooms/${S.roomCode}/players/${S.myId}/online`).onDisconnect().remove();
}

function setupGameListeners(){
  // Listen to votes
  listen(roomRef('votes'),'value', snap=>{
    S.votes=snap.val()||{};
    if(S.screen==='voting')render();
  });

  // Listen to phase
  listen(roomRef('phase'),'value', snap=>{
    const phase=snap.val();
    if(!phase)return;
    if(phase==='discussion' && S.screen==='reveal'){
      S.screen='discussion';
      startLocalTimer(S.settings.discussionTime||90, ()=>{
        if(S.isHost) hostStartVoting();
      });
      render();
    }
    if(phase==='voting' && (S.screen==='discussion'||S.screen==='reveal')){
      clearLocalTimer();
      S.screen='voting';S.votes={};S.myVote=null;
      startLocalTimer(45, ()=>{if(S.isHost)hostComputeResults()});
      render();
    }
    if(phase==='results' && S.screen==='voting'){
      clearLocalTimer();
      db.ref(`rooms/${S.roomCode}/results`).once('value').then(rSnap=>{
        const r=rSnap.val()||{};
        S.outsiderId=r.outsiderId||S.outsiderId;
        S.commonWord=r.commonWord||S.commonWord;
        S.outsiderWord=r.outsiderWord||S.outsiderWord;
        S.votes=r.votes||S.votes;
        db.ref(`rooms/${S.roomCode}/scores`).once('value').then(sSnap=>{
          S.scores=sSnap.val()||{};
          S.screen='results';SFX.reveal();render();
        });
      });
    }
    if(phase==='lobby' && (S.screen==='results'||S.screen==='leaderboard')){
      db.ref(`rooms/${S.roomCode}`).once('value').then(snap=>{
        const d=snap.val()||{};
        S.scores=d.scores||{};
        S.roundNum=d.roundNum||0;
        S.players=d.players||{};
        S.votes={};S.myVote=null;
        clearLocalTimer();
        S.screen='lobby';
        setupLobbyListeners();
        render();
      });
    }
    if(phase==='leaderboard'){
      clearLocalTimer();
      db.ref(`rooms/${S.roomCode}/scores`).once('value').then(sSnap=>{
        S.scores=sSnap.val()||{};
        S.screen='leaderboard';SFX.win();render();
      });
    }
  });
}

// ============================================================
async function hostStartGame(){
  const pids=Object.keys(S.players);
  if(pids.length<2){toast('تحتاج لاعبين على الأقل!');return}

  // Pick pair
  let pair;
  const cat=S.settings.category;
  if(cat==='عشوائي 🎲'){
    pair=rand(ALL_PAIRS);
  } else {
    const catPairs=CATEGORIES[cat]||ALL_PAIRS;
    pair=rand(catPairs);
  }
  const [commonWord,outsiderWord]=pair;
  const outsiderId=rand(pids);
  const catName=cat==='عشوائي 🎲'?Object.keys(CATEGORIES).find(k=>CATEGORIES[k].includes(pair))||'متنوع':cat;

  // Assignments
  const assignments={};
  pids.forEach(id=>{assignments[id]={word:id===outsiderId?outsiderWord:commonWord}});

  const roundNum=(S.roundNum||0);
  await db.ref(`rooms/${S.roomCode}`).update({
    phase:'reveal',
    roundNum,
    gameData:{commonWord,outsiderWord,outsiderId,category:catName,roundNum},
    assignments,
    votes:{},
    results:{},
  });
}

async function hostStartDiscussion(){
  await roomRef('phase').set('discussion');
}

async function hostStartVoting(){
  await roomRef('phase').set('voting');
}

async function hostComputeResults(){
  const tally={};
  Object.values(S.votes).forEach(v=>{tally[v]=(tally[v]||0)+1});
  let maxV=0,mostVoted=null;
  Object.entries(tally).forEach(([id,n])=>{if(n>maxV){maxV=n;mostVoted=id}});
  const caught=mostVoted===S.outsiderId;

  // Update scores
  const pids=Object.keys(S.players);
  const scoreUpdates={};
  pids.forEach(id=>{
    if(!S.scores[id])S.scores[id]=0;
    scoreUpdates[id]=S.scores[id];
  });
  Object.entries(S.votes).forEach(([voterId,targetId])=>{
    if(targetId===S.outsiderId && voterId!==S.outsiderId)
      scoreUpdates[voterId]=(scoreUpdates[voterId]||0)+2;
  });
  if(!caught) scoreUpdates[S.outsiderId]=(scoreUpdates[S.outsiderId]||0)+4;
  else scoreUpdates[S.outsiderId]=Math.max(0,(scoreUpdates[S.outsiderId]||0)-1);

  await db.ref(`rooms/${S.roomCode}`).update({
    scores:scoreUpdates,
    results:{outsiderId:S.outsiderId,commonWord:S.commonWord,outsiderWord:S.outsiderWord,votes:S.votes,caught},
    phase:'results',
  });
}

async function hostNextRound(){
  const newRound=(S.roundNum||0)+1;
  const totalRounds=S.settings.rounds||3;
  if(newRound>=totalRounds){
    await db.ref(`rooms/${S.roomCode}`).update({phase:'leaderboard',roundNum:newRound});
  } else {
    await db.ref(`rooms/${S.roomCode}`).update({
      phase:'lobby',
      roundNum:newRound,
      votes:{},assignments:{},results:{},gameData:{}
    });
  }
}

function startLocalTimer(secs, onDone){
  clearLocalTimer();
  S.timerVal=secs;
  S.timerInterval=setInterval(()=>{
    S.timerVal--;
    if(S.timerVal<=10)SFX.tick();
    renderTimerOnly();
    if(S.timerVal<=0){clearLocalTimer();onDone&&onDone()}
  },1000);
}
function clearLocalTimer(){clearInterval(S.timerInterval);S.timerInterval=null}
function renderTimerOnly(){
  const el=$('timer-text');
  const ring=$('timer-ring-path');
  if(el)el.textContent=S.timerVal;
  if(ring){
    const total=S.screen==='discussion'?(S.settings.discussionTime||90):45;
    const pct=S.timerVal/total;
    const circ=2*Math.PI*50;
    ring.style.strokeDashoffset=circ*(1-pct);
    ring.style.stroke=S.timerVal<10?'#e63946':S.timerVal<20?'#ff8c00':'var(--orange)';
  }
}

  document.querySelectorAll('.vote-card:not(.self-card)').forEach(el=>{
    el.onclick=()=>{
      if(S.myVote)return;
      const tid=el.dataset.id;
      S.myVote=tid;S.votes[S.myId]=tid;
      db.ref(`rooms/${S.roomCode}/votes/${S.myId}`).set(tid);
      SFX.vote();render();
      // Auto results if all voted (host)
      if(S.isHost){
        const total=Object.keys(S.players).length-1;
        db.ref(`rooms/${S.roomCode}/votes`).once('value').then(snap=>{
          if(Object.keys(snap.val()||{}).length>=total){
            setTimeout(()=>hostComputeResults(),600);
          }
        });
      }
    };
  });

  if(S.isHost&&$('btn-force-res'))$('btn-force-res').onclick=()=>{SFX.click();clearLocalTimer();hostComputeResults()};
}

// ============================================================
// RESULTS SCREEN
// ============================================================
function renderResults(){
  const outsider=S.players[S.outsiderId];
  const pids=Object.keys(S.players);
  const tally={};
  Object.values(S.votes).forEach(v=>{tally[v]=(tally[v]||0)+1});
  let mostVotedId=null,maxV=0;
  Object.entries(tally).forEach(([id,n])=>{if(n>maxV){maxV=n;mostVotedId=id}});
  const caught=mostVotedId===S.outsiderId;
  const roundNum=(S.roundNum||0)+1;
  const totalRounds=S.settings.rounds||3;

  $('app').innerHTML=`<div id="results-screen">
    <div class="phase-title">📣 النتائج</div>
    <div class="panel" style="text-align:center">
      <div style="color:var(--muted);font-size:.9rem">المندس كان...</div>
      <div style="font-size:4rem;margin:.5rem 0">${avatar(outsider?.name||'?')}</div>
      <div class="outsider-reveal-name">${outsider?.name||'؟'}</div>
      <div class="${caught?'success':'danger'}" style="font-size:1.2rem;font-weight:700;margin:.7rem 0">
        ${caught?'✅ تم اكتشافه! الجماعة فازوا!':'😈 نجا المندس! فاز وحده!'}
      </div>
      <div class="word-badges">
        <div class="word-badge badge-common">الكلمة المشتركة: ${S.commonWord}</div>
        <div class="word-badge badge-outsider">كلمة المندس: ${S.outsiderWord}</div>
      </div>
    </div>
    <div class="panel panel-sm">
      <div class="section-label mb1">النقاط الكلية (الجولة ${roundNum}/${totalRounds})</div>
      <div class="score-list">
        ${pids.sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0)).map(id=>{
          const p=S.players[id];if(!p)return'';
          return`<div class="score-row">
            <div class="flex-row">
              <div class="player-avatar" style="width:36px;height:36px;background:${avatarColor(p.name)};color:#000;font-size:1.1rem">${avatar(p.name)}</div>
              <span style="font-weight:600">${p.name}${id===S.outsiderId?' 🎭':''}</span>
            </div>
            <div class="score-pts">${S.scores[id]||0}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${S.isHost?`
    <div class="gap-row">
      <button class="btn btn-primary" style="flex:1" id="btn-next-round">${roundNum>=totalRounds?'🏆 النتيجة النهائية':'الجولة التالية ▶'}</button>
    </div>`:'<div class="panel panel-sm center muted">⏳ انتظار الهوست...</div>'}
  </div>`;

  if(S.isHost&&$('btn-next-round'))$('btn-next-round').onclick=()=>{SFX.click();hostNextRound()};
}

// ============================================================
// LEADERBOARD
// ============================================================
function renderLeaderboard(){
  const pids=Object.keys(S.players);
  const sorted=pids.sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0));
  const medals=['gold','silver','bronze'];

  $('app').innerHTML=`<div id="leaderboard-screen">
    <div class="logo-apo" style="font-size:3rem">APOCALYPSE</div>
    <div style="font-size:1.5rem;font-weight:700;color:var(--orange);text-align:center">🏆 الترتيب النهائي</div>
    <div>
      ${sorted.map((id,i)=>{
        const p=S.players[id];if(!p)return'';
        const pts=S.scores[id]||0;
        return`<div class="rank-card" style="${i===0?'border-color:#ffd700;background:rgba(255,215,0,.07)':''}">
          <div class="rank-num${medals[i]?' '+medals[i]:''}">${i===0?'👑':i+1}</div>
          <div class="player-avatar" style="background:${avatarColor(p.name)};color:#000;font-size:1.3rem;width:44px;height:44px">${avatar(p.name)}</div>
          <div>
            <div style="font-weight:700;font-size:1rem">${p.name}</div>
            ${id===S.myId?'<div style="color:var(--muted);font-size:.8rem">أنت</div>':''}
          </div>
          <div class="rank-pts">${pts}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="gap-row" style="justify-content:center;margin-top:1rem">
      ${S.isHost?`<button class="btn btn-primary" id="btn-again">🔄 العب مرة أخرى</button>`:'<div class="muted">⏳ انتظار الهوست...</div>'}
      <button class="btn btn-ghost" id="btn-home-lb">🏠 الرئيسية</button>
    </div>
  </div>`;

  if(S.isHost&&$('btn-again')){
    $('btn-again').onclick=async()=>{
      SFX.click();
      const pids=Object.keys(S.players);
      const scores={};pids.forEach(id=>scores[id]=0);
      await db.ref(`rooms/${S.roomCode}`).update({
        phase:'lobby',roundNum:0,scores,votes:{},assignments:{},results:{},gameData:{}
      });
    };
  }
  $('btn-home-lb').onclick=()=>{
    SFX.click();
    db.ref(`rooms/${S.roomCode}/players/${S.myId}`).remove();
    cleanupRoom();
    S={...S,screen:'landing',players:{},scores:{},myId:null,isHost:false,roomCode:'',myWord:'',votes:{},myVote:null,roundNum:0};
    render();
  };
}
