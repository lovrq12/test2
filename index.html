<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apocalypse - لعبة الحفلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Tajawal',sans-serif}
  #root{width:100%;height:100%;overflow:hidden}
  :root{
    --cyan:#00f5ff;--purple:#bf00ff;--dark-blue:#0a0015;
    --glass:rgba(10,0,30,0.7);--glass2:rgba(0,245,255,0.08);
    --border:rgba(0,245,255,0.2);--text:#e8f4ff;--gold:#ffd700
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 20px rgba(0,245,255,0.3)}50%{box-shadow:0 0 50px rgba(0,245,255,0.8),0 0 80px rgba(191,0,255,0.4)}}
  @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
  @keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
  @keyframes slide-in{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes winner-pop{0%{transform:scale(0) rotate(-10deg)}60%{transform:scale(1.1) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes count-down{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}
  .particle{position:absolute;pointer-events:none;animation:fall linear infinite}
  .btn{
    font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:700;
    padding:14px 32px;border:none;border-radius:12px;cursor:pointer;
    transition:all 0.3s;position:relative;overflow:hidden;letter-spacing:0.5px
  }
  .btn-primary{
    background:linear-gradient(135deg,rgba(0,245,255,0.2),rgba(191,0,255,0.2));
    color:var(--cyan);border:1.5px solid var(--cyan);
    text-shadow:0 0 10px var(--cyan)
  }
  .btn-primary:hover{
    background:linear-gradient(135deg,rgba(0,245,255,0.4),rgba(191,0,255,0.4));
    box-shadow:0 0 30px rgba(0,245,255,0.5),0 0 60px rgba(191,0,255,0.3);
    transform:translateY(-2px)
  }
  .btn-secondary{
    background:linear-gradient(135deg,rgba(191,0,255,0.2),rgba(0,245,255,0.1));
    color:var(--purple);border:1.5px solid var(--purple)
  }
  .btn-secondary:hover{
    background:linear-gradient(135deg,rgba(191,0,255,0.4),rgba(0,245,255,0.2));
    box-shadow:0 0 30px rgba(191,0,255,0.5);transform:translateY(-2px)
  }
  .btn-gold{
    background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,165,0,0.2));
    color:var(--gold);border:1.5px solid var(--gold)
  }
  .btn-gold:hover{
    background:linear-gradient(135deg,rgba(255,215,0,0.4),rgba(255,165,0,0.4));
    box-shadow:0 0 30px rgba(255,215,0,0.5);transform:translateY(-2px)
  }
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important}
  .glass-panel{
    background:var(--glass);backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:20px;
    box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05)
  }
  .input-field{
    width:100%;padding:14px 18px;background:rgba(0,245,255,0.05);
    border:1.5px solid rgba(0,245,255,0.2);border-radius:12px;
    color:var(--text);font-family:'Tajawal',sans-serif;font-size:1.1rem;
    outline:none;transition:all 0.3s;text-align:right;direction:rtl
  }
  .input-field:focus{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,245,255,0.2);background:rgba(0,245,255,0.08)}
  .input-field::placeholder{color:rgba(232,244,255,0.3)}
  .screen{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;overflow:hidden
  }
  .bg-image{
    position:absolute;inset:0;background-size:cover;background-position:center;
    background-image:url('re-zero-echidna-4k-wallpaper-uhdpaper_com-44_5_o.jpg');
    filter:brightness(0.4) saturate(1.3)
  }
  .bg-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,20,0.8),rgba(20,0,40,0.7),rgba(0,10,30,0.8))}
  .logo-text{
    font-family:'Cinzel Decorative',serif;font-size:clamp(2.5rem,6vw,4.5rem);
    font-weight:900;text-align:center;letter-spacing:4px;
    background:linear-gradient(135deg,#00f5ff,#bf00ff,#ffd700,#00f5ff);
    background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;animation:shimmer 4s linear infinite;
    text-shadow:none;filter:drop-shadow(0 0 20px rgba(0,245,255,0.5))
  }
  .score-badge{
    display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,165,0,0.1));
    border:1px solid rgba(255,215,0,0.4);border-radius:50px;
    padding:4px 16px;color:var(--gold);font-weight:700;font-size:1rem
  }
  .avatar{
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:1.4rem;font-weight:700;color:white;flex-shrink:0;
    border:2px solid rgba(255,255,255,0.2)
  }
  .timer-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
  .player-card{
    background:rgba(0,245,255,0.05);border:1px solid rgba(0,245,255,0.15);
    border-radius:14px;padding:12px 16px;transition:all 0.3s;animation:slide-in 0.4s ease
  }
  .player-card:hover{background:rgba(0,245,255,0.1);border-color:rgba(0,245,255,0.3)}
  .correct-flash{animation:pulse-glow 0.5s ease 3}
  .content-scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(0,245,255,0.3) transparent}
  .content-scroll::-webkit-scrollbar{width:4px}
  .content-scroll::-webkit-scrollbar-track{background:transparent}
  .content-scroll::-webkit-scrollbar-thumb{background:rgba(0,245,255,0.3);border-radius:4px}
  .confetti-piece{position:fixed;animation:fall 3s linear forwards;font-size:1.5rem;pointer-events:none;z-index:9999}
  .crown{font-size:2rem;animation:float 2s ease-in-out infinite}
  @media(max-width:600px){
    .logo-text{font-size:2rem;letter-spacing:2px}
    .btn{padding:12px 20px;font-size:1rem}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// Firebase config — uses a demo project; replace with your own for production
const firebaseConfig = {
  apiKey: "AIzaSyDemo_Replace_With_Your_Key",
  databaseURL: "https://apocalypse-game-default-rtdb.firebaseio.com",
  projectId: "apocalypse-game"
};

// Initialize Firebase with error handling
let db = null;
try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch(e) {
  console.warn('Firebase init failed, using local mode:', e);
}

// Local state fallback for demo
const localRooms = {};

const AVATARS = ['🐉','🦋','🔮','⚡','🌙','🔥','🌊','💀','🌸','👁️','🦅','🌟'];
const COLORS = ['#00f5ff','#bf00ff','#ff0080','#ffd700','#00ff88','#ff6600','#ff00ff','#0088ff','#ff3333','#88ff00','#ff8800','#00ffcc'];
const ANSWER_TIME = 45;

function generateCode() {
  return Math.random().toString(36).substr(2,6).toUpperCase();
}

function normalizeAnswer(str) {
  return str?.trim().toLowerCase().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/[ةه]/g,'ه') || '';
}

// Particle background
function Particles() {
  const particles = Array.from({length:25},(_,i)=>({
    id:i,
    left:`${Math.random()*100}%`,
    delay:`${Math.random()*8}s`,
    duration:`${4+Math.random()*8}s`,
    size:`${6+Math.random()*10}px`,
    opacity:Math.random()*0.6+0.2
  }));
  return (
    <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
      {particles.map(p=>(
        <div key={p.id} className="particle" style={{
          left:p.left,top:'-20px',width:p.size,height:p.size,
          background:`radial-gradient(circle,rgba(0,245,255,${p.opacity}),transparent)`,
          borderRadius:'50%',animationDuration:p.duration,animationDelay:p.delay
        }}/>
      ))}
    </div>
  );
}

// Logo component
function Logo({size='large'}) {
  return (
    <div style={{textAlign:'center',marginBottom:'8px'}}>
      <div className="logo-text" style={size==='small'?{fontSize:'1.8rem',letterSpacing:'2px'}:{}}>
        APOCALYPSE
      </div>
      <div style={{color:'rgba(0,245,255,0.6)',fontSize:'0.85rem',letterSpacing:'3px',marginTop:'4px',fontWeight:'300'}}>
        لعبة النهاية الكبرى
      </div>
    </div>
  );
}

// Timer component
function Timer({seconds, total, onEnd}) {
  const [remaining, setRemaining] = useState(seconds);
  const ref = useRef(null);
  useEffect(()=>{
    setRemaining(seconds);
    if(ref.current) clearInterval(ref.current);
    ref.current = setInterval(()=>{
      setRemaining(r=>{
        if(r<=1){clearInterval(ref.current);onEnd&&onEnd();return 0}
        return r-1;
      });
    },1000);
    return ()=>clearInterval(ref.current);
  },[seconds]);
  const pct = remaining/total;
  const color = pct>0.5?'#00f5ff':pct>0.25?'#ffd700':'#ff3333';
  const r=38,circ=2*Math.PI*r;
  return (
    <div className="timer-ring" style={{width:90,height:90}}>
      <svg width={90} height={90} style={{position:'absolute',transform:'rotate(-90deg)'}}>
        <circle cx={45} cy={45} r={r} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth={6}/>
        <circle cx={45} cy={45} r={r} fill="none" stroke={color} strokeWidth={6}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} style={{transition:'stroke-dashoffset 0.9s,stroke 0.3s'}}/>
      </svg>
      <span style={{fontSize:'1.6rem',fontWeight:'800',color,transition:'color 0.3s',
        textShadow:`0 0 15px ${color}`,animation:remaining<=5?'count-down 0.5s ease infinite':''}}>{remaining}</span>
    </div>
  );
}

// Confetti effect
function Confetti() {
  const pieces = Array.from({length:40},(_,i)=>({
    id:i,emoji:['🎉','⭐','🌟','💫','✨','🔥','💎'][Math.floor(Math.random()*7)],
    left:`${Math.random()*100}%`,delay:`${Math.random()*2}s`,dur:`${2+Math.random()*2}s`
  }));
  return (
    <>
      {pieces.map(p=>(
        <div key={p.id} className="confetti-piece" style={{
          left:p.left,top:'-50px',animationDelay:p.delay,animationDuration:p.dur
        }}>{p.emoji}</div>
      ))}
    </>
  );
}

// HOME SCREEN
function HomeScreen({onHost,onJoin}) {
  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      <div style={{position:'relative',zIndex:2,textAlign:'center',padding:'20px',width:'100%',maxWidth:'480px'}}>
        <div style={{animation:'float 3s ease-in-out infinite',marginBottom:'8px',fontSize:'3rem'}}>🎮</div>
        <Logo/>
        <p style={{color:'rgba(232,244,255,0.6)',marginBottom:'40px',fontSize:'1.05rem',marginTop:'12px',lineHeight:1.7}}>
          لعبة الحفلات التنافسية — خمّن إجابات أصدقائك!
        </p>
        <div className="glass-panel" style={{padding:'36px 32px',animation:'slide-in 0.6s ease'}}>
          <button className="btn btn-primary" style={{width:'100%',marginBottom:'16px',fontSize:'1.2rem',animation:'pulse-glow 3s infinite'}}
            onClick={onHost}>
            🏠 إنشاء غرفة جديدة
          </button>
          <button className="btn btn-secondary" style={{width:'100%',fontSize:'1.2rem'}} onClick={onJoin}>
            🚪 الانضمام لغرفة
          </button>
        </div>
        <p style={{marginTop:'24px',color:'rgba(232,244,255,0.3)',fontSize:'0.85rem'}}>
          من ٤ إلى ٨ لاعبين • أسئلة شخصية • نقاط تنافسية
        </p>
      </div>
    </div>
  );
}

// CREATE ROOM
function CreateRoom({onBack,onCreated}) {
  const [name,setName]=useState('');
  const [avatar,setAvatar]=useState(AVATARS[0]);
  const [limit,setLimit]=useState(6);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');

  const create = async()=>{
    if(!name.trim()){setError('أدخل اسمك أولاً');return}
    setLoading(true);setError('');
    const code=generateCode();
    const player={id:'host_'+Date.now(),name:name.trim(),avatar,color:COLORS[0],score:0,isHost:true,ready:true};
    const room={code,hostId:player.id,status:'lobby',playerLimit:limit,players:{[player.id]:player},
      currentTurn:null,currentQuestion:null,answers:{},questionIndex:0,totalPlayers:0};
    try{
      if(db){
        await db.ref(`rooms/${code}`).set(room);
      } else {
        localRooms[code]=JSON.parse(JSON.stringify(room));
      }
      onCreated(code,player.id,true);
    }catch(e){setError('فشل إنشاء الغرفة');console.error(e)}
    setLoading(false);
  };

  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      <div style={{position:'relative',zIndex:2,width:'100%',maxWidth:'460px',padding:'20px'}}>
        <Logo size="small"/>
        <div className="glass-panel" style={{padding:'32px',marginTop:'20px',animation:'slide-in 0.4s ease'}}>
          <h2 style={{color:'var(--cyan)',marginBottom:'24px',fontSize:'1.4rem',textAlign:'center'}}>🏠 إنشاء غرفة</h2>
          <label style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',display:'block',marginBottom:'6px'}}>اسمك</label>
          <input className="input-field" placeholder="أدخل اسمك..." value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:'20px'}}/>
          <label style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',display:'block',marginBottom:'10px'}}>اختر أفاتار</label>
          <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:'8px',marginBottom:'20px'}}>
            {AVATARS.map(a=>(
              <button key={a} onClick={()=>setAvatar(a)} style={{
                background:avatar===a?'rgba(0,245,255,0.2)':'rgba(255,255,255,0.05)',
                border:`2px solid ${avatar===a?'var(--cyan)':'rgba(255,255,255,0.1)'}`,
                borderRadius:'10px',padding:'8px',fontSize:'1.4rem',cursor:'pointer',transition:'all 0.2s'
              }}>{a}</button>
            ))}
          </div>
          <label style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',display:'block',marginBottom:'10px'}}>
            عدد اللاعبين: <span style={{color:'var(--cyan)',fontWeight:'700'}}>{limit}</span>
          </label>
          <input type="range" min={4} max={8} value={limit} onChange={e=>setLimit(+e.target.value)} style={{width:'100%',marginBottom:'24px',accentColor:'var(--cyan)'}}/>
          {error&&<p style={{color:'#ff4444',textAlign:'center',marginBottom:'16px',fontSize:'0.95rem'}}>{error}</p>}
          <button className="btn btn-primary" onClick={create} disabled={loading} style={{width:'100%',marginBottom:'12px'}}>
            {loading?'جاري الإنشاء...':'✨ إنشاء الغرفة'}
          </button>
          <button className="btn" onClick={onBack} style={{width:'100%',background:'transparent',color:'rgba(232,244,255,0.5)',border:'1px solid rgba(255,255,255,0.1)'}}>
            ← رجوع
          </button>
        </div>
      </div>
    </div>
  );
}

// JOIN ROOM
function JoinRoom({onBack,onJoined}) {
  const [code,setCode]=useState('');
  const [name,setName]=useState('');
  const [avatar,setAvatar]=useState(AVATARS[3]);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');

  const join=async()=>{
    if(!name.trim()){setError('أدخل اسمك');return}
    if(code.trim().length<4){setError('أدخل كود الغرفة');return}
    setLoading(true);setError('');
    const upperCode=code.trim().toUpperCase();
    try{
      let room;
      if(db){
        const snap=await db.ref(`rooms/${upperCode}`).get();
        room=snap.val();
      } else {
        room=localRooms[upperCode];
      }
      if(!room){setError('الغرفة غير موجودة');setLoading(false);return}
      if(room.status!=='lobby'){setError('اللعبة بدأت بالفعل');setLoading(false);return}
      const players=Object.values(room.players||{});
      if(players.length>=room.playerLimit){setError('الغرفة ممتلئة');setLoading(false);return}
      const colorIndex=players.length%COLORS.length;
      const player={id:'p_'+Date.now(),name:name.trim(),avatar,color:COLORS[colorIndex],score:0,isHost:false,ready:false};
      if(db){
        await db.ref(`rooms/${upperCode}/players/${player.id}`).set(player);
      } else {
        if(!localRooms[upperCode].players) localRooms[upperCode].players={};
        localRooms[upperCode].players[player.id]=player;
      }
      onJoined(upperCode,player.id,false);
    }catch(e){setError('فشل الانضمام');console.error(e)}
    setLoading(false);
  };

  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      <div style={{position:'relative',zIndex:2,width:'100%',maxWidth:'460px',padding:'20px'}}>
        <Logo size="small"/>
        <div className="glass-panel" style={{padding:'32px',marginTop:'20px',animation:'slide-in 0.4s ease'}}>
          <h2 style={{color:'var(--purple)',marginBottom:'24px',fontSize:'1.4rem',textAlign:'center'}}>🚪 الانضمام لغرفة</h2>
          <label style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',display:'block',marginBottom:'6px'}}>كود الغرفة</label>
          <input className="input-field" placeholder="مثال: AB1C2D" value={code} onChange={e=>setCode(e.target.value.toUpperCase())}
            style={{marginBottom:'16px',textAlign:'center',fontSize:'1.5rem',letterSpacing:'4px'}}/>
          <label style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',display:'block',marginBottom:'6px'}}>اسمك</label>
          <input className="input-field" placeholder="أدخل اسمك..." value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:'20px'}}/>
          <label style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',display:'block',marginBottom:'10px'}}>اختر أفاتار</label>
          <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:'8px',marginBottom:'24px'}}>
            {AVATARS.map(a=>(
              <button key={a} onClick={()=>setAvatar(a)} style={{
                background:avatar===a?'rgba(191,0,255,0.2)':'rgba(255,255,255,0.05)',
                border:`2px solid ${avatar===a?'var(--purple)':'rgba(255,255,255,0.1)'}`,
                borderRadius:'10px',padding:'8px',fontSize:'1.4rem',cursor:'pointer',transition:'all 0.2s'
              }}>{a}</button>
            ))}
          </div>
          {error&&<p style={{color:'#ff4444',textAlign:'center',marginBottom:'16px',fontSize:'0.95rem'}}>{error}</p>}
          <button className="btn btn-secondary" onClick={join} disabled={loading} style={{width:'100%',marginBottom:'12px'}}>
            {loading?'جاري الانضمام...':'🎮 انضم الآن'}
          </button>
          <button className="btn" onClick={onBack} style={{width:'100%',background:'transparent',color:'rgba(232,244,255,0.5)',border:'1px solid rgba(255,255,255,0.1)'}}>
            ← رجوع
          </button>
        </div>
      </div>
    </div>
  );
}

// LOBBY SCREEN
function Lobby({roomCode,myId,isHost,onGameStart}) {
  const [room,setRoom]=useState(null);
  const [copying,setCopying]=useState(false);

  useEffect(()=>{
    if(db){
      const ref=db.ref(`rooms/${roomCode}`);
      ref.on('value',snap=>{
        const data=snap.val();
        if(data){
          setRoom(data);
          if(data.status==='playing') onGameStart(data);
        }
      });
      return ()=>ref.off();
    } else {
      const iv=setInterval(()=>{
        const data=localRooms[roomCode];
        if(data){setRoom({...data});if(data.status==='playing') onGameStart(data);}
      },500);
      return ()=>clearInterval(iv);
    }
  },[roomCode]);

  const startGame=async()=>{
    if(!room) return;
    const players=Object.values(room.players||{});
    if(players.length<2){alert('تحتاج لاعبَين على الأقل');return}
    const turnOrder=players.map(p=>p.id);
    const update={status:'playing',turnOrder,currentTurnIndex:0,currentQuestionIndex:0,
      currentPlayerId:turnOrder[0],phase:'writing',answers:{},questionsDone:[]};

// WRITING PHASE — current player writes question + answer
function WritingPhase({room,myId,roomCode,onDone}) {
  const [question,setQuestion]=useState('');
  const [answer,setAnswer]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [error,setError]=useState('');
  const [waitingMode,setWaitingMode]=useState(false);

  const qIndex=(room.currentQuestionIndex||0)+1;
  const currentPlayer=room.players?.[room.currentPlayerId];
  const isMyTurn=room.currentPlayerId===myId;

  useEffect(()=>{
    setQuestion('');setAnswer('');setError('');setSubmitting(false);
    setWaitingMode(!isMyTurn||(room.phase==='answering'));
  },[room.currentPlayerId,room.currentQuestionIndex,room.phase]);

  // Watch for phase changes
  useEffect(()=>{
    if(room.phase==='answering') setWaitingMode(true);
  },[room.phase]);

  const submitQuestion=async()=>{
    if(!question.trim()){setError('اكتب سؤالك أولاً');return}
    if(!answer.trim()){setError('اكتب إجابتك الصحيحة');return}
    setSubmitting(true);setError('');
    const qData={
      question:question.trim(),
      correctAnswer:answer.trim(),
      ownerId:myId,
      ownerName:currentPlayer?.name,
      answers:{},
      submittedAt:Date.now()
    };
    const update={currentQuestion:qData,phase:'answering',answers:{}};
    if(db) await db.ref(`rooms/${roomCode}`).update(update);
    else Object.assign(localRooms[roomCode],update);
    setSubmitting(false);
  };

  if(!isMyTurn || room.phase==='answering') {
    return (
      <div className="screen">
        <div className="bg-image"/>
        <div className="bg-overlay"/>
        <Particles/>
        <div style={{position:'relative',zIndex:2,textAlign:'center',padding:'20px',width:'100%',maxWidth:'480px'}}>
          <div style={{fontSize:'4rem',marginBottom:'16px',animation:'float 2s ease-in-out infinite'}}>
            {currentPlayer?.avatar||'🎮'}
          </div>
          <div className="glass-panel" style={{padding:'32px'}}>
            {room.phase==='writing'?(
              <>
                <h2 style={{color:'var(--gold)',fontSize:'1.4rem',marginBottom:'12px'}}>
                  {currentPlayer?.name} يكتب سؤاله...
                </h2>
                <p style={{color:'rgba(232,244,255,0.6)'}}>السؤال رقم {qIndex} من ٥</p>
                <div style={{marginTop:'20px',display:'flex',justifyContent:'center',gap:'8px'}}>
                  {[1,2,3,4].map(i=>(
                    <div key={i} style={{width:'12px',height:'12px',borderRadius:'50%',
                      background:i%2===0?'var(--cyan)':'var(--purple)',
                      animation:`float ${1+i*0.2}s ease-in-out infinite`}}/>
                  ))}
                </div>
              </>
            ):(
              <>
                <h2 style={{color:'var(--cyan)',fontSize:'1.4rem',marginBottom:'12px'}}>
                  📝 السؤال من {currentPlayer?.name}
                </h2>
                <div style={{background:'rgba(0,245,255,0.08)',border:'1px solid rgba(0,245,255,0.2)',
                  borderRadius:'12px',padding:'20px',marginBottom:'20px'}}>
                  <p style={{color:'var(--text)',fontSize:'1.2rem',lineHeight:1.7}}>{room.currentQuestion?.question}</p>
                </div>
                <p style={{color:'rgba(232,244,255,0.5)',fontSize:'0.9rem'}}>انتظر — المضيف يراجع الإجابات...</p>
              </>
            )}
          </div>
          <LiveScores room={room} myId={myId}/>
        </div>
      </div>
    );
  }

  if(room.phase==='answering') {
    return (
      <AnswerReview room={room} myId={myId} roomCode={roomCode} onDone={onDone}/>
    );
  }

  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      <div style={{position:'relative',zIndex:2,width:'100%',maxWidth:'540px',padding:'20px',height:'100%',display:'flex',flexDirection:'column',justifyContent:'center'}}>
        <Logo size="small"/>
        <div className="glass-panel" style={{padding:'28px',marginTop:'16px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
            <h2 style={{color:'var(--gold)',fontSize:'1.2rem'}}>⭐ دورك!</h2>
            <span style={{color:'rgba(232,244,255,0.6)',fontSize:'0.9rem'}}>السؤال {qIndex}/٥</span>
          </div>
          <div style={{display:'flex',gap:'6px',marginBottom:'20px'}}>
            {[1,2,3,4,5].map(i=>(
              <div key={i} style={{flex:1,height:'6px',borderRadius:'3px',
                background:i<=qIndex?'linear-gradient(90deg,var(--cyan),var(--purple))':'rgba(255,255,255,0.1)'}}/>
            ))}
          </div>
          <p style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',marginBottom:'6px'}}>
            📝 اكتب سؤالاً عن نفسك
          </p>
          <textarea className="input-field" rows={3} placeholder="مثال: ما هو لوني المفضل؟" value={question}
            onChange={e=>setQuestion(e.target.value)} style={{marginBottom:'16px',resize:'none',lineHeight:1.7}}/>
          <p style={{color:'rgba(232,244,255,0.7)',fontSize:'0.9rem',marginBottom:'6px'}}>
            🔒 إجابتك الصحيحة (سرية)
          </p>
          <input className="input-field" placeholder="الإجابة الحقيقية..." value={answer}
            onChange={e=>setAnswer(e.target.value)} style={{marginBottom:'8px'}}/>
          <p style={{color:'rgba(191,0,255,0.7)',fontSize:'0.8rem',marginBottom:'20px'}}>
            ⚠️ لن يرى أحد إجابتك قبل أن يجيب الجميع
          </p>
          {error&&<p style={{color:'#ff4444',marginBottom:'12px',textAlign:'center'}}>{error}</p>}
          <button className="btn btn-primary" onClick={submitQuestion} disabled={submitting} style={{width:'100%'}}>
            {submitting?'جاري الإرسال...':'✅ إرسال السؤال'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ANSWERING PHASE
function AnswerPhase({room,myId,roomCode,onDone}) {
  const [myAnswer,setMyAnswer]=useState('');
  const [submitted,setSubmitted]=useState(false);
  const [timeUp,setTimeUp]=useState(false);
  const isOwner=room.currentPlayerId===myId;
  const q=room.currentQuestion;

  const submit=async(ans)=>{
    if(submitted) return;
    setSubmitted(true);
    const a=ans||myAnswer.trim()||'—';
    if(db) await db.ref(`rooms/${roomCode}/answers/${myId}`).set({playerId:myId,answer:a,name:room.players?.[myId]?.name});
    else {
      if(!localRooms[roomCode].answers) localRooms[roomCode].answers={};
      localRooms[roomCode].answers[myId]={playerId:myId,answer:a,name:room.players?.[myId]?.name};
    }
  };

  const handleTimeUp=()=>{setTimeUp(true);if(!submitted) submit('—')};

  const answeredCount=Object.keys(room.answers||{}).length;
  const totalAnswerers=Object.keys(room.players||{}).length-1;

  if(isOwner) {
    return (
      <div className="screen">
        <div className="bg-image"/>
        <div className="bg-overlay"/>
        <Particles/>
        <div style={{position:'relative',zIndex:2,textAlign:'center',padding:'20px',width:'100%',maxWidth:'480px'}}>
          <Logo size="small"/>
          <div className="glass-panel" style={{padding:'32px',marginTop:'20px'}}>
            <div style={{fontSize:'3rem',marginBottom:'12px'}}>👀</div>
            <h2 style={{color:'var(--gold)',fontSize:'1.3rem',marginBottom:'12px'}}>الجميع يخمن إجابتك!</h2>
            <div style={{background:'rgba(0,245,255,0.08)',borderRadius:'12px',padding:'16px',marginBottom:'20px',
              border:'1px solid rgba(0,245,255,0.2)'}}>
              <p style={{color:'var(--text)',fontSize:'1.1rem'}}>{q?.question}</p>
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'12px'}}>
              <div style={{fontSize:'1rem',color:'rgba(232,244,255,0.6)'}}>أجاب</div>
              <div style={{fontSize:'2rem',fontWeight:'800',color:'var(--cyan)'}}>{answeredCount}</div>
              <div style={{fontSize:'1rem',color:'rgba(232,244,255,0.6)'}}>من {totalAnswerers}</div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      <div style={{position:'relative',zIndex:2,width:'100%',maxWidth:'480px',padding:'20px',height:'100%',display:'flex',flexDirection:'column',justifyContent:'center'}}>
        <Logo size="small"/>
        <div className="glass-panel" style={{padding:'28px',marginTop:'16px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
            <div>
              <p style={{color:'rgba(232,244,255,0.6)',fontSize:'0.85rem'}}>سؤال من</p>
              <p style={{color:'var(--gold)',fontWeight:'700',fontSize:'1.1rem'}}>
                {room.players?.[room.currentPlayerId]?.avatar} {q?.ownerName}
              </p>
            </div>
            <Timer seconds={ANSWER_TIME} total={ANSWER_TIME} onEnd={handleTimeUp}/>
          </div>
          <div style={{background:'rgba(0,245,255,0.08)',border:'1px solid rgba(0,245,255,0.2)',
            borderRadius:'14px',padding:'20px',marginBottom:'20px'}}>
            <p style={{color:'var(--text)',fontSize:'1.2rem',lineHeight:1.7,textAlign:'center'}}>{q?.question}</p>
          </div>
          {!submitted?(
            <>
              <input className="input-field" placeholder="إجابتك هنا..." value={myAnswer}
                onChange={e=>setMyAnswer(e.target.value)} style={{marginBottom:'16px'}}
                onKeyDown={e=>e.key==='Enter'&&submit()}/>
              <button className="btn btn-primary" onClick={()=>submit()} style={{width:'100%'}}
                disabled={!myAnswer.trim()}>
                🎯 إرسال إجابتي

            <div style={{textAlign:'center',padding:'20px',background:'rgba(0,255,136,0.1)',

                {answeredCount}/{totalAnswerers} أجابوا
              </p>
            </div>
          )}
        </div>
        <LiveScores room={room} myId={myId}/>
      </div>
    </div>
  );
}

// ANSWER REVIEW — host sees all answers and reveals
function AnswerReview({room,myId,roomCode,onDone}) {
  const [revealed,setRevealed]=useState(false);
  const [results,setResults]=useState(null);
  const [advancing,setAdvancing]=useState(false);
  const isHost=room.players?.[myId]?.isHost;
  const q=room.currentQuestion;
  const answers=Object.values(room.answers||{});
  const players=room.players||{};
  const totalAnswerers=Object.keys(players).length-1;

  const reveal=async()=>{
    const correct=normalizeAnswer(q?.correctAnswer);
    const winners=answers.filter(a=>normalizeAnswer(a.answer)===correct);
    const res={winners,correct:q?.correctAnswer,allAnswered:answers.length>=totalAnswerers};
    setResults(res);setRevealed(true);

    // Calculate score updates
    const updates={};
    if(winners.length>0){
      winners.forEach(w=>{
        const cur=players[w.playerId]?.score||0;
        updates[`rooms/${roomCode}/players/${w.playerId}/score`]=cur+1;
      });
    } else {
      // Owner gets point
      const ownerId=room.currentPlayerId;
      const cur=players[ownerId]?.score||0;
      updates[`rooms/${roomCode}/players/${ownerId}/score`]=cur+1;
    }
    if(db) await db.ref().update(updates);
    else {
      Object.entries(updates).forEach(([path,val])=>{
        const parts=path.split('/');
        localRooms[parts[1]].players[parts[3]].score=val;
      });
    }
  };

  const advance=async()=>{
    if(advancing) return;
    setAdvancing(true);
    const totalPlayers=Object.keys(players).length;
    const turnOrder=room.turnOrder||Object.keys(players);
    let nextQIdx=(room.currentQuestionIndex||0)+1;
    let nextTurnIdx=room.currentTurnIndex||0;
    let nextPlayerId=room.currentPlayerId;

    if(nextQIdx>=5){
      nextQIdx=0;
      nextTurnIdx+=1;
      if(nextTurnIdx>=turnOrder.length){
        // Game over
        const update={status:'finished',phase:'finished'};
        if(db) await db.ref(`rooms/${roomCode}`).update(update);
        else Object.assign(localRooms[roomCode],update);
        setAdvancing(false);return;
      }
      nextPlayerId=turnOrder[nextTurnIdx];
    }

    const update={currentQuestionIndex:nextQIdx,currentTurnIndex:nextTurnIdx,
      currentPlayerId:nextPlayerId,phase:'writing',currentQuestion:null,answers:{}};
    if(db) await db.ref(`rooms/${roomCode}`).update(update);
    else Object.assign(localRooms[roomCode],update);
    setAdvancing(false);
  };

  const waitingCount=answers.length;

  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      <div style={{position:'relative',zIndex:2,width:'100%',maxWidth:'540px',padding:'20px',height:'100%',display:'flex',flexDirection:'column',justifyContent:'center'}}>
        <Logo size="small"/>
        <div className="glass-panel" style={{padding:'28px',marginTop:'16px'}}>
          {!revealed?(
            <>
              <div style={{textAlign:'center',marginBottom:'20px'}}>
                <h2 style={{color:'var(--cyan)',fontSize:'1.3rem',marginBottom:'8px'}}>📊 الإجابات الواردة</h2>
                <p style={{color:'rgba(232,244,255,0.5)',fontSize:'0.9rem'}}>{waitingCount} من {totalAnswerers} أجابوا</p>
              </div>
              <div style={{background:'rgba(0,245,255,0.08)',borderRadius:'12px',padding:'16px',marginBottom:'20px',
                border:'1px solid rgba(0,245,255,0.15)'}}>
                <p style={{color:'rgba(232,244,255,0.6)',fontSize:'0.85rem',marginBottom:'4px'}}>السؤال:</p>
                <p style={{color:'var(--text)',fontSize:'1.1rem'}}>{q?.question}</p>
              </div>
              <div className="content-scroll" style={{maxHeight:'180px',display:'flex',flexDirection:'column',gap:'8px',marginBottom:'20px'}}>
                {answers.map((a,i)=>(
                  <div key={i} className="player-card" style={{display:'flex',alignItems:'center',gap:'12px'}}>
                    <div className="avatar" style={{background:players[a.playerId]?.color+'33',
                      borderColor:players[a.playerId]?.color+'66',fontSize:'1.1rem',width:'40px',height:'40px'}}>
                      {players[a.playerId]?.avatar}
                    </div>
                    <span style={{color:'var(--text)',flex:1,fontWeight:'500'}}>{a.name}</span>
                    <span style={{color:'rgba(232,244,255,0.4)',fontSize:'0.9rem'}}>أجاب ✓</span>
                  </div>
                ))}
              </div>
              {isHost&&(
                <button className="btn btn-gold" onClick={reveal} style={{width:'100%'}}>
                  🎭 اكشف الإجابات!
                </button>
              )}
              {!isHost&&<p style={{color:'rgba(232,244,255,0.5)',textAlign:'center'}}>المضيف سيكشف الإجابات...</p>}
            </>
          ):(
            <>
              <div style={{textAlign:'center',marginBottom:'16px'}}>
                <div style={{fontSize:'2.5rem',marginBottom:'8px'}}>{results.winners.length>0?'🎉':'😈'}</div>
                <h2 style={{color:results.winners.length>0?'var(--cyan)':'var(--gold)',fontSize:'1.3rem'}}>
                  {results.winners.length>0?'أصابوا الإجابة!':'لم يخمن أحد!'}
                </h2>
              </div>
              <div style={{background:'rgba(0,255,136,0.1)',border:'1px solid rgba(0,255,136,0.3)',
                borderRadius:'12px',padding:'16px',marginBottom:'16px',textAlign:'center'}}>
                <p style={{color:'rgba(232,244,255,0.6)',fontSize:'0.85rem',marginBottom:'6px'}}>الإجابة الصحيحة</p>
                <p style={{color:'#00ff88',fontSize:'1.4rem',fontWeight:'800'}}>{results.correct}</p>
              </div>
              <div className="content-scroll" style={{maxHeight:'160px',display:'flex',flexDirection:'column',gap:'8px',marginBottom:'20px'}}>
                {answers.map((a,i)=>{
                  const isRight=normalizeAnswer(a.answer)===normalizeAnswer(results.correct);
                  return (
                    <div key={i} className="player-card" style={{
                      display:'flex',alignItems:'center',gap:'10px',
                      borderColor:isRight?'rgba(0,255,136,0.4)':'rgba(255,50,50,0.2)',
                      background:isRight?'rgba(0,255,136,0.08)':'rgba(255,50,50,0.05)'
                    }}>
                      <div style={{fontSize:'1rem'}}>{players[a.playerId]?.avatar}</div>
                      <span style={{flex:1,color:'var(--text)',fontSize:'0.95rem'}}>{a.name}</span>
                      <span style={{color:'rgba(232,244,255,0.6)',fontSize:'0.9rem'}}>«{a.answer}»</span>
                      <span style={{fontSize:'1.2rem'}}>{isRight?'✅':'❌'}</span>
                    </div>
                  );
                })}
              </div>
              {results.winners.length===0&&(
                <div style={{textAlign:'center',marginBottom:'12px',color:'var(--gold)',fontSize:'0.95rem'}}>
                  🏆 {room.players?.[room.currentPlayerId]?.name} يحصل على نقطة!
                </div>
              )}
              {isHost&&(
                <button className="btn btn-primary" onClick={advance} disabled={advancing} style={{width:'100%'}}>
                  {advancing?'جاري التقدم...':'⏭ التالي'}
                </button>
              )}
              {!isHost&&<p style={{color:'rgba(232,244,255,0.5)',textAlign:'center',fontSize:'0.9rem'}}>المضيف سيكمل اللعبة...</p>}
            </>
          )}
        </div>
        <LiveScores room={room} myId={myId}/>
      </div>
    </div>
  );
}

// LIVE SCORE MINI
function LiveScores({room,myId}) {
  const players=Object.values(room?.players||{}).sort((a,b)=>b.score-a.score);
  return (
    <div className="glass-panel" style={{marginTop:'16px',padding:'12px 16px'}}>
      <p style={{color:'rgba(232,244,255,0.5)',fontSize:'0.8rem',marginBottom:'8px',textAlign:'center'}}>النقاط الحالية</p>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap',justifyContent:'center'}}>
        {players.map((p,i)=>(
          <div key={p.id} style={{display:'flex',alignItems:'center',gap:'6px',
            background:p.id===myId?'rgba(0,245,255,0.1)':'rgba(255,255,255,0.05)',
            border:`1px solid ${p.id===myId?'rgba(0,245,255,0.3)':'rgba(255,255,255,0.1)'}`,
            borderRadius:'20px',padding:'4px 10px'}}>
            <span style={{fontSize:'0.9rem'}}>{p.avatar}</span>
            <span style={{color:'var(--text)',fontSize:'0.85rem'}}>{p.name}</span>
            <span style={{color:'var(--gold)',fontWeight:'700',fontSize:'0.9rem'}}>{p.score}</span>
            {i===0&&p.score>0&&<span style={{fontSize:'0.8rem'}}>👑</span>}
          </div>
        ))}
      </div>
    </div>
  );
}

// GAME SCREEN — routes to correct phase
function GameScreen({roomCode,myId,isHost}) {
  const [room,setRoom]=useState(null);

  useEffect(()=>{
    if(db){
      const ref=db.ref(`rooms/${roomCode}`);
      ref.on('value',snap=>{const d=snap.val();if(d) setRoom(d)});
      return ()=>ref.off();
    } else {
      const iv=setInterval(()=>{
        const d=localRooms[roomCode];
        if(d) setRoom({...d,players:{...d.players},answers:{...d.answers}});
      },300);
      return ()=>clearInterval(iv);
    }
  },[roomCode]);

  if(!room) return <div className="screen"><div className="bg-image"/><div style={{color:'var(--cyan)',position:'relative',zIndex:2,fontSize:'1.5rem'}}>⏳</div></div>;
  if(room.status==='finished') return <FinalScreen room={room} myId={myId} roomCode={roomCode}/>;

  const phase=room.phase;
  if(phase==='writing') {
    if(room.currentPlayerId===myId) return <WritingPhase room={room} myId={myId} roomCode={roomCode}/>;
    return <WaitingWriting room={room} myId={myId}/>;
  }
  if(phase==='answering') {
    if(room.currentPlayerId===myId) return <AnswerReview room={room} myId={myId} roomCode={roomCode}/>;
    return <AnswerPhase room={room} myId={myId} roomCode={roomCode}/>;
  }
  return <div className="screen"><div className="bg-image"/><div style={{color:'var(--cyan)',position:'relative',zIndex:2}}>⏳ جاري التحضير...</div></div>;
}

function WaitingWriting({room,myId}) {
  const cp=room.players?.[room.currentPlayerId];
  const qIdx=(room.currentQuestionIndex||0)+1;
  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      <div style={{position:'relative',zIndex:2,textAlign:'center',padding:'20px',width:'100%',maxWidth:'480px'}}>
        <Logo size="small"/>
        <div className="glass-panel" style={{padding:'40px 32px',marginTop:'24px'}}>
          <div style={{fontSize:'4rem',marginBottom:'16px',animation:'float 2.5s ease-in-out infinite'}}>{cp?.avatar}</div>
          <h2 style={{color:'var(--gold)',fontSize:'1.3rem',marginBottom:'8px'}}>{cp?.name} يكتب سؤاله...</h2>
          <p style={{color:'rgba(232,244,255,0.5)',marginBottom:'24px'}}>السؤال رقم {qIdx} من ٥</p>
          <div style={{display:'flex',justifyContent:'center',gap:'12px'}}>
            {[...Array(5)].map((_,i)=>(
              <div key={i} style={{width:'10px',height:'10px',borderRadius:'50%',
                background:i<qIdx-1?'var(--gold)':i===qIdx-1?'var(--cyan)':'rgba(255,255,255,0.15)',
                boxShadow:i===qIdx-1?'0 0 12px var(--cyan)':'none'}}/>
            ))}
          </div>
        </div>
        <LiveScores room={room} myId={myId}/>
      </div>
    </div>
  );
}

// FINAL SCREEN
function FinalScreen({room,myId,roomCode}) {
  const [showConfetti,setShowConfetti]=useState(true);
  const players=Object.values(room.players||{}).sort((a,b)=>b.score-a.score);
  const winner=players[0];
  const iWon=winner?.id===myId;

  useEffect(()=>{const t=setTimeout(()=>setShowConfetti(false),5000);return()=>clearTimeout(t)},[]);

  const playAgain=async()=>{
    const reset={status:'lobby',phase:null,currentQuestion:null,answers:{},
      currentTurnIndex:0,currentQuestionIndex:0,turnOrder:null,currentPlayerId:null};
    const resetPlayers={};
    Object.entries(room.players||{}).forEach(([id,p])=>{
      resetPlayers[id]={...p,score:0,ready:false};
    });
    reset.players=resetPlayers;
    if(db) await db.ref(`rooms/${roomCode}`).update(reset);
    else Object.assign(localRooms[roomCode],reset);
    window.location.reload();
  };

  const medals=['🥇','🥈','🥉'];

  return (
    <div className="screen">
      <div className="bg-image"/>
      <div className="bg-overlay"/>
      <Particles/>
      {showConfetti&&<Confetti/>}
      <div style={{position:'relative',zIndex:2,width:'100%',maxWidth:'540px',padding:'20px',textAlign:'center'}}>
        <Logo size="small"/>
        <div className="glass-panel" style={{padding:'32px',marginTop:'20px',animation:'winner-pop 0.8s ease'}}>
          <div style={{marginBottom:'16px'}}>
            <div className="crown">👑</div>
            <h2 style={{color:'var(--gold)',fontSize:'2rem',fontWeight:'900',
              textShadow:'0 0 30px rgba(255,215,0,0.7)',marginBottom:'4px'}}>{winner?.avatar} {winner?.name}</h2>
            <p style={{color:'rgba(232,244,255,0.7)',fontSize:'1rem'}}>الفائز بـ {winner?.score} نقطة!</p>
          </div>
          {iWon&&<div style={{background:'linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,165,0,0.1))',
            border:'1px solid rgba(255,215,0,0.4)',borderRadius:'12px',padding:'14px',marginBottom:'20px'}}>
            <p style={{color:'var(--gold)',fontSize:'1.1rem',fontWeight:'700'}}>🎊 أنت الفائز! ممتاز!</p>
          </div>}
          <div style={{marginBottom:'24px'}}>
            <h3 style={{color:'var(--cyan)',marginBottom:'16px',fontSize:'1.1rem'}}>🏆 قائمة الترتيب</h3>
            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              {players.map((p,i)=>(
                <div key={p.id} className="player-card" style={{
                  display:'flex',alignItems:'center',gap:'12px',
                  background:p.id===myId?'rgba(0,245,255,0.1)':'rgba(255,255,255,0.04)',
                  borderColor:i===0?'rgba(255,215,0,0.4)':p.id===myId?'rgba(0,245,255,0.3)':'rgba(255,255,255,0.08)',
                  animation:`slide-in ${0.2+i*0.1}s ease`
                }}>
                  <span style={{fontSize:'1.5rem'}}>{medals[i]||`${i+1}.`}</span>
                  <div className="avatar" style={{background:p.color+'33',borderColor:p.color+'66',fontSize:'1.1rem',width:'40px',height:'40px'}}>
                    {p.avatar}
                  </div>
                  <span style={{flex:1,color:'var(--text)',fontWeight:'600',textAlign:'right'}}>{p.name}</span>
                  <span className="score-badge" style={{fontSize:'1rem'}}>{p.score} نقطة</span>
                </div>
              ))}
            </div>
          </div>
          <div style={{display:'flex',gap:'12px'}}>
            <button className="btn btn-gold" onClick={playAgain} style={{flex:1}}>🔄 العب مجدداً</button>
            <button className="btn btn-secondary" onClick={()=>window.location.reload()} style={{flex:1}}>🏠 الرئيسية</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// MAIN APP
function App() {
  const [screen,setScreen]=useState('home');
  const [roomCode,setRoomCode]=useState('');
  const [myId,setMyId]=useState('');
  const [isHost,setIsHost]=useState(false);
  const [roomData,setRoomData]=useState(null);

  const handleCreated=(code,id,host)=>{setRoomCode(code);setMyId(id);setIsHost(host);setScreen('lobby')};
  const handleJoined=(code,id,host)=>{setRoomCode(code);setMyId(id);setIsHost(host);setScreen('lobby')};
  const handleGameStart=(data)=>{setRoomData(data);setScreen('game')};

  return (
    <>
      {screen==='home'&&<HomeScreen onHost={()=>setScreen('create')} onJoin={()=>setScreen('join')}/>}
      {screen==='create'&&<CreateRoom onBack={()=>setScreen('home')} onCreated={handleCreated}/>}
      {screen==='join'&&<JoinRoom onBack={()=>setScreen('home')} onJoined={handleJoined}/>}
      {screen==='lobby'&&<Lobby roomCode={roomCode} myId={myId} isHost={isHost} onGameStart={handleGameStart}/>}
      {screen==='game'&&<GameScreen roomCode={roomCode} myId={myId} isHost={isHost}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
