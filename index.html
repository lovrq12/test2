<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#02040b;
overflow:hidden;
color:white;
height:100vh;
}

canvas{
position:fixed;
inset:0;
}

#bgCanvas{
z-index:0;
}

.ui{
position:relative;
z-index:5;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.panel{
width:min(1100px,95%);
background:rgba(8,10,22,0.78);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.08);
border-radius:32px;
padding:32px;
box-shadow:0 0 60px rgba(0,0,0,0.7);
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(25px)}
to{opacity:1;transform:translateY(0)}
}

.title{
font-size:92px;
font-weight:900;
letter-spacing:10px;
text-align:center;
background:linear-gradient(180deg,#ff5959,#6d0000);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:
0 0 10px rgba(255,0,0,.8),
0 0 25px rgba(255,0,0,.6),
0 0 40px rgba(255,0,0,.4);
margin-bottom:10px;
}

.subtitle{
text-align:center;
opacity:.75;
margin-bottom:35px;
font-size:18px;
letter-spacing:3px;
}

.menuBtns{

grid-template-columns:1fr 1fr;
gap:20px;
}

.btn{
background:linear-gradient(145deg,#171d34,#0d1225);
border:1px solid rgba(255,255,255,.08);
padding:22px;
border-radius:24px;
font-size:20px;
color:white;
cursor:pointer;
transition:.25s;
text-align:center;
}

.btn:hover{
transform:translateY(-4px) scale(1.01);
box-shadow:0 0 30px rgba(0,140,255,.35);
}

input{
width:100%;
padding:18px;
background:#090d1b;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
color:white;
font-size:17px;
margin-bottom:15px;
}

.characters{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:18px;
margin-top:20px;
}

.charCard{
background:linear-gradient(145deg,#141c31,#080c18);
border-radius:24px;
padding:18px;
border:2px solid transparent;
transition:.25s;

}

.charCard.active{
border-color:#ff2b2b;

}

.sprite{

position:relative;
margin-bottom:12px;
}

.pixel{

width:12px;
height:12px;
}

.charName{
text-align:center;
font-weight:bold;
}

#lobbyPlayers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:16px;
margin-top:25px;
}

.playerCard{
background:#0a1021;
border-radius:18px;
padding:16px;
border:1px solid rgba(255,255,255,.07);
}

.topBar{
position:absolute;
top:15px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
align-items:flex-start;
z-index:20;
pointer-events:none;
}

.hudBox{
background:rgba(0,0,0,.45);
backdrop-filter:blur(10px);
padding:15px 20px;
border-radius:20px;
min-width:220px;
}

#gameCanvas{
display:none;
background:linear-gradient(180deg,#0f172d,#060913 65%,#10191b);
}

.mobileControls{
position:absolute;
bottom:20px;
left:0;
right:0;
display:none;
justify-content:space-between;
padding:20px;
z-index:40;
}

.mobileBtn{
width:80px;
height:80px;
border-radius:50%;
background:rgba(255,255,255,.1);
border:2px solid rgba(255,255,255,.2);
color:white;
font-size:30px;
display:flex;
align-items:center;
justify-content:center;
user-select:none;
}

@media(max-width:768px){
.mobileControls{
display:flex;
}

.title{
font-size:60px;
}

.menuBtns{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="gameCanvas"></canvas>

<div class="ui" id="ui">
<div class="panel" id="screen"></div>
</div>

<div class="topBar" id="topBar" style="display:none">
<div class="hudBox">
<h3>RACE POSITIONS</h3>
<div id="positions"></div>
</div>
<div class="hudBox">
<h3>ROOM</h3>
<div id="roomInfo"></div>
</div>
</div>

<div class="mobileControls">
<div style="display:flex;gap:15px">
<div class="mobileBtn" id="leftBtn">◀</div>
<div class="mobileBtn" id="rightBtn">▶</div>
</div>
<div class="mobileBtn" id="jumpBtn">▲</div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyOfE8IrWe_UNZaTus-OJygAk4wIILY_jjw",
authDomain: "endx-8ac33.firebaseapp.com",
databaseURL: "https://endx-8ac33-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "endx-8ac33",
storageBucket: "endx-8ac33.firebasestorage.app",
messagingSenderId: "11855321835",
appId: "1:11855321835:web:bb03b9acb3abf5143b1eb2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// REALTIME MULTIPLAYER SYNC
// All room state, players, positions, race progress,
// winner state, and lobby data are synced live
// using Firebase Realtime Database.

const screen = document.getElementById('screen');
const ui = document.getElementById('ui');
const topBar = document.getElementById('topBar');
const positionsDiv = document.getElementById('positions');
const roomInfo = document.getElementById('roomInfo');

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');

const gameCanvas = document.getElementById('gameCanvas');
const ctx = gameCanvas.getContext('2d');

let roomCode = null;
let playerId = 'p_' + Math.random().toString(36).substring(2,8);
let playerName = 'Player';
let selectedCharacter = 0;
let isHost = false;
let players = {};
let gameStarted = false;
let winner = null;

const keys = {};

const trackLength = 5200;
const gravity = 0.7;

const traps = [
{x:600,w:80,type:'spikes'},
{x:1100,w:100,type:'fire'},
{x:1700,w:90,type:'rock'},
{x:2400,w:80,type:'spikes'},
{x:3100,w:100,type:'fire'},
{x:3900,w:100,type:'rock'},
{x:4500,w:120,type:'spikes'}
];

const characters = [
{name:'Soldier',color:'#ff3c3c'},
{name:'Zombie Hunter',color:'#ff9d59'},
{name:'Scientist',color:'#78d0ff'},
{name:'Survivor',color:'#d6d6d6'},
{name:'Mutant',color:'#3cff68'},
{name:'Agent',color:'#6f7cff'}
];

function resize(){
bgCanvas.width = innerWidth;
bgCanvas.height = innerHeight;
gameCanvas.width = innerWidth;
gameCanvas.height = innerHeight;
}
window.addEventListener('resize',resize);
resize();

const planets = [
{x:300,y:200,r:110,color:'#7c170f',speed:.15},
{x:1200,y:120,r:70,color:'#767f99',speed:.08}
];

function animateBG(){
bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);

const g = bgCtx.createLinearGradient(0,0,0,bgCanvas.height);
g.addColorStop(0,'#030510');
g.addColorStop(1,'#0b1020');
bgCtx.fillStyle = g;
bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

for(let i=0;i<120;i++){
bgCtx.fillStyle = 'rgba(255,255,255,.7)';
bgCtx.fillRect((i*91)%bgCanvas.width,(i*57)%bgCanvas.height,2,2);
}

planets.forEach((p,index)=>{
p.x -= p.speed;
if(p.x < -200) p.x = bgCanvas.width + 200;

const grd = bgCtx.createRadialGradient(p.x,p.y,20,p.x,p.y,p.r);
grd.addColorStop(0,p.color);
grd.addColorStop(1,'transparent');
bgCtx.fillStyle = grd;
bgCtx.beginPath();
bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
bgCtx.fill();
});

requestAnimationFrame(animateBG);
}
animateBG();

function makeCode(){
return Math.random().toString(36).substring(2,6).toUpperCase();
}

function homeScreen(){
screen.innerHTML = `
<h1 class="title">RIP</h1>
<div class="subtitle">RACING</div>
<div class="menuBtns">
<div class="btn" onclick="openCreate()">CREATE ROOM</div>
<div class="btn" onclick="openJoin()">JOIN WITH CODE</div>
</div>
`;
}

function renderCharacter(index){
const c = characters[index];
return `
<div class="sprite">
<div class="pixel" style="left:48px;top:0;background:${c.color}"></div>
<div class="pixel" style="left:36px;top:12px;background:${c.color}"></div>
<div class="pixel" style="left:48px;top:12px;background:#fff"></div>
<div class="pixel" style="left:60px;top:12px;background:${c.color}"></div>
<div class="pixel" style="left:36px;top:24px;background:${c.color}"></div>
<div class="pixel" style="left:48px;top:24px;background:${c.color}"></div>
<div class="pixel" style="left:60px;top:24px;background:${c.color}"></div>
<div class="pixel" style="left:36px;top:36px;background:${c.color}"></div>
<div class="pixel" style="left:60px;top:36px;background:${c.color}"></div>
<div class="pixel" style="left:36px;top:48px;background:${c.color}"></div>
<div class="pixel" style="left:60px;top:48px;background:${c.color}"></div>
<div class="pixel" style="left:24px;top:60px;background:${c.color}"></div>
<div class="pixel" style="left:72px;top:60px;background:${c.color}"></div>
</div>
<div class="charName">${c.name}</div>
`;
}

function openCreate(){
screen.innerHTML = `
<h1 class="title">RIP</h1>
<input id="playerNameInput" placeholder="Enter your name" maxlength="12"/>
<h2>Choose Character</h2>
<div class="characters">
${characters.map((c,i)=>`
<div class="charCard ${i===0?'active':''}" onclick="pickCharacter(${i})" id="char${i}">
${renderCharacter(i)}
</div>`).join('')}
</div>
<br>
<div class="btn" onclick="createRoom()">CREATE ROOM</div>
`;
}

function openJoin(){
screen.innerHTML = `
<h1 class="title">JOIN</h1>
<input id="playerNameInput" placeholder="Enter your name" maxlength="12"/>
<input id="roomInput" placeholder="Room Code" maxlength="4"/>
<h2>Choose Character</h2>
<div class="characters">
${characters.map((c,i)=>`
<div class="charCard ${i===0?'active':''}" onclick="pickCharacter(${i})" id="char${i}">
${renderCharacter(i)}
</div>`).join('')}
</div>
<br>
<div class="btn" onclick="joinRoom()">JOIN ROOM</div>
`;
}

function pickCharacter(i){
selectedCharacter = i;
document.querySelectorAll('.charCard').forEach(el=>el.classList.remove('active'));
document.getElementById('char'+i).classList.add('active');
}

async function createRoom(){
playerName = document.getElementById('playerNameInput').value || 'Host';
roomCode = makeCode();
isHost = true;

await db.ref('rooms/'+roomCode).set({
state:'lobby',
host:playerId,
created:Date.now()
});

joinRoomData();
}

async function joinRoom(){
playerName = document.getElementById('playerNameInput').value || 'Player';
roomCode = document.getElementById('roomInput').value.toUpperCase();

const snap = await db.ref('rooms/'+roomCode).get();
if(!snap.exists()){
alert('Room not found');
return;
}

joinRoomData();
}

function joinRoomData(){
const playerRef = db.ref(`rooms/${roomCode}/players/${playerId}`);

playerRef.set({
id:playerId,
name:playerName,
character:selectedCharacter,
x:50,
y:0,
vy:0,
finished:false,
progress:0
});

playerRef.onDisconnect().remove();

listenRoom();
showLobby();
}

function listenRoom(){
db.ref(`rooms/${roomCode}`).on('value',snap=>{
const data = snap.val();
if(!data) return;

players = data.players || {};

if(data.state === 'racing' && !gameStarted){
startGame();
}

if(data.winner){
showWinner(data.winner);
}

renderLobbyPlayers();
});
}

function showLobby(){
screen.innerHTML = `
<h1 class="title">ROOM ${roomCode}</h1>
<div class="subtitle">WAITING FOR PLAYERS</div>
<div id="lobbyPlayers"></div>
${isHost?'<br><div class="btn" onclick="startRace()">START RACE</div>':''}
`;
}

function renderLobbyPlayers(){
const container = document.getElementById('lobbyPlayers');
if(!container) return;

container.innerHTML = '';

Object.values(players).forEach(p=>{
const card = document.createElement('div');
card.className = 'playerCard';
card.innerHTML = `
<h3>${p.name}</h3>
<p>${characters[p.character].name}</p>
<div style="margin-top:10px;color:${characters[p.character].color}">READY</div>
`;
container.appendChild(card);
});
}

function startRace(){
db.ref(`rooms/${roomCode}`).update({state:'racing'});
}

function startGame(){
gameStarted = true;
ui.style.display = 'none';
gameCanvas.style.display = 'block';
topBar.style.display = 'flex';
roomInfo.innerHTML = roomCode;

loop();
}

function updateLocalPlayer(){
const p = players[playerId];
if(!p) return;

if(keys['ArrowRight'] || keys['d']) p.x += 6;
if(keys['ArrowLeft'] || keys['a']) p.x -= 6;

if((keys['ArrowUp'] || keys['w'] || keys[' ']) && p.y >= 0){
p.vy = -13;
}

p.vy += gravity;
p.y += p.vy;

if(p.y > 0){
p.y = 0;
p.vy = 0;
}

traps.forEach(t=>{
if(p.x + 40 > t.x && p.x < t.x+t.w && p.y > -40){
p.x -= 40;
}
});

if(p.x < 0) p.x = 0;

p.progress = p.x;

if(p.x >= trackLength-200 && !p.finished){
p.finished = true;
db.ref(`rooms/${roomCode}`).update({winner:p.name});
}

db.ref(`rooms/${roomCode}/players/${playerId}`).update({
x:p.x,
y:p.y,
vy:p.vy,
progress:p.progress,
finished:p.finished
});
}

function drawTrack(cameraX){
ctx.fillStyle = '#1e2f29';
ctx.fillRect(0,gameCanvas.height-130,gameCanvas.width,130);

for(let x=-cameraX%100;x<gameCanvas.width;x+=100){
ctx.fillStyle='rgba(255,255,255,.05)';
ctx.fillRect(x,gameCanvas.height-130,50,130);
}

traps.forEach(t=>{
const tx = t.x-cameraX;

if(t.type==='spikes'){
ctx.fillStyle='#bbb';
for(let i=0;i<5;i++){
ctx.beginPath();
ctx.moveTo(tx+i*18,gameCanvas.height-130);
ctx.lineTo(tx+10+i*18,gameCanvas.height-170);
ctx.lineTo(tx+18+i*18,gameCanvas.height-130);
ctx.fill();
}
}

if(t.type==='fire'){
ctx.fillStyle='orange';
ctx.fillRect(tx,gameCanvas.height-120,t.w,30);
}

if(t.type==='rock'){
ctx.fillStyle='#555';
ctx.beginPath();
ctx.arc(tx+40,gameCanvas.height-145,35,0,Math.PI*2);
ctx.fill();
}
});

ctx.fillStyle='white';
ctx.fillRect(trackLength-cameraX,120,12,gameCanvas.height-250);
}

function drawPlayers(cameraX){
const sorted = Object.values(players).sort((a,b)=>b.progress-a.progress);

positionsDiv.innerHTML = sorted.map((p,i)=>`${i+1}. ${p.name}`).join('<br>');

sorted.forEach((p,i)=>{
const x = p.x-cameraX;
const y = gameCanvas.height-170+p.y;

ctx.fillStyle = characters[p.character].color;
ctx.fillRect(x,y,45,55);

ctx.fillStyle='white';
ctx.fillRect(x+10,y+10,6,6);
ctx.fillRect(x+28,y+10,6,6);

ctx.fillStyle='black';
ctx.fillRect(x+12,y+12,2,2);
ctx.fillRect(x+30,y+12,2,2);

ctx.fillStyle='white';
ctx.font='15px Arial';
ctx.fillText(p.name,x-10,y-10);
});
}

function loop(){
ctx.clearRect(0,0,gameCanvas.width,gameCanvas.height);

updateLocalPlayer();

const me = players[playerId];
const cameraX = me ? Math.max(0,me.x-300) : 0;

ctx.fillStyle='#09111d';
ctx.fillRect(0,0,gameCanvas.width,gameCanvas.height);

ctx.fillStyle='rgba(255,255,255,.04)';
for(let i=0;i<50;i++){
ctx.fillRect((i*220-cameraX*0.2)%gameCanvas.width,i*14,120,3);
}

ctx.fillStyle='#203245';
ctx.fillRect(0,260,gameCanvas.width,100);

ctx.fillStyle='#15202d';
ctx.fillRect(0,320,gameCanvas.width,100);

ctx.fillStyle='#0f1823';
ctx.fillRect(0,390,gameCanvas.width,100);

drawTrack(cameraX);
drawPlayers(cameraX);

if(!winner){
requestAnimationFrame(loop);
}
}

function showWinner(name){
if(winner) return;
winner = name;

setTimeout(()=>{
ui.style.display='flex';
gameCanvas.style.display='none';

screen.innerHTML = `
<h1 class="title">${name}</h1>
<div class="subtitle">WINS THE RACE</div>
<div class="menuBtns">
<div class="btn" onclick="location.reload()">PLAY AGAIN</div>
</div>
`;
},1200);
}

window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

function mobileHold(id,key){
const el = document.getElementById(id);

el.addEventListener('touchstart',e=>{
e.preventDefault();
keys[key]=true;
});

el.addEventListener('touchend',e=>{
e.preventDefault();
keys[key]=false;
});
}

mobileHold('leftBtn','ArrowLeft');
mobileHold('rightBtn','ArrowRight');
mobileHold('jumpBtn','ArrowUp');

homeScreen();
</script>
</body>
</html>
