<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game — Mafia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/theme.css"/>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div id="toast-wrap"></div>

<!-- Role reveal modal -->
<div id="role-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <span class="role-icon" id="modal-icon">🎭</span>
    <div class="role-title" id="modal-role-name">Your role</div>
    <p class="role-desc" id="modal-role-desc">Loading…</p>
    <div id="modal-timer" style="font-family:var(--mono);font-size:1.4rem;font-weight:800;color:var(--accent);margin-bottom:16px;">6</div>
    <button class="btn btn-primary" id="modal-ok" onclick="closeRoleModal()">Got it!</button>
  </div>
</div>

<div class="page" id="main-page">

  <!-- Header -->
  <div style="width:100%;max-width:var(--max-w);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div>
      <span style="font-size:0.75rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text2);">Room</span>
      <span style="font-family:var(--mono);font-weight:800;color:var(--accent);font-size:1rem;margin-left:6px;" id="hdr-code">——</span>
    </div>
    <div id="my-role-chip" style="display:none;font-size:0.8125rem;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-full);padding:4px 12px;"></div>
  </div>

  <!-- Spectator banner -->
  <div id="spectator-banner" class="spectator-banner" style="display:none;width:100%;max-width:var(--max-w);">
    👻 You've been eliminated — watching as spectator
  </div>

  <!-- Phase + timer -->
  <div class="card" style="padding:16px;margin-bottom:0;width:100%;max-width:var(--max-w);">
    <div id="phase-banner" class="phase-banner" style="margin-bottom:8px;">Loading…</div>
    <div class="timer-display" id="timer-display">—</div>
    <div id="host-controls" class="host-controls" style="display:none;margin-top:12px;margin-bottom:0;">
      <p class="muted" style="font-size:0.8125rem;margin-bottom:8px;">Host controls</p>
      <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="handleAdvancePhase()">
        ⏭ Force advance phase
      </button>
    </div>
  </div>

  <!-- Players -->
  <div class="card" style="margin-top:12px;width:100%;max-width:var(--max-w);">
    <span class="label">Players</span>
    <div class="players-grid" id="players-grid"></div>
  </div>

  <!-- Night action -->
  <div class="card" id="night-action-card" style="display:none;margin-top:12px;width:100%;max-width:var(--max-w);">
    <span class="label" id="night-action-label">Your action</span>
    <div id="action-grid" style="display:flex;flex-direction:column;gap:8px;margin-top:10px;"></div>
    <p class="muted center" id="action-done-msg" style="display:none;padding:12px;">
      ✅ Action submitted. Waiting for night to end…
    </p>
  </div>

  <!-- Voting -->
  <div class="card" id="voting-card" style="display:none;margin-top:12px;width:100%;max-width:var(--max-w);">
    <span class="label">Vote to eliminate</span>
    <div id="vote-grid" style="display:flex;flex-direction:column;gap:8px;margin-top:10px;"></div>
    <p class="muted center" id="vote-done-msg" style="display:none;padding:12px;">
      ✅ Vote cast. Waiting for voting to end…
    </p>
  </div>

  <!-- Detective result -->
  <div class="card" id="detective-result-card" style="display:none;margin-top:12px;width:100%;max-width:var(--max-w);">
    <span class="label">🔍 Investigation result</span>
    <div id="detective-result-content" style="padding:12px;text-align:center;"></div>
  </div>

  <!-- Elimination result -->
  <div class="card" id="result-card" style="display:none;margin-top:12px;width:100%;max-width:var(--max-w);">
    <div id="result-content" style="text-align:center;padding:8px;"></div>
  </div>

  <!-- Chat -->
  <div class="card" id="chat-card" style="margin-top:12px;width:100%;max-width:var(--max-w);">
    <span class="label" id="chat-label">💬 Public chat</span>
    <div class="chat-box">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Message…" maxlength="300"/>
        <button class="btn btn-primary btn-sm" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Win screen -->
  <div class="card" id="win-card" style="display:none;margin-top:12px;width:100%;max-width:var(--max-w);">
    <div class="win-screen">
      <span class="win-icon" id="win-icon">🎭</span>
      <div class="win-title" id="win-title">Game over</div>
      <p class="win-sub" id="win-sub"></p>
      <button class="btn btn-primary" style="max-width:240px;margin:0 auto;"
              onclick="window.location.href='index.html'">Play again</button>
    </div>
  </div>

</div>

<script src="js/constants.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/rooms.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
const roomCode = new URLSearchParams(window.location.search).get("room")?.toUpperCase();
const myUid    = window.currentUser.uid;
let myRole     = null;
let lastPhase  = null;
let isHost     = false;
let myVote     = null;
let myNightAction = null;
let timerInterval = null;
let phaseAdvanceTimeout = null;
let chatChannel   = null;
let chatListener  = null;

if (!roomCode) window.location.href = "index.html";

const ROLE_DESCS = {
  mafia:     "You are part of the Mafia. Each night, choose a citizen to eliminate.",
  citizen:   "You are a Citizen. Work together during the day to identify and vote out the Mafia.",
  detective: "You are the Detective. Each night, investigate one player to learn if they are Mafia.",
  doctor:    "You are the Doctor. Each night, protect one player from elimination."
};

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, type="info", ms=3000) {
  const wrap = document.getElementById("toast-wrap");
  const t    = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer(phaseEndsAt) {
  clearInterval(timerInterval);
  const display = document.getElementById("timer-display");
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, Math.round((phaseEndsAt - Date.now()) / 1000));
    display.textContent = remaining + "s";
    display.className   = "timer-display" + (remaining <= 10 ? " urgent" : "");
    if (remaining <= 0 && isHost) {
      clearInterval(timerInterval);
      display.textContent = "0s";
      clearTimeout(phaseAdvanceTimeout);
      phaseAdvanceTimeout = setTimeout(() => advancePhase(roomCode), 1500);
    }
  }, 500);
}

// ── Role modal ─────────────────────────────────────────────────────────────
function showRoleModal(role) {
  document.getElementById("modal-icon").textContent      = ROLE_EMOJI[role] || "🎭";
  document.getElementById("modal-role-name").textContent = role.charAt(0).toUpperCase() + role.slice(1);
  document.getElementById("modal-role-desc").textContent = ROLE_DESCS[role] || "";
  document.getElementById("role-modal").style.display    = "flex";

  const chip = document.getElementById("my-role-chip");
  chip.style.display    = "block";
  chip.textContent      = ROLE_EMOJI[role] + " " + role;
  chip.style.color      = ROLE_COLORS[role] || "var(--text)";
  chip.style.borderColor= ROLE_COLORS[role] || "var(--border)";

  let secs = 6;
  document.getElementById("modal-timer").textContent = secs;
  const countdown = setInterval(() => {
    secs--;
    document.getElementById("modal-timer").textContent = secs;
    if (secs <= 0) { clearInterval(countdown); closeRoleModal(); }
  }, 1000);
}

function closeRoleModal() {
  document.getElementById("role-modal").style.display = "none";
}

// ── Phase banner ───────────────────────────────────────────────────────────
function renderPhaseBanner(phase) {
  const banner = document.getElementById("phase-banner");
  const MAP = {
    [PHASES.ROLE_REVEAL]: ["phase-reveal",     "🎭 Roles revealed — remember your role!"],
    [PHASES.NIGHT]:       ["phase-night",      "🌙 Night phase — the Mafia is acting…"],
    [PHASES.DISCUSSION]:  ["phase-discussion", "☀️ Day — Discuss who the Mafia might be!"],
    [PHASES.VOTING]:      ["phase-voting",     "🗳️ Voting — Choose who to eliminate!"],
    [PHASES.RESULT]:      ["phase-result",     "📋 Results"],
    [PHASES.ENDED]:       ["phase-ended",      "🏁 Game over!"]
  };
  const [cls, txt] = MAP[phase] || ["", phase];
  banner.className   = "phase-banner " + cls;
  banner.textContent = txt;
}

// ── Players ────────────────────────────────────────────────────────────────
function renderPlayers(players, room) {
  const grid = document.getElementById("players-grid");
  grid.innerHTML = "";

  players.sort((a,b) => {
    if (a.uid === room.hostId) return -1;
    if (b.uid === room.hostId) return 1;
    return a.joinedAt - b.joinedAt;
  });

  players.forEach(p => {
    const isMe  = p.uid === myUid;
    const dead  = !p.isAlive;
    let roleTag = "";

    if (isMe && p.role) {
      roleTag = `<span class="badge badge-${p.role}">${ROLE_EMOJI[p.role]} ${p.role}</span>`;
    } else if (room.phase === PHASES.ENDED && p.role) {
      roleTag = `<span class="badge badge-${p.role}">${ROLE_EMOJI[p.role]} ${p.role}</span>`;
    }

    const card = document.createElement("div");
    card.className = "player-card" + (dead ? " eliminated" : "");
    card.innerHTML = `
      <div class="avatar" style="${dead ? "opacity:0.4" : ""}">${getInitials(p.displayName)}</div>
      <div class="player-info">
        <div class="player-name">
          ${escapeHtml(p.displayName)}
          ${isMe ? "<span style='color:var(--text2);font-weight:400;font-size:0.8rem;'>(you)</span>" : ""}
          ${dead ? " ☠️" : ""}
        </div>
        <div class="player-badges">
          ${p.uid === room.hostId ? '<span class="badge badge-host">Host</span>' : ""}
          ${roleTag}
          ${dead ? '<span class="badge" style="background:var(--red-dim);color:var(--red);border:1px solid var(--red);">Eliminated</span>' : ""}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ── Night action ───────────────────────────────────────────────────────────
function renderNightAction(alive, room) {
  const card     = document.getElementById("night-action-card");
  const grid     = document.getElementById("action-grid");
  const doneMsg  = document.getElementById("action-done-msg");
  const label    = document.getElementById("night-action-label");
  const myPlayer = room.players?.[myUid];

  if (!myPlayer?.isAlive || myRole === ROLES.CITIZEN || room.phase !== PHASES.NIGHT) {
    card.style.display = "none"; return;
  }
  card.style.display = "block";

  let actionLabel = "", actionType = "";
  if (myRole === ROLES.MAFIA)     { actionLabel = "🔫 Choose a target to eliminate"; actionType = "mafiaTarget"; }
  if (myRole === ROLES.DOCTOR)    { actionLabel = "💊 Choose a player to protect";   actionType = "doctorSave"; }
  if (myRole === ROLES.DETECTIVE) { actionLabel = "🔍 Choose a player to investigate"; actionType = "detectiveCheck"; }
  label.textContent = actionLabel;

  if (myNightAction) {
    grid.style.display    = "none";
    doneMsg.style.display = "block";
    return;
  }

  grid.style.display    = "flex";
  doneMsg.style.display = "none";
  grid.innerHTML = "";

  const targets = alive.filter(p => {
    if (p.uid === myUid) return false;
    if (myRole === ROLES.MAFIA && p.role === ROLES.MAFIA) return false;
    return true;
  });

  if (!targets.length) {
    grid.innerHTML = '<p class="muted center" style="padding:12px;">No valid targets.</p>';
    return;
  }

  targets.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.innerHTML = `<div class="avatar" style="width:30px;height:30px;font-size:0.75rem;">${getInitials(p.displayName)}</div> ${escapeHtml(p.displayName)}`;
    btn.onclick = async () => {
      btn.classList.add("chosen");
      myNightAction = p.uid;
      await submitNightAction(roomCode, actionType, p.uid);

      if (myRole === ROLES.DETECTIVE) {
        const isMafia = p.role === ROLES.MAFIA;
        const rc  = document.getElementById("detective-result-card");
        const rcc = document.getElementById("detective-result-content");
        rc.style.display = "block";
        rcc.innerHTML = `
          <div style="font-size:2rem;margin-bottom:8px;">${isMafia ? "🔴" : "🟢"}</div>
          <div style="font-size:1rem;font-weight:700;color:${isMafia ? "var(--red)" : "var(--green)"};">
            ${escapeHtml(p.displayName)} is ${isMafia ? "MAFIA" : "NOT Mafia"}
          </div>
        `;
      }

      grid.style.display    = "none";
      doneMsg.style.display = "block";
    };
    grid.appendChild(btn);
  });
}

// ── Voting ─────────────────────────────────────────────────────────────────
function renderVoting(alive, room) {
  const card     = document.getElementById("voting-card");
  const grid     = document.getElementById("vote-grid");
  const doneMsg  = document.getElementById("vote-done-msg");
  const myPlayer = room.players?.[myUid];

  if (room.phase !== PHASES.VOTING) { card.style.display = "none"; return; }
  card.style.display = "block";

  const votes      = room.votes || {};
  const totalVotes = Object.keys(votes).length;
  grid.innerHTML   = "";

  const makeVoteRow = (p, clickable) => {
    const voteCount = Object.values(votes).filter(v => v === p.uid).length;
    const pct = totalVotes ? Math.round(voteCount / totalVotes * 100) : 0;
    const el  = document.createElement(clickable ? "button" : "div");
    el.className = "vote-btn" + (myVote === p.uid ? " voted" : "");
    if (!clickable) el.style.cursor = "default";
    el.innerHTML = `
      <div class="avatar" style="width:30px;height:30px;font-size:0.75rem;">${getInitials(p.displayName)}</div>
      <span style="flex:1;font-size:0.9rem;">${escapeHtml(p.displayName)}${myVote === p.uid ? " ✓" : ""}</span>
      <div class="vote-bar-wrap"><div class="vote-bar-fill" style="width:${pct}%"></div></div>
      <span class="vote-count">${voteCount}</span>
    `;
    if (clickable) {
      el.onclick = async () => {
        myVote = p.uid;
        await castVote(roomCode, p.uid);
        renderVoting(alive, room);
      };
    }
    grid.appendChild(el);
  };

  if (!myPlayer?.isAlive) {
    // Spectator: see votes, can't cast
    alive.forEach(p => makeVoteRow(p, false));
    doneMsg.style.display = "none";
    return;
  }

  if (myVote) {
    doneMsg.style.display = "block";
    alive.forEach(p => makeVoteRow(p, false));
    return;
  }

  doneMsg.style.display = "none";
  alive.filter(p => p.uid !== myUid).forEach(p => makeVoteRow(p, true));
}

// ── Result ─────────────────────────────────────────────────────────────────
function renderResult(room) {
  const card = document.getElementById("result-card");
  if (room.phase !== PHASES.RESULT) { card.style.display = "none"; return; }
  card.style.display = "block";

  const players   = room.players || {};
  const dayElim   = room.lastEliminatedDay;
  const nightElim = room.lastEliminatedNight;
  let html = "";

  if (nightElim && players[nightElim]) {
    html += `<div style="margin-bottom:12px;">
      <div style="font-size:1.6rem;">☠️</div>
      <div style="font-weight:700;color:var(--red);margin-top:4px;">
        ${escapeHtml(players[nightElim].displayName)} was eliminated last night.
      </div>
    </div>`;
  } else if (room.phaseCount > 1) {
    html += `<div style="margin-bottom:12px;">
      <div style="font-size:1.6rem;">💊</div>
      <div style="font-weight:700;color:var(--green);margin-top:4px;">The doctor saved someone! No one died last night.</div>
    </div>`;
  }

  if (dayElim && players[dayElim]) {
    html += `<div>
      <div style="font-size:1.6rem;">🗳️</div>
      <div style="font-weight:700;color:var(--red);margin-top:4px;">
        ${escapeHtml(players[dayElim].displayName)} was voted out.
        <span style="color:var(--text2);font-size:0.875rem;display:block;margin-top:2px;">
          They were ${ROLE_EMOJI[players[dayElim].role]} ${players[dayElim].role}
        </span>
      </div>
    </div>`;
  }

  if (!html) html = '<p class="muted">Preparing next round…</p>';
  document.getElementById("result-content").innerHTML = html;
}

// ── Win ────────────────────────────────────────────────────────────────────
function renderWin(room) {
  ["night-action-card","voting-card","result-card","chat-card"]
    .forEach(id => document.getElementById(id).style.display = "none");
  document.getElementById("win-card").style.display = "block";

  if (room.winner === "mafia") {
    document.getElementById("win-icon").textContent  = "🔫";
    document.getElementById("win-title").textContent = "Mafia wins!";
    document.getElementById("win-sub").textContent   = "The Mafia has taken control of the town.";
  } else {
    document.getElementById("win-icon").textContent  = "🎉";
    document.getElementById("win-title").textContent = "Citizens win!";
    document.getElementById("win-sub").textContent   = "All Mafia members have been eliminated!";
  }
}

// ── Chat ───────────────────────────────────────────────────────────────────
function setupChat(room) {
  const phase   = room.phase;
  const isMafia = myRole === ROLES.MAFIA;
  const isAlive = room.players?.[myUid]?.isAlive ?? true;
  let channel   = "public";
  let canType   = true;

  if (phase === PHASES.NIGHT && isMafia) {
    channel = "mafia";
    document.getElementById("chat-label").textContent = "🔫 Mafia chat (private)";
  } else if (phase === PHASES.NIGHT) {
    canType = false;
    document.getElementById("chat-label").textContent = "💬 Chat (disabled at night)";
  } else {
    document.getElementById("chat-label").textContent = "💬 Public chat";
  }

  document.querySelector(".chat-input-row").style.display =
    (isAlive && canType) ? "flex" : "none";

  if (chatChannel === channel) return;
  chatChannel = channel;

  // Detach old listener
  if (chatListener) {
    window.db.ref(`rooms/${roomCode}/chat/${chatChannel}`).off("value", chatListener);
    chatListener = null;
  }

  const msgs = document.getElementById("chat-messages");
  msgs.innerHTML = "";

  chatListener = window.db.ref(`rooms/${roomCode}/chat/${channel}`)
    .on("value", snap => {
      msgs.innerHTML = "";
      const all = snap.val() || {};
      Object.values(all)
        .sort((a,b) => a.timestamp - b.timestamp)
        .forEach(msg => {
          const div = document.createElement("div");
          div.className = "chat-msg";
          if (!msg.uid) {
            div.className += " chat-system";
            div.textContent = msg.text;
          } else {
            const isMine    = msg.uid === myUid;
            const isMafiaMsg= channel === "mafia";
            div.innerHTML = `
              <span class="chat-name ${isMafiaMsg ? "mafia-name" : ""}">${escapeHtml(msg.displayName)}${isMine ? " (you)" : ""}</span>
              <span class="chat-text">${escapeHtml(msg.text)}</span>
            `;
          }
          msgs.appendChild(div);
        });
      msgs.scrollTop = msgs.scrollHeight;
    });
}

async function sendMessage() {
  const input = document.getElementById("chat-input");
  const text  = input.value.trim();
  if (!text) return;
  input.value = "";
  await sendChat(roomCode, text, chatChannel || "public");
}

document.getElementById("chat-input").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

// ── Host phase advance ─────────────────────────────────────────────────────
async function handleAdvancePhase() {
  try { await advancePhase(roomCode); }
  catch(e) { showToast(e.message, "error"); }
}

// ── Main render ────────────────────────────────────────────────────────────
function renderGame(room) {
  const phase    = room.phase;
  const players  = Object.values(room.players || {});
  const alive    = players.filter(p => p.isAlive);
  const myPlayer = room.players?.[myUid];

  isHost = room.hostId === myUid;
  document.getElementById("hdr-code").textContent = room.roomCode || roomCode;

  // My role
  if (myPlayer?.role && myRole !== myPlayer.role) {
    myRole = myPlayer.role;
  }

  // Spectator
  document.getElementById("spectator-banner").style.display =
    (myPlayer && !myPlayer.isAlive) ? "block" : "none";

  // Phase banner
  renderPhaseBanner(phase);

  // Timer
  if (room.phaseEndsAt) startTimer(room.phaseEndsAt);

  // Host controls
  document.getElementById("host-controls").style.display = isHost ? "block" : "none";

  // Role reveal (once)
  if (phase === PHASES.ROLE_REVEAL && lastPhase !== PHASES.ROLE_REVEAL && myPlayer?.role) {
    showRoleModal(myPlayer.role);
  }

  // Reset per-phase state
  if (phase === PHASES.NIGHT && lastPhase !== PHASES.NIGHT) {
    myNightAction = null;
    document.getElementById("action-done-msg").style.display = "none";
    document.getElementById("action-grid").style.display     = "flex";
    document.getElementById("detective-result-card").style.display = "none";
  }
  if (phase === PHASES.VOTING && lastPhase !== PHASES.VOTING) {
    myVote = null;
    document.getElementById("vote-done-msg").style.display = "none";
  }

  lastPhase = phase;

  renderPlayers(players, room);
  renderNightAction(alive, room);
  renderVoting(alive, room);
  renderResult(room);
  setupChat(room);

  if (phase !== PHASES.NIGHT) {
    document.getElementById("detective-result-card").style.display = "none";
  }

  if (phase === PHASES.ENDED && room.winner) {
    renderWin(room);
    clearInterval(timerInterval);
  }
}

// ── Firebase listener (no auth) ────────────────────────────────────────────
const roomRef = window.db.ref("rooms/" + roomCode);

roomRef.on("value", snap => {
  if (!snap.exists()) {
    showToast("Room not found. Redirecting…", "error", 3000);
    setTimeout(() => { window.location.href = "index.html"; }, 3000);
    return;
  }
  renderGame(snap.val());
});

window.addEventListener("beforeunload", () => roomRef.off("value"));
</script>
</body>
</html>
