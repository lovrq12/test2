<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مباراة مستري بوكس</title>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-page">
  <canvas id="gameCanvas" aria-label="مشهد غرفة التحقيق"></canvas>
  <div id="assetErrorPanel" class="asset-error-panel" hidden></div>

  <div class="game-overlay">
    <header class="match-hud">
      <div>
        <span class="hud-label">المباراة</span>
        <strong id="matchTitle">بانتظار المباراة</strong>
      </div>
      <div class="score-pill" id="scorePill">0 - 0</div>
      <div>
        <span class="hud-label">الوقت</span>
        <strong id="timerLabel">--</strong>
      </div>
    </header>

    <aside class="bracket-panel">
      <h2>البطولة</h2>
      <div id="bracketView" class="bracket-view"></div>
    </aside>

    <aside class="game-chat-panel">
      <h2>الشات</h2>
      <div id="gameChatList" class="chat-list" aria-live="polite"></div>
      <form id="gameChatForm" class="chat-form">
        <input id="gameChatInput" type="text" maxlength="180" placeholder="اكتب رسالة">
        <button type="submit">إرسال</button>
      </form>
    </aside>

    <section class="play-panel" aria-live="polite">
      <div id="secretPanel" class="secret-panel" hidden></div>
      <div id="turnLog" class="turn-log"></div>
      <form id="turnForm" class="turn-form" hidden>
        <input id="turnInput" type="text" maxlength="220">
        <button id="turnSubmitBtn" type="submit">إرسال</button>
      </form>
      <div id="choiceButtons" class="choice-buttons"></div>
      <div id="revealPanel" class="reveal-panel" hidden></div>
      <p id="gameStatus" class="status-line" role="status"></p>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/curves/NURBSUtils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/curves/NURBSCurve.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/game-state.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/3d/loaders.js"></script>
  <script src="js/3d/camera.js"></script>
  <script src="js/3d/effects.js"></script>
  <script src="js/3d/characters.js"></script>
  <script src="js/3d/box.js"></script>
  <script src="js/3d/scene.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
