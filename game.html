<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmares - اللعبة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="assets/shared/game-entry.css">
</head>
<body class="portal-nightmares portal-session">

<a class="portal-home-link" href="index.html">رجوع للرئيسية</a>

<div id="spectate-banner">أنت في وضع المشاهدة</div>

<div class="game-bg day" id="game-bg"></div>
<div id="table-overlay"></div>
<div id="effects-layer"></div>

<div id="phase-header">
  <div id="phase-round-badge">الجولة 1</div>
  <div id="phase-title-frame">
    <span id="phase-label-text" class="phase-label">تحميل...</span>
  </div>
  <div id="timer-row">
    <span id="timer-display" class="timer-display">--:--</span>
  </div>
</div>

<div id="loading-screen">
  <div class="loading-logo">NIGHTMARES</div>
  <div class="loading-spinner"></div>
</div>

<div id="cinematic-overlay">
  <div id="cinematic-text"><h1></h1><p></p></div>
</div>

<div class="modal-overlay" id="role-reveal-modal">
  <div class="role-reveal-modal glass-card">
    <div class="role-reveal-card">
      <img id="rr-img" src="" alt="دور" loading="lazy" decoding="async">
    </div>
    <div class="role-reveal-name" id="rr-name"></div>
    <div class="role-reveal-desc" id="rr-desc"></div>
    <div class="role-reveal-team" id="rr-team"></div>
    <button class="btn btn-primary btn-full" id="rr-close">فهمت دوري</button>
  </div>
</div>

<div class="role-preview-overlay" id="role-preview-modal">
  <div class="role-preview-card">
    <img id="role-preview-img" src="" alt="دور" loading="lazy" decoding="async">
  </div>
</div>

<div class="whisper-reveal-overlay" id="whisper-reveal-overlay">
  <div class="whisper-label">الهمسة كشفت...</div>
  <div class="whisper-card-wrapper">
    <img id="whisper-reveal-img" src="" alt="" loading="lazy" decoding="async">
  </div>
  <div class="whisper-label" id="whisper-label"></div>
  <div class="whisper-countdown" id="whisper-countdown">10</div>
</div>

<div id="win-screen">
  <div id="win-cinematic" class="nightmares-win-cinematic"></div>
  <div class="win-title" id="win-title"></div>
  <div class="win-subtitle" id="win-subtitle"></div>
  <div class="win-roles-reveal" id="win-roles-reveal"></div>
  <div id="win-redirect-countdown" class="win-redirect-countdown"></div>
  <div class="win-actions">
    <button class="btn btn-ghost" onclick="window.location.href='index.html'">الرئيسية</button>
  </div>
</div>

<div id="game-page">
  <aside class="action-panel" aria-label="لوحة اللاعب">
    <div class="action-panel-header">
      <div class="game-title-sm">NIGHTMARES</div>
      <div class="phase-indicator" id="phase-indicator">
        <div class="phase-dot"></div>
        <span class="phase-label phase-label-side">الطاولة</span>
      </div>
    </div>

    <div class="dead-overlay-banner" id="dead-banner" style="display:none;"></div>

    <div class="my-role-section">
      <h4>دورك في هذه اللعبة</h4>
      <div class="role-card-display" id="role-card-display">
        <img id="my-role-img" src="assets/cards/basic/citizen_new.png" alt="دور" loading="lazy" decoding="async">
        <div class="role-card-name">
          <span id="my-role-name">تحميل...</span>
          <span class="role-card-team" id="my-role-team"></span>
        </div>
      </div>
    </div>

    <div class="night-action-section" id="night-action-section" style="display:none;">
      <h4>فعل الليل</h4>
      <div class="target-list" id="night-target-list"></div>
      <button class="btn btn-primary btn-sm btn-full confirm-action-btn" id="confirm-night-action" style="display:none;">تأكيد الاختيار</button>
    </div>

    <div class="ability-section" id="ability-section" style="display:none;">
      <h4>قدرتك الخاصة</h4>
      <div id="ability-content"></div>
    </div>

    <div class="voting-section" id="voting-section" style="display:none;">
      <h4>التصويت</h4>
      <div class="vote-list" id="vote-list"></div>
    </div>
  </aside>

  <main class="game-main">
    <section class="game-table-area" aria-label="طاولة اللاعبين">
      <div class="game-table-container">
        <div class="game-players-ring" id="game-players-ring"></div>
      </div>
    </section>
  </main>
</div>

<section id="v2-role-panel" class="v2-mobile-panel" data-v2-panel="role" aria-label="معلومات الكرت">
  <div class="v2-panel-card v2-role-info-card">
    <div class="v2-panel-kicker">معلومات الكرت</div>
    <div class="v2-role-art-frame">
      <img id="v2-role-img" src="assets/cards/basic/citizen_new.png" alt="دورك" loading="lazy" decoding="async">
    </div>
    <h2 id="v2-role-name">دورك</h2>
    <div id="v2-role-team" class="v2-role-team"></div>
    <div id="v2-role-fake" class="v2-role-fake" hidden></div>
    <p id="v2-role-desc" class="v2-role-desc"></p>
    <div id="v2-role-ability" class="v2-role-ability"></div>
  </div>
</section>

<section id="v2-chat-panel" class="v2-mobile-panel" data-v2-panel="chat" aria-label="الرسائل">
  <div class="v2-panel-card v2-chat-card">
    <div class="v2-panel-kicker">الرسائل</div>
    <div class="game-chat-tabs" id="v2-chat-tabs">
      <button id="tab-public" class="chat-tab active" type="button">الشات العام</button>
      <button id="tab-mafia" class="chat-tab mafia-tab" type="button">شات المافيا</button>
    </div>
    <div id="chat-lock-msg" class="chat-lock-msg"></div>
    <div id="game-chat-messages" class="chat-messages"></div>
    <div id="mafia-chat-wrap" class="mafia-chat-wrap" aria-hidden="true">
      <span class="mafia-chat-label">قناة خاصة لفريق المافيا</span>
    </div>
    <div class="chat-input-row">
      <input id="game-chat-input" type="text" maxlength="200" placeholder="اكتب رسالتك...">
      <button id="game-chat-send" class="btn btn-primary" type="button">إرسال</button>
    </div>
  </div>
</section>

<nav id="v2-mobile-nav" class="v2-mobile-nav" aria-label="تنقل اللعبة">
  <button id="v2-visual-toggle" class="v2-visual-toggle" type="button" aria-label="تبديل الوضع" aria-pressed="false">☾</button>
  <button class="v2-nav-tab active" data-tab="table" type="button" aria-pressed="true">
    <span class="v2-nav-icon">⌂</span>
    <span class="v2-nav-label">البيت</span>
  </button>
  <button class="v2-nav-tab" data-tab="role" type="button" aria-pressed="false">
    <span class="v2-nav-icon">◇</span>
    <span class="v2-nav-label">الجرس</span>
  </button>
  <button class="v2-nav-tab" data-tab="chat" type="button" aria-pressed="false">
    <span class="v2-nav-icon">☾</span>
    <span class="v2-nav-label">الشات</span>
  </button>
</nav>

<button id="role-tab" class="role-tab" type="button" aria-label="دورك">
  <span class="role-tab-label">دورك</span>
  <span class="role-tab-thumb">
    <img id="role-tab-img" src="assets/cards/basic/citizen_new.png" alt="دورك" loading="lazy" decoding="async">
  </span>
  <span id="role-tab-name" class="role-tab-name">تحميل...</span>
</button>

<div id="role-modal-overlay" class="role-modal-overlay" aria-hidden="true">
  <section id="role-modal" class="role-modal glass-card" role="dialog" aria-modal="true" aria-labelledby="role-modal-name">
    <button id="role-modal-close" class="role-modal-close" type="button" aria-label="إغلاق">×</button>
    <div class="role-modal-image-wrap">
      <img id="role-modal-img" src="assets/cards/basic/citizen_new.png" alt="دورك" loading="lazy" decoding="async">
    </div>
    <h2 id="role-modal-name">دورك</h2>
    <div id="role-modal-team" class="role-modal-team"></div>
    <div id="role-modal-fake" class="role-modal-fake" hidden></div>
    <p id="role-modal-desc" class="role-modal-desc"></p>
    <div id="role-modal-ability" class="role-modal-ability"></div>
  </section>
</div>

<div id="bottom-action-bar" class="bottom-action-bar hidden">
  <button id="bottom-unvote-btn" class="bottom-action-btn" type="button">سحب الصوت</button>
  <div class="bottom-vote-guide" aria-live="polite">
    <strong>التصويت</strong>
    <span>اختر لاعباً من الطاولة للتصويت ضده</span>
  </div>
  <button id="bottom-skip-btn" class="bottom-action-btn" type="button">تخطي</button>
</div>

<div id="toast-container"></div>

<div id="action-menu-overlay" style="display:none;"></div>
<div id="action-menu" style="display:none;">
  <div id="action-menu-title"></div>
  <div id="action-menu-list"></div>
  <button id="action-menu-cancel" type="button">إلغاء</button>
</div>

<div id="event-announcement-overlay" class="event-announcement-overlay hidden">
  <div class="event-announcement-card">
    <div id="event-announcement-icon" class="event-announcement-icon"></div>
    <h2 id="event-announcement-title"></h2>
    <p id="event-announcement-subtitle"></p>
  </div>
</div>

<div id="sound-btn">🔊</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/sound.js"></script>
<script src="js/roles.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('rr-close').addEventListener('click', () => {
  document.getElementById('role-reveal-modal').classList.remove('active');
});

document.getElementById('role-card-display')?.addEventListener('click', () => {
  const img = document.getElementById('my-role-img');
  const preview = document.getElementById('role-preview-img');
  if (img && preview && img.src) {
    preview.src = img.src;
    document.getElementById('role-preview-modal').classList.add('active');
  }
});

document.getElementById('role-preview-modal')?.addEventListener('click', () => {
  document.getElementById('role-preview-modal').classList.remove('active');
});

function showMyRoleCard(me) {
  const roleData = RoleEngine.getRole(me.role);
  if (me.role === 'liar') {
    const fakeRole = getPlayerLiarFakeRole(me);
    document.getElementById('rr-img').src = getLiarDisplayCard(me);
    document.getElementById('rr-name').textContent = 'دورك: الكذاب';
    document.getElementById('rr-name').style.color = roleData.color;
    document.getElementById('rr-desc').textContent = roleData.description;
    document.getElementById('rr-team').textContent = `الكذبة الحالية: ${RoleEngine.getRoleArabicName(fakeRole)}`;
    document.getElementById('rr-team').style.color = roleData.color;
    document.getElementById('role-reveal-modal').classList.add('active');
    return;
  }

  document.getElementById('rr-img').src = roleData.image;
  document.getElementById('rr-name').textContent = roleData.arabicName;
  document.getElementById('rr-name').style.color = roleData.color;
  document.getElementById('rr-desc').textContent = roleData.description;

  const teamMap = { mafia: 'فريق المافيا', citizens: 'المواطنون', neutral: 'محايد' };
  document.getElementById('rr-team').textContent = teamMap[roleData.team] || '';
  document.getElementById('rr-team').style.color = roleData.color;
  document.getElementById('role-reveal-modal').classList.add('active');

  if (RoleEngine.isMafia(me.role)) {
    showToast('أنت من المافيا', 'error', 4000);
  }
}
</script>
<script src="js/game.js"></script>
</body>
</html>
