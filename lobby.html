<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby — Mafia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/theme.css"/>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div id="toast-wrap"></div>

<div class="page">
  <div class="card">

    <!-- Header -->
    <div class="center" style="margin-bottom:20px;">
      <p class="muted" style="margin-bottom:8px;">Room code</p>
      <div class="room-code-big" id="room-code-display">
        <span id="room-code-text">——————</span>
        <button onclick="copyCode()"
                style="background:none;border:none;cursor:pointer;color:var(--accent);font-size:1rem;padding:0;"
                title="Copy">📋</button>
      </div>
      <p class="muted" style="margin-top:8px;" id="player-count-label">Loading…</p>
    </div>

    <!-- Readiness bar -->
    <div class="readiness-bar">
      <div class="readiness-fill" id="readiness-fill" style="width:0%"></div>
    </div>

    <!-- Settings summary -->
    <div class="settings-box" style="margin-bottom:16px;">
      <div class="setting-row"><span class="setting-key">🌙 Night phase</span><span class="setting-value" id="s-night">—</span></div>
      <div class="setting-row"><span class="setting-key">💬 Discussion</span><span class="setting-value" id="s-discuss">—</span></div>
      <div class="setting-row"><span class="setting-key">🗳️ Voting</span><span class="setting-value" id="s-vote">—</span></div>
      <div class="setting-row"><span class="setting-key">🔍 Detective</span><span class="setting-value" id="s-detective">—</span></div>
      <div class="setting-row"><span class="setting-key">💊 Doctor</span><span class="setting-value" id="s-doctor">—</span></div>
    </div>

    <!-- Players -->
    <span class="label">Players</span>
    <div class="players-grid" id="players-grid" style="margin-bottom:20px;">
      <p class="muted center" style="padding:16px;">Waiting for players…</p>
    </div>

    <!-- Actions -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn btn-success" id="btn-ready" onclick="toggleReady()">✅ Mark as ready</button>
      <button class="btn btn-primary" id="btn-start" onclick="handleStart()" style="display:none;" disabled>🎮 Start game</button>
      <button class="btn btn-danger"  id="btn-leave" onclick="handleLeave()">Leave room</button>
    </div>

  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/rooms.js"></script>
<script>
  const roomCode = new URLSearchParams(window.location.search).get("room")?.toUpperCase();
  const myUid    = window.currentUser.uid;
  let isReady    = false;
  let roomRef    = null;

  // Guard: must have room code
  if (!roomCode) window.location.href = "index.html";

  function showToast(msg, type="info", ms=3000) {
    const wrap = document.getElementById("toast-wrap");
    const t    = document.createElement("div");
    t.className = "toast " + type;
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.remove(), ms);
  }

  function copyCode() {
    navigator.clipboard.writeText(roomCode)
      .then(()  => showToast("Room code copied!", "success", 2000))
      .catch(()  => showToast("Code: " + roomCode, "info"));
  }

  // Start listening immediately (no auth needed)
  roomRef = window.db.ref("rooms/" + roomCode);

  roomRef.on("value", snap => {
    if (!snap.exists()) {
      showToast("Room no longer exists.", "error", 4000);
      setTimeout(() => { window.location.href = "index.html"; }, 3500);
      return;
    }
    const room = snap.val();
    renderLobby(room);

    // Redirect when game starts
    if (room.phase !== PHASES.LOBBY && room.status === "playing") {
      showToast("Game is starting!", "success", 2000);
      roomRef.off("value");
      setTimeout(() => { window.location.href = "game.html?room=" + roomCode; }, 1200);
    }
  });

  function renderLobby(room) {
    document.title = "Lobby " + room.roomCode + " — Mafia";
    document.getElementById("room-code-text").textContent = room.roomCode;

    const players   = Object.values(room.players || {});
    const readyAll  = players.length >= 2 && players.every(p => p.isReady);
    const isHost    = room.hostId === myUid;
    const readyCount= players.filter(p => p.isReady).length;

    document.getElementById("player-count-label").textContent =
      players.length + " / " + room.settings.maxPlayers + " players";

    const pct = players.length ? Math.round(readyCount / players.length * 100) : 0;
    document.getElementById("readiness-fill").style.width = pct + "%";

    document.getElementById("s-night").textContent    = room.settings.nightDuration   + "s";
    document.getElementById("s-discuss").textContent  = room.settings.discussDuration + "s";
    document.getElementById("s-vote").textContent     = room.settings.votingDuration  + "s";
    document.getElementById("s-detective").textContent= room.settings.rolesEnabled?.detective ? "✅ On" : "❌ Off";
    document.getElementById("s-doctor").textContent   = room.settings.rolesEnabled?.doctor    ? "✅ On" : "❌ Off";

    isReady = room.players?.[myUid]?.isReady ?? false;
    const readyBtn = document.getElementById("btn-ready");
    readyBtn.className   = isReady ? "btn btn-danger" : "btn btn-success";
    readyBtn.textContent = isReady ? "❌ Unready" : "✅ Mark as ready";

    const startBtn = document.getElementById("btn-start");
    startBtn.style.display = isHost ? "flex" : "none";
    startBtn.disabled = !readyAll;
    startBtn.textContent = readyAll
      ? "🎮 Start game"
      : `🎮 Waiting… (${readyCount}/${players.length} ready)`;

    renderPlayers(players, room.hostId);
  }

  function renderPlayers(players, hostId) {
    const grid = document.getElementById("players-grid");
    grid.innerHTML = "";

    if (!players.length) {
      grid.innerHTML = '<p class="muted center" style="padding:16px;">No players yet…</p>';
      return;
    }

    players.sort((a,b) => {
      if (a.uid === hostId) return -1;
      if (b.uid === hostId) return 1;
      return a.joinedAt - b.joinedAt;
    });

    players.forEach(p => {
      const isMe = p.uid === myUid;
      const card = document.createElement("div");
      card.className = "player-card" + (p.isReady ? " ready" : "");
      card.innerHTML = `
        <div class="avatar">${getInitials(p.displayName)}</div>
        <div class="player-info">
          <div class="player-name">
            ${escapeHtml(p.displayName)}
            ${isMe ? "<span style='color:var(--text2);font-weight:400;font-size:0.8rem;'>(you)</span>" : ""}
          </div>
          <div class="player-badges">
            ${p.uid === hostId ? '<span class="badge badge-host">Host</span>' : ""}
            <span class="badge ${p.isReady ? "badge-ready" : "badge-waiting"}">
              ${p.isReady ? "Ready" : "Waiting"}
            </span>
          </div>
        </div>
        <div class="ready-dot"></div>
      `;
      grid.appendChild(card);
    });
  }

  async function toggleReady() {
    const btn = document.getElementById("btn-ready");
    btn.disabled = true;
    try {
      await setReady(roomCode, !isReady);
    } catch(e) {
      showToast(e.message, "error");
    }
    setTimeout(() => { btn.disabled = false; }, 500);
  }

  async function handleStart() {
    const btn = document.getElementById("btn-start");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Starting…';
    try {
      await startGame(roomCode);
    } catch(e) {
      showToast(e.message, "error");
      btn.disabled = false;
      btn.textContent = "🎮 Start game";
    }
  }

  async function handleLeave() {
    if (!confirm("Leave the room?")) return;
    roomRef.off("value");
    await leaveRoom(roomCode);
    window.location.href = "index.html";
  }

  window.addEventListener("beforeunload", () => { if (roomRef) roomRef.off("value"); });
</script>
</body>
</html>
