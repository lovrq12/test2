<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوبي مستري بوكس</title>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lobby.css">
</head>
<body class="app-page lobby-page">
  <header class="top-bar">
    <a class="brand-link" href="index.html">مستري بوكس</a>
    <div class="room-code-panel">
      <span>كود الدعوة</span>
      <strong id="roomCodeLabel">-----</strong>
      <button id="copyCodeBtn" class="icon-button" type="button" title="نسخ الكود" aria-label="نسخ الكود">⧉</button>
    </div>
  </header>

  <main class="lobby-layout">
    <section class="panel players-panel">
      <div class="panel-heading">
        <h1>اللاعبون</h1>
        <span id="playersCount">0 / 16</span>
      </div>
      <div id="playersList" class="players-list"></div>
    </section>

    <section class="panel ready-panel">
      <h2>اختيار السكن</h2>
      <div id="lobbySkinPicker" class="lobby-skins"></div>
      <button id="readyBtn" class="primary-action" type="button">جاهز</button>
      <p id="lobbyStatus" class="status-line" role="status"></p>
    </section>

    <section id="hostControls" class="panel host-panel" hidden>
      <h2>إعدادات الهوست</h2>
      <label class="field">
        <span>وقت الجولة</span>
        <select id="roundTimeSelect">
          <option value="30">30 ثانية</option>
          <option value="45">45 ثانية</option>
          <option value="60" selected>60 ثانية</option>
          <option value="90">90 ثانية</option>
          <option value="120">120 ثانية</option>
        </select>
      </label>
      <label class="field">
        <span>الحد الأقصى للاعبين</span>
        <input id="maxPlayersInput" type="number" min="2" max="16" value="16">
      </label>
      <button id="startGameBtn" class="gold-action" type="button">بدء اللعبة</button>
    </section>

    <section class="panel chat-panel">
      <div class="panel-heading">
        <h2>شات اللوبي</h2>
      </div>
      <div id="lobbyChatList" class="chat-list" aria-live="polite"></div>
      <form id="lobbyChatForm" class="chat-form">
        <input id="lobbyChatInput" type="text" maxlength="180" placeholder="اكتب رسالة">
        <button type="submit">إرسال</button>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
