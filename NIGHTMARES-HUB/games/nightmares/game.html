<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmares — اللعبة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../../assets/shared/game-entry.css">
  <style>
    /* ── Extra game-page styles ── */
    .phase-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .phase-label.night   { background: rgba(129,140,248,0.15); color: #818cf8; }
    .phase-label.day     { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .phase-label.voting  { background: rgba(248,113,113,0.15); color: #f87171; }
    .phase-label.discussion { background: rgba(34,197,94,0.12); color: #86efac; }
    .phase-label.morning { background: rgba(251,191,36,0.12);  color: #fde68a; }

    #timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(168,85,247,0.12);
    }

    .round-badge {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
    }

    /* Mafia chat wrap in action panel */
    #mafia-chat-wrap {
      display: none;
      padding: 10px 20px;
      border-top: 1px solid rgba(239,68,68,0.15);
    }

    .mafia-chat-label {
      font-size: 11px;
      color: #f87171;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* Game table container */
    .game-table-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Chat tabs */
    .game-chat-tabs {
      display: flex;
      gap: 6px;
      padding: 6px 14px;
      border-bottom: 1px solid rgba(168,85,247,0.1);
      align-items: center;
    }

    /* Phase change flash */
    .phase-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8999;
      opacity: 0;
      animation: phase-flash-anim 1.5s ease forwards;
    }

    .phase-flash.to-night { background: radial-gradient(ellipse at center, rgba(60,20,100,0.6) 0%, transparent 70%); }
    .phase-flash.to-day   { background: radial-gradient(ellipse at center, rgba(251,191,36,0.2) 0%, transparent 70%); }

    @keyframes phase-flash-anim {
      0%   { opacity: 0; }
      20%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Player dead state extra */
    .gps-dead-x {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      pointer-events: none;
    }

    /* Skill used badge */
    .skill-used-badge {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      text-align: center;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      margin-top: 4px;
    }

    /* Confirm action btn */
    .confirm-action-btn {
      margin-top: 10px;
    }

    /* Spectate banner */
    #spectate-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(239,68,68,0.12);
      border-bottom: 1px solid rgba(239,68,68,0.3);
      padding: 8px;
      text-align: center;
      font-size: 13px;
      color: #f87171;
      font-weight: 700;
      z-index: 500;
      letter-spacing: 1px;
    }
  </style>
</head>
<body class="portal-nightmares portal-session">

<a class="portal-home-link" href="../../index.html">رجوع للرئيسية</a>

<!-- Spectate Banner -->
<div id="spectate-banner">⚰ أنت ميت — وضع المشاهدة</div>

<!-- Game Background -->
<div class="game-bg day" id="game-bg"></div>

<!-- Effects Layer -->
<div id="effects-layer"></div>

<!-- Loading -->
<div id="loading-screen">
  <div class="loading-logo">NIGHTMARES</div>
  <div class="loading-spinner"></div>
</div>

<!-- Cinematic Overlay -->
<div id="cinematic-overlay">
  <div id="cinematic-text"><h1></h1><p></p></div>
</div>

<!-- Role Reveal Modal (first load) -->
<div class="modal-overlay" id="role-reveal-modal">
  <div class="role-reveal-modal glass-card">
    <div class="role-reveal-card">
      <img id="rr-img" src="" alt="دور" loading="lazy" decoding="async">
    </div>
    <div class="role-reveal-name" id="rr-name"></div>
    <div class="role-reveal-desc" id="rr-desc"></div>
    <div style="margin-bottom:8px;font-size:13px;" id="rr-team"></div>
    <button class="btn btn-primary btn-full" id="rr-close">✓ فهمت دوري</button>
  </div>
</div>

<!-- Full Role Card Preview -->
<div class="role-preview-overlay" id="role-preview-modal">
  <div class="role-preview-card">
    <img id="role-preview-img" src="" alt="دور" loading="lazy" decoding="async">
  </div>
</div>

<!-- Whisper Reveal Overlay -->
<div class="whisper-reveal-overlay" id="whisper-reveal-overlay">
  <div class="whisper-label" style="font-size:15px;color:rgba(255,255,255,0.5);">الهمسة كشفت...</div>
  <div class="whisper-card-wrapper">
    <img id="whisper-reveal-img" src="" alt="" loading="lazy" decoding="async">
  </div>
  <div class="whisper-label" id="whisper-label"></div>
  <div class="whisper-countdown" id="whisper-countdown">10</div>
</div>

<!-- Win Screen -->
<div id="win-screen">
  <div class="win-title" id="win-title"></div>
  <div class="win-subtitle" id="win-subtitle"></div>
  <div class="win-roles-reveal" id="win-roles-reveal"></div>
  <div style="display:flex;gap:12px;margin-top:8px;">
    <button class="btn btn-ghost" onclick="window.location.href='index.html'">🏠 الرئيسية</button>
  </div>
</div>

<!-- Main Game Layout -->
<div id="game-page">

  <!-- ── Action Panel (right/start side in RTL) ── -->
  <div class="action-panel">

    <!-- Header -->
    <div class="action-panel-header">
      <div class="game-title-sm">NIGHTMARES</div>
      <div class="phase-indicator" id="phase-indicator">
        <div class="phase-dot"></div>
        <span id="phase-label-text" class="phase-label">تحميل...</span>
      </div>
    </div>

    <!-- Timer -->
    <div id="timer-wrap">
      <div class="round-badge" id="round-badge">الجولة ١</div>
      <div class="timer-display" id="timer-display">--:--</div>
    </div>

    <!-- Dead Banner -->
    <div class="dead-overlay-banner" id="dead-banner" style="display:none;"></div>

    <!-- My Role -->
    <div class="my-role-section">
      <h4>دورك في هذه اللعبة</h4>
      <div class="role-card-display" id="role-card-display">
        <img id="my-role-img" src="assets/cards/basic/citizen_new.png" alt="دور" loading="lazy" decoding="async">
        <div class="role-card-name">
          <span id="my-role-name">تحميل...</span>
          <span class="role-card-team" id="my-role-team"></span>
        </div>
      </div>
    </div>

    <!-- Night Action Section -->
    <div class="night-action-section" id="night-action-section" style="display:none;">
      <h4>⚡ فعل الليل</h4>
      <div class="target-list" id="night-target-list"></div>
      <button class="btn btn-primary btn-sm btn-full confirm-action-btn" id="confirm-night-action" style="display:none;">
        ✓ تأكيد الاختيار
      </button>
    </div>

    <!-- Ability Section (day abilities) -->
    <div class="ability-section" id="ability-section" style="display:none;">
      <h4>✨ قدرتك الخاصة</h4>
      <div id="ability-content"></div>
    </div>

    <!-- Voting Section -->
    <div class="voting-section" id="voting-section" style="display:none;">
      <h4>🗳 التصويت</h4>
      <div class="vote-list" id="vote-list"></div>
    </div>

    <!-- Mafia Chat (in panel, night only) -->
    <div id="mafia-chat-wrap">
      <div class="mafia-chat-label">🔴 دردشة المافيا السرية</div>
      <div class="mafia-chat-badge">دردشتك في القسم السفلي — تبويب المافيا</div>
    </div>

  </div>

  <!-- ── Game Main Area ── -->
  <div class="game-main">

    <!-- Table + Players -->
    <div class="game-table-area">
      <div class="game-table-container">
        <div class="game-players-ring" id="game-players-ring">
          <!-- Dynamic player seats -->
        </div>
      </div>
    </div>

    <!-- Chat -->
    <div class="game-chat">
      <div class="game-chat-tabs">
        <span class="chat-tab active" id="tab-public">💬 عام</span>
        <span class="chat-tab mafia-tab" id="tab-mafia" style="display:none;">🔴 مافيا</span>
        <div style="margin-right:auto;font-size:11px;color:rgba(255,255,255,0.25);" id="chat-lock-msg" style="display:none;">
          🔒 الدردشة مغلقة في الليل
        </div>
      </div>
      <div class="chat-messages" id="game-chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="game-chat-input" placeholder="اكتب رسالة..." maxlength="200" autocomplete="off">
        <button class="btn btn-primary btn-sm" id="game-chat-send">إرسال</button>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<!-- Sound Button -->
<div id="sound-btn">🔊</div>

<!-- Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/sound.js"></script>
<script src="js/roles.js"></script>
<script src="js/app.js"></script>
<script src="js/game.js"></script>
<script>
// ── Extra game-page UI glue ──────────────────────────────────────────────────

// Role reveal modal close
document.getElementById('rr-close').addEventListener('click', () => {
  document.getElementById('role-reveal-modal').classList.remove('active');
});

document.getElementById('role-card-display')?.addEventListener('click', () => {
  const img = document.getElementById('my-role-img');
  const preview = document.getElementById('role-preview-img');
  if (img && preview) {
    preview.src = img.src;
    preview.alt = img.alt || 'دور';
  }
  document.getElementById('role-preview-modal')?.classList.add('active');
});

document.getElementById('role-preview-modal')?.addEventListener('click', () => {
  document.getElementById('role-preview-modal')?.classList.remove('active');
});

// Show my role card (called from game.js)
function showMyRoleCard(me) {
  const roleData = RoleEngine.getRole(me.role);
  document.getElementById('rr-img').src = roleData.image;
  document.getElementById('rr-name').textContent = roleData.arabicName;
  document.getElementById('rr-name').style.color = roleData.color;
  document.getElementById('rr-desc').textContent = roleData.description;

  const teamMap = { mafia: '⚔ فريق المافيا', citizens: '🛡 المواطنون', neutral: '⚖ محايد' };
  document.getElementById('rr-team').textContent = teamMap[roleData.team] || '';
  document.getElementById('rr-team').style.color = roleData.color;

  document.getElementById('role-reveal-modal').classList.add('active');

  // Show mafia teammates if mafia
  if (RoleEngine.isMafia(me.role)) {
    showToast('أنت من المافيا 🔴', 'error', 4000);
  }
}

// Phase label updater - called from game.js onRoomUpdate
const origOnRoomUpdate = onRoomUpdate;
window.onRoomUpdate_extended = function(data) {
  if (!data) return;
  const phase = data.game?.phase;
  const round = data.game?.round || 1;

  // Phase label
  const labelEl = document.getElementById('phase-label-text');
  const indicator = document.getElementById('phase-indicator');
  const phaseMap = {
    night: { ar: '🌑 الليل', cls: 'night' },
    morning: { ar: '🌅 الصباح', cls: 'morning' },
    day: { ar: '☀ النهار', cls: 'day' },
    discussion: { ar: '💬 نقاش', cls: 'discussion' },
    voting: { ar: '🗳 تصويت', cls: 'voting' },
  };
  const info = phaseMap[phase] || { ar: phase, cls: '' };
  if (labelEl) { labelEl.textContent = info.ar; labelEl.className = `phase-label ${info.cls}`; }
  if (indicator) { indicator.className = `phase-indicator ${info.cls}`; }

  // Round badge
  const roundBadge = document.getElementById('round-badge');
  if (roundBadge) roundBadge.textContent = `الجولة ${toArabicNum(round)}`;

  // Spectate banner
  const me = data.players?.[session.id];
  const spectBanner = document.getElementById('spectate-banner');
  if (spectBanner) spectBanner.style.display = me && !me.alive ? '' : 'none';

  // Night body class
  if (phase === 'night') {
    document.body.classList.add('night-phase');
  } else {
    document.body.classList.remove('night-phase');
  }
};

// Patch onRoomUpdate to also run extended logic
const _orig = onRoomUpdate;
window.onRoomUpdate = function(data) {
  _orig(data);
  window.onRoomUpdate_extended(data);
};
// Re-subscribe with patched handler
DB.ref(`rooms/${session?.roomId || ''}`).off('value');
setTimeout(() => {
  const s = Session.getPlayer();
  if (s.roomId) {
    DB.on(`rooms/${s.roomId}`, (data) => window.onRoomUpdate(data));
  }
}, 200);

function toArabicNum(n) {
  return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}
</script>
</body>
</html>
